name: Exact installed recorder alert diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/recorder-alert-diagnostics-20261122]
    paths:
      - .github/workflows/recorder-alert-diagnostics.yml
      - tests/integration/test_windows_recorder_alert_diagnostic.py
      - tests/unit/test_windows_recorder_alert_diagnostic_contract.py

permissions:
  contents: read
  actions: read

concurrency:
  group: installed-recorder-alert-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-recorder-alert:
    name: DIAGNOSTIC ONLY - exact23 installed alert persistence
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      K5_DESKTOP_HEAD_SHA: 23a24e57679534d77a5ea3881902f24a2d8e8e5f
      K5_DESKTOP_SETUP_SHA256: ee8868069902cc2112b619df3240f10c6c5214acfa91846e14b295e20dd98935
      K5_NATIVE_RECORDER_ALERT_DIAGNOSTIC: "1"
      K5_OPERATOR_BROWSER_ACCEPTANCE: "1"
      K5_OPERATOR_BROWSER_CHANNEL: msedge
      K5_DIAGNOSTIC_HARNESS_HEAD_SHA: ${{ github.sha }}
      K5_RECORDER_ALERT_DIAGNOSTIC_SHA256: 8d844633873e7439e5cca0fb6c80ba73aab4c0574df4c7e8992a26b530b0d669
    steps:
      - name: Checkout exact installer source and normal native helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 23a24e57679534d77a5ea3881902f24a2d8e8e5f
          persist-credentials: false
      - name: Checkout separately identified component diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - name: Admit original installer source, artifact and successful native GUI producer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          $meta = Invoke-RestMethod -Uri "$api/artifacts/14745897366" -Headers $headers
          $attempt = Invoke-RestMethod -Uri "$api/runs/45001731180/attempts/1" -Headers $headers
          $jobs = Invoke-RestMethod -Uri "$api/runs/45001731180/attempts/1/jobs?per_page=100" -Headers $headers
          $producer = @($jobs.jobs | Where-Object { $_.id -eq 137144542629 })
          if ($meta.id -ne 14745897366 -or $meta.expired -ne $false -or
              $meta.name -ne "k5-vision-windows-upgrade-candidate-$($env:K5_DESKTOP_HEAD_SHA)-45001731180-attempt-1" -or
              $meta.size_in_bytes -ne 285148987 -or
              $meta.digest -ne 'sha256:d25e812247d592866c1f02c05754e9d2d62dea667a9aa3b31766f2f0a2f4a489' -or
              $meta.workflow_run.id -ne 45001731180 -or $meta.workflow_run.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or
              $attempt.id -ne 45001731180 -or $attempt.run_attempt -ne 1 -or $attempt.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or
              $producer.Count -ne 1 -or $producer[0].conclusion -ne 'success') {
            throw 'Original alert candidate or successful GUI producer identity mismatch'
          }
      - name: Download only the exact admitted original candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 14745897366
          github-token: ${{ github.token }}
          run-id: 45001731180
          path: recorder-alert-input
          merge-multiple: true
      - name: Bind complete installer bytes and only two diagnostic Git blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = (& git rev-parse HEAD).Trim()
          $harness = (& git -C diagnostic-source rev-parse HEAD).Trim()
          $setup = Get-Item -LiteralPath recorder-alert-input/K5VisionSetup.exe
          $sha = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $package = Get-Content -LiteralPath recorder-alert-input/desktop-package.json -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath recorder-alert-input/payload-manifest.json -Raw | ConvertFrom-Json
          $manifestSha = (Get-FileHash -LiteralPath recorder-alert-input/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($product -ne $env:K5_DESKTOP_HEAD_SHA -or $harness -ne $env:K5_DIAGNOSTIC_HARNESS_HEAD_SHA -or $product -eq $harness -or
              $setup.Length -ne 286587086 -or $sha -ne $env:K5_DESKTOP_SETUP_SHA256 -or
              $package.setup_sha256 -ne $sha -or $package.setup_bytes -ne $setup.Length -or
              $package.head_sha -ne $product -or $manifest.head_sha -ne $product -or
              $package.run_id -ne 45001731180 -or $package.run_attempt -ne 1 -or $package.qualification_status -ne 'unqualified' -or
              $manifestSha -ne '41878219fa16c6e68b79dffabb468673e7821c3688fb181cd7749685551ea821' -or
              $package.payload_manifest_sha256 -ne $manifestSha -or
              $package.launcher_sha256 -ne '134d6cb027d188ac936410d5c72f924e2bf99d275895d5248c6dd29748cdba52' -or
              $manifest.files.path -notcontains 'K5VisionRecorder.exe' -or $manifest.files.path -notcontains 'K5VisionRecorder.xml') {
            throw 'Original installed alert source or full byte identity mismatch'
          }
          & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c 'git -C diagnostic-source cat-file blob HEAD:tests/integration/test_windows_recorder_alert_diagnostic.py > recorder-alert-admitted.py'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath recorder-alert-admitted.py -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:K5_RECORDER_ALERT_DIAGNOSTIC_SHA256) {
            throw 'Installed alert diagnostic source identity mismatch'
          }
          & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c 'git -C diagnostic-source cat-file blob HEAD:tests/unit/test_windows_recorder_alert_diagnostic_contract.py > recorder-alert-contract-admitted.py'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath recorder-alert-contract-admitted.py -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ecb83854eb749ef1ca91222e3c49956859578b2ae9afbf24751d6fc1632bc04c') {
            throw 'Public alert diagnostic contract source identity mismatch'
          }
          Copy-Item -LiteralPath recorder-alert-admitted.py -Destination tests/integration/test_windows_recorder_alert_diagnostic.py
          Copy-Item -LiteralPath recorder-alert-contract-admitted.py -Destination tests/unit/test_windows_recorder_alert_diagnostic_contract.py
          "K5_DESKTOP_SETUP=$($setup.FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          @{ schema_version=1; diagnostic_only=$true; product_qualification=$false;
             installer_head=$product; harness_head=$harness; installer_sha256=$sha; installer_bytes=$setup.Length;
             candidate_artifact_id=14745897366; candidate_run_id=45001731180; candidate_run_attempt=1; candidate_producer_job_id=137144542629;
             wrapper_sha256=$env:K5_RECORDER_ALERT_DIAGNOSTIC_SHA256; replay_run_id=$env:GITHUB_RUN_ID; replay_run_attempt=$env:GITHUB_RUN_ATTEMPT } |
            ConvertTo-Json | Set-Content -LiteralPath installed-recorder-alert-provenance.json -Encoding utf8
      - name: Prepare only the disposable CI user's browser
        uses: ./.github/actions/prepare-windows-browser
      - name: Set up diagnostic controller Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install original acceptance dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]" "playwright==1.58.0"
          if ($LASTEXITCODE -ne 0) { throw 'Installed alert controller dependency installation failed' }
      - name: Provision exact original manifest's generated-source tools
        uses: ./.github/actions/provision-operator-tools
      - name: Verify finite public event projection controls
        shell: pwsh
        run: |
          python -m pytest tests/unit/test_windows_recorder_alert_diagnostic_contract.py -o addopts= --no-cov -q
          if ($LASTEXITCODE -ne 0) { throw 'Public alert diagnostic contract controls failed' }
      - name: Exercise installed no-write, backend crash, durable fault and actual-write recovery
        timeout-minutes: 8
        shell: pwsh
        run: |
          python -m pytest tests/integration/test_windows_recorder_alert_diagnostic.py -o addopts= --no-cov -s --tb=short -o faulthandler_timeout=400 --junitxml=installed-recorder-alert-diagnostic.xml
          $result = $LASTEXITCODE
          [xml]$xml = Get-Content -LiteralPath installed-recorder-alert-diagnostic.xml -Raw
          $props = @($xml.SelectNodes('//property'))
          $bindings = @($xml.SelectNodes('//property[@name="diagnostic_only_installed_recorder_alert_binding"]'))
          $observations = @($xml.SelectNodes('//property[@name="diagnostic_only_installed_recorder_alert_observation"]'))
          if ($props.Count -ne 2 -or $bindings.Count -ne 1 -or $observations.Count -ne 1 -or
              @($props | Where-Object { $_.name -notlike 'diagnostic_only_installed_recorder_alert_*' }).Count -ne 0) {
            throw 'Installed recorder alert diagnostic emitted a normal or invalid receipt scope'
          }
          $binding = $bindings[0].value | ConvertFrom-Json
          $observed = $observations[0].value | ConvertFrom-Json
          if ($binding.diagnostic_only -ne $true -or $binding.product_qualification -ne $false -or
              $binding.installer_head -ne $env:K5_DESKTOP_HEAD_SHA -or $binding.harness_head -ne $env:K5_DIAGNOSTIC_HARNESS_HEAD_SHA -or
              $binding.installer_sha256 -ne $env:K5_DESKTOP_SETUP_SHA256 -or $binding.wrapper_sha256 -ne $env:K5_RECORDER_ALERT_DIAGNOSTIC_SHA256 -or
              $binding.product_monitor_canonical_lf_sha256 -ne '0f8b62be95e772de55d2bccfc489d55e1f14e3561bba8198f1c8726a39a688d0' -or
              $observed.diagnostic_only -ne $true -or $observed.product_qualification -ne $false) {
            throw 'Installed recorder alert diagnostic product/harness binding mismatch'
          }
          if ($result -ne 0 -or $observed.stage -ne 'completed' -or $observed.cleanup_complete -ne $true -or
              $observed.evidence.active_public_tuple_preserved -ne $true -or $observed.evidence.fresh_recording_resolved_fault -ne $true) {
            throw 'Installed recorder alert component experiment did not complete its criteria'
          }
      - name: Retain only explicitly diagnostic component observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-only-23-installed-recorder-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            installed-recorder-alert-diagnostic.xml
            installed-recorder-alert-provenance.json
          if-no-files-found: warn
          retention-days: 14
