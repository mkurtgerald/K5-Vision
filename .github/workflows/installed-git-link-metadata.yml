name: Installed Runner ACL Read-only Metadata Diagnostic
run-name: Fixed runner ACL metadata at ${{ github.sha }}

# One reviewed isolated publication; no dispatch, schedule, retry, or main trigger.
on:
  push:
    branches: [review/git-link-metadata-20261008]
    paths: [.github/workflows/installed-git-link-metadata.yml]

permissions:
  contents: read

concurrency:
  group: k5-fixed-git-readonly-diagnostic
  cancel-in-progress: false

env:
  K5_DIAGNOSTIC_SHA: ${{ github.sha }}

jobs:
  hosted_qualify:
    if: >-
      github.repository == 'mkurtgerald/K5-Vision' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/review/git-link-metadata-20261008' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted == false &&
      github.event.forced == false
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      qualification: ${{ steps.qualify.outcome }}
      post_admission: ${{ steps.post.outcome }}
    steps:
      - name: Parse wrapper and compile collector only
        id: qualify
        timeout-minutes: 2
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
          K5_METADATA_MODE: HostedQualify
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          # API origin, blob identity, byte count and digest are fixed by reviewed source.
          # No checkout, executable path lookup, redirects, retries, or source-file reopen.
          $expectedBlob = '75103fac61cbab713ec18c4eae7f8d5658292753'
          $expectedDigest = 'cc77bdfb6fcca9cc3f3d42c43bc2c38280c501483215aae0ebcd143a012165e1'
          $expectedSize = 25182
          $maximumResponse = 131072
          $strictUtf8 = [Text.UTF8Encoding]::new($false, $true)
          $response = $null
          $stream = $null
          $memory = $null
          $sha1 = $null
          $sha256 = $null
          try {
              if ($env:GITHUB_API_URL -cne 'https://api.github.com' -or
                  $env:GITHUB_REPOSITORY -cne 'mkurtgerald/K5-Vision' -or
                  [string]::IsNullOrEmpty($env:K5_GITHUB_TOKEN) -or
                  $env:K5_GITHUB_TOKEN.Length -gt 8192 -or
                  $expectedSize -le 0 -or $expectedSize -gt 65536) { throw 'context' }
              $url = 'https://api.github.com/repos/mkurtgerald/K5-Vision/git/blobs/' + $expectedBlob
              $request = [Net.HttpWebRequest]::Create($url)
              $request.Method = 'GET'
              $request.AllowAutoRedirect = $false
              $request.Timeout = 15000
              $request.ReadWriteTimeout = 15000
              $request.MaximumResponseHeadersLength = 16
              $request.AutomaticDecompression = [Net.DecompressionMethods]::None
              $request.Accept = 'application/vnd.github+json'
              $request.UserAgent = 'K5-fixed-readonly-diagnostic'
              $request.Headers['Authorization'] = 'Bearer ' + $env:K5_GITHUB_TOKEN
              $request.Headers['X-GitHub-Api-Version'] = '2022-11-28'
              $response = $request.GetResponse()
              if ([int]$response.StatusCode -ne 200 -or
                  $response.ResponseUri.AbsoluteUri -cne $url -or
                  $response.ContentLength -gt $maximumResponse) { throw 'response' }
              $stream = $response.GetResponseStream()
              $memory = [IO.MemoryStream]::new()
              $buffer = [byte[]]::new(4096)
              while ($true) {
                  $remaining = $maximumResponse - [int]$memory.Length
                  if ($remaining -le 0) { throw 'response_bound' }
                  $read = $stream.Read($buffer, 0, [Math]::Min($buffer.Length, $remaining))
                  if ($read -eq 0) { break }
                  $memory.Write($buffer, 0, $read)
                  if ($memory.Length -gt $maximumResponse) { throw 'response_bound' }
              }
              $record = ConvertFrom-Json -InputObject $strictUtf8.GetString($memory.ToArray()) -ErrorAction Stop
              if ($record.sha -isnot [string] -or $record.sha -cne $expectedBlob -or
                  $record.encoding -cne 'base64' -or $record.size -ne $expectedSize -or
                  $record.content -isnot [string] -or $record.content.Length -gt 100000) { throw 'blob' }
              $encoded = $record.content.Replace("`r", '').Replace("`n", '')
              if ($encoded -cnotmatch '\A[A-Za-z0-9+/]+={0,2}\z' -or
                  $encoded.Length -ne 4 * [Math]::Ceiling($expectedSize / 3.0)) { throw 'base64' }
              $bytes = [Convert]::FromBase64String($encoded)
              if ($bytes.Length -ne $expectedSize) { throw 'size' }
              $sha256 = [Security.Cryptography.SHA256]::Create()
              $actual = ([BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
              if ($actual -cne $expectedDigest) { throw 'digest' }
              $header = [Text.Encoding]::ASCII.GetBytes('blob ' + [string]$bytes.Length + [char]0)
              $gitBytes = [byte[]]::new($header.Length + $bytes.Length)
              [Array]::Copy($header, 0, $gitBytes, 0, $header.Length)
              [Array]::Copy($bytes, 0, $gitBytes, $header.Length, $bytes.Length)
              $sha1 = [Security.Cryptography.SHA1]::Create()
              $gitBlob = ([BitConverter]::ToString($sha1.ComputeHash($gitBytes))).Replace('-', '').ToLowerInvariant()
              if ($gitBlob -cne $expectedBlob) { throw 'git_blob' }
              $script = [scriptblock]::Create($strictUtf8.GetString($bytes))
              & $script -Mode $env:K5_METADATA_MODE
          } catch {
              # Never emit raw API, compiler, process, path, environment or exception text.
              throw 'Pinned Git metadata diagnostic step refused; existing owners were preserved.'
          } finally {
              foreach ($owned in @($sha1, $sha256, $memory, $stream, $response)) {
                  if ($null -ne $owned) { $owned.Dispose() }
              }
          }

