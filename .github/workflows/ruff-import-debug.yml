name: Stage 04 Import Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  import-order:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff==0.16.8"
      - name: Show required import diff
        run: ruff check --select I --fix --diff tests/integration/test_stage04_physical.py
