name: Windows Alpha Script Smoke

on:
  pull_request:
    paths:
      - "Install-K5VisionAlpha.ps1"
      - "scripts/windows-alpha/**"
      - "src/k5vision/operator_runtime.py"
      - "tests/test_windows_alpha_bootstrap.py"
      - "tests/test_public_test_operator_runtime.py"
      - ".github/workflows/windows-alpha-script-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/windows-alpha/**"
      - "src/k5vision/operator_runtime.py"
      - "tests/test_windows_alpha_bootstrap.py"
      - "tests/test_public_test_operator_runtime.py"
      - ".github/workflows/windows-alpha-script-smoke.yml"

permissions:
  contents: read

jobs:
  windows-alpha-script:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse Windows alpha PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -LiteralPath scripts\windows-alpha -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $failed = $true
                  $parseErrors | ForEach-Object { Write-Error $_.Message }
              }
          }
          if ($failed) { throw "Windows alpha PowerShell parse failed." }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Windows alpha boundary regressions
        shell: powershell
        run: |
          pytest tests/test_one_file_windows_bootstrap.py tests/test_windows_alpha_bootstrap.py tests/test_public_test_operator_runtime.py -q --no-cov
