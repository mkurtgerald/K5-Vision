name: Windows Alpha Script Smoke

on:
  pull_request:
    paths:
      - "Install-K5VisionAlpha.ps1"
      - "scripts/windows-alpha/**"
      - "src/k5vision/operator_runtime.py"
      - "src/k5vision/main.py"
      - "src/k5vision/stage_one_app.py"
      - "tests/test_app_resource_lifetime.py"
      - "src/k5vision/cli.py"
      - "tests/test_cli.py"
      - "src/k5vision/identity_state.py"
      - "src/k5vision/windows_identity_security.py"
      - "src/k5vision/recovery_admin.py"
      - "src/k5vision/services/user_registry.py"
      - "tests/test_recovery_admin.py"
      - "tests/test_recovery_admin_windows.py"
      - "tests/test_windows_identity_security.py"
      - "docs/RECOVERY_ADMIN.md"
      - "tests/test_windows_alpha_bootstrap.py"
      - "tests/test_windows_alpha_upgrade.py"
      - "tests/test_public_test_operator_runtime.py"
      - "tests/test_windows_alpha_direct_witness.py"
      - "tests/test_windows_alpha_analytics.py"
      - "tests/test_windows_alpha_preflight_boundary.py"
      - "scripts/windows_owned_preflight.py"
      - "scripts/installed_analytics_witness.py"
      - "scripts/installed_alpha_launcher_witness.py"
      - "tests/test_installed_analytics_witness.py"
      - "tests/test_installed_alpha_launcher_witness.py"
      - "tests/test_installed_analytics_candidate_workflow.py"
      - ".github/workflows/installed-analytics-candidate.yml"
      - ".github/workflows/windows-alpha-script-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/windows-alpha/**"
      - "src/k5vision/operator_runtime.py"
      - "src/k5vision/main.py"
      - "src/k5vision/stage_one_app.py"
      - "tests/test_app_resource_lifetime.py"
      - "src/k5vision/cli.py"
      - "tests/test_cli.py"
      - "src/k5vision/identity_state.py"
      - "src/k5vision/windows_identity_security.py"
      - "src/k5vision/recovery_admin.py"
      - "src/k5vision/services/user_registry.py"
      - "tests/test_recovery_admin.py"
      - "tests/test_recovery_admin_windows.py"
      - "tests/test_windows_identity_security.py"
      - "docs/RECOVERY_ADMIN.md"
      - "tests/test_windows_alpha_bootstrap.py"
      - "tests/test_windows_alpha_upgrade.py"
      - "tests/test_public_test_operator_runtime.py"
      - "tests/test_windows_alpha_direct_witness.py"
      - "tests/test_windows_alpha_analytics.py"
      - "tests/test_windows_alpha_preflight_boundary.py"
      - "scripts/windows_owned_preflight.py"
      - "scripts/installed_analytics_witness.py"
      - "scripts/installed_alpha_launcher_witness.py"
      - "tests/test_installed_analytics_witness.py"
      - "tests/test_installed_alpha_launcher_witness.py"
      - "tests/test_installed_analytics_candidate_workflow.py"
      - ".github/workflows/installed-analytics-candidate.yml"
      - ".github/workflows/windows-alpha-script-smoke.yml"

permissions:
  contents: read

jobs:
  windows-alpha-script:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Parse Windows alpha PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -LiteralPath scripts\windows-alpha -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $failed = $true
                  $parseErrors | ForEach-Object { Write-Error $_.Message }
              }
          }
          if ($failed) { throw "Windows alpha PowerShell parse failed." }

      - name: Set up Python
        id: runtime_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify clean Windows alpha runtime dependency install
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP "k5-alpha-runtime-probe"
          python -m venv $probe
          $probePython = Join-Path $probe "Scripts\python.exe"
          & $probePython -m pip install --upgrade pip
          & $probePython -m pip install --requirement scripts\windows-alpha\runtime-requirements.txt
          & $probePython -m pip install --no-deps .
          & $probePython -m pip check
          & $probePython -m k5vision.cli --version

      - name: Run Windows alpha boundary regressions
        shell: powershell
        run: |
          pytest tests/test_one_file_windows_bootstrap.py tests/test_windows_alpha_bootstrap.py tests/test_windows_alpha_upgrade.py tests/test_public_test_operator_runtime.py tests/test_windows_alpha_direct_witness.py tests/test_app_resource_lifetime.py tests/test_windows_alpha_analytics.py tests/test_cli.py -q --no-cov

      - name: Qualify Windows local recovery identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP "k5-alpha-runtime-probe"
          $env:K5_RECOVERY_TEST_PYTHON = Join-Path $probe "Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $env:K5_RECOVERY_TEST_PYTHON -PathType Leaf)) {
              throw "Clean installed runtime probe is missing."
          }
          $qualification = @'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from uuid import uuid4
          from k5vision.identity_state import validate_new_identity_directory

          root = Path(os.environ["LOCALAPPDATA"]) / ("K5 Recovery pytest-" + uuid4().hex)
          validate_new_identity_directory(root)
          root.mkdir(mode=0o700)
          try:
              base = root / "pytest"
              validate_new_identity_directory(base)
              result = subprocess.run([
                  sys.executable, "-m", "pytest",
                  "tests/test_recovery_admin.py",
                  "tests/test_recovery_admin_windows.py",
                  "tests/test_windows_identity_security.py",
                  "-q", "-rP", "--no-cov", "-o", "junit_family=xunit1",
                  "--junitxml=recovery-windows-results.xml", "--basetemp", str(base),
              ], check=False, timeout=600)
              raise SystemExit(result.returncode)
          finally:
              shutil.rmtree(root)
          '@
          $qualification | python -
          if ($LASTEXITCODE -ne 0) { throw "Windows local recovery identity qualification failed." }

      - name: Verify exact candidate workflow and owned Windows relay boundary
        shell: powershell
        env:
          K5_SETUP_PYTHON: ${{ steps.runtime_python.outputs.python-path }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:K5_WITNESS_BASE_PYTHON = [IO.Path]::GetFullPath($env:K5_SETUP_PYTHON)
          $env:K5_WITNESS_BASE_PYTHON_SHA256 = (Get-FileHash -LiteralPath $env:K5_WITNESS_BASE_PYTHON -Algorithm SHA256).Hash.ToLowerInvariant()
          python -m pytest tests/test_installed_analytics_candidate_workflow.py --no-cov -q
          if ($LASTEXITCODE -ne 0) { throw "Candidate workflow boundary qualification failed." }
          python -m pytest tests/test_installed_analytics_witness.py -k "typed_job_accounting or gate_uses_independently or gate_base_admission or environment_preserves_only_explicit_gate or dependency_download_has_fixed or windows_real_venv_child_is_owned or real_windows_job_fixture" --no-cov -q -rP
          if ($LASTEXITCODE -ne 0) { throw "Owned Windows relay boundary qualification failed." }
          python -m pytest tests/test_installed_alpha_launcher_witness.py::test_windows_real_directory_guard_remembers_created_then_deleted_session --no-cov -q -rP
          if ($LASTEXITCODE -ne 0) { throw "Owned Windows directory observation qualification failed." }
          $env:K5_PREFLIGHT_PROBE_PYTHON = Join-Path $env:RUNNER_TEMP "k5-alpha-runtime-probe\Scripts\python.exe"
          python -m pytest tests/test_windows_alpha_preflight_boundary.py --no-cov -q -s
          if ($LASTEXITCODE -ne 0) { throw "Owned Start preflight boundary observation failed." }
