name: Stage 05 Physical Readiness

on:
  workflow_dispatch:
    inputs:
      reviewed_branch:
        description: Exact branch whose current head is being qualified
        required: true
        type: string
      reviewed_sha:
        description: Exact reviewed commit selected for this qualification
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage05-physical:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 20
    env:
      K5_STAGE05_PHYSICAL: "1"
      K5_STAGE05_OUTPUT: ${{ github.workspace }}\artifacts\stage05-readiness.json
      K5_STAGE05_REVISION: ${{ inputs.reviewed_sha }}

    steps:
      - name: Verify exact reviewed branch head
        shell: powershell
        env:
          K5_REVIEWED_BRANCH: ${{ inputs.reviewed_branch }}
          K5_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_REVIEWED_BRANCH)) {
            throw "Reviewed branch is required."
          }
          if ($env:K5_REVIEWED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Reviewed SHA must be an exact 40-character commit SHA."
          }
          $encodedBranch = [uri]::EscapeDataString($env:K5_REVIEWED_BRANCH)
          $headers = @{
            Authorization = "Bearer $env:K5_GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/$encodedBranch"
          $branch = Invoke-RestMethod -Method Get -Headers $headers -Uri $uri
          if ($branch.commit.sha -ne $env:K5_REVIEWED_SHA) {
            throw "Reviewed SHA is not the current head of the reviewed branch."
          }

      - name: Checkout exact Stage 05 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false

      - name: Provision isolated reviewed GStreamer runtime
        shell: powershell
        run: .\scripts\provision-stage03-gstreamer.ps1

      - name: Verify reviewed runtime surface
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("gst-launch-1.0", "gst-inspect-1.0")) {
            if ($null -eq (Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Required Stage 05 GStreamer executable is unavailable."
            }
          }

          $versionOutput = @(& gst-launch-1.0 --version 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not ($versionOutput -join "`n").Contains("GStreamer 1.28.7")) {
            throw "Stage 05 did not resolve the reviewed GStreamer 1.28.7 runtime."
          }

          foreach ($plugin in @("rtspsrc", "queue", "fakesink")) {
            & gst-inspect-1.0 $plugin *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Required Stage 05 GStreamer plugin is unavailable."
            }
          }

      - name: Verify private physical configuration
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Required Stage 05 physical source configuration is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CAM_CRED)) {
            throw "Required Stage 05 physical credential configuration is missing."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve private camera credential candidate
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          $index = & python -m k5vision.stage03_credential_probe "env:K5_STAGE03_SOURCE"
          if ($LASTEXITCODE -ne 0 -or $index -notmatch '^\d+$') {
            throw "No supplied camera credential candidate authenticated the Stage 05 source."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "K5_STAGE03_CREDENTIAL_INDEX=$index"

      - name: Run Stage 05 readiness workload
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: pytest tests/integration/test_stage05_physical.py -q --no-cov

      - name: Upload source-free Stage 05 evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage05-readiness-evidence
          path: artifacts/stage05-readiness.json
          if-no-files-found: warn
          retention-days: 14
