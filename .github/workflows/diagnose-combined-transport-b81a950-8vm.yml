name: Diagnose combined media transport on 8 Windows VMs b81a950

on:
  pull_request:
    types: [opened]
    branches: [codex/beta-integration-20261112]
    paths: [.github/workflows/diagnose-combined-transport-b81a950-8vm.yml]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    name: Observe combined media transport on VM ${{ matrix.probe }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        probe: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      K5_OPERATOR_BROWSER_ACCEPTANCE: "1"
      K5_OPERATOR_BROWSER_CHANNEL: msedge
      K5_BETA_HEAD_SHA: b81a950975e50979f57b20fb13cdbfbe73fd1aac
      K5_DESKTOP_HEAD_SHA: b81a950975e50979f57b20fb13cdbfbe73fd1aac
      K5_VM_CLOCK_ACCEPTANCE: "0"
      K5_TRANSPORT_DIAGNOSTIC_PROBE: ${{ matrix.probe }}
      K5_DIAGNOSTIC_DISPATCHER_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact failed product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b81a950975e50979f57b20fb13cdbfbe73fd1aac
          persist-credentials: false
      - name: Checkout the separately pinned diagnostic dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .transport-diagnostic-dispatcher
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the original development Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Admit frozen source, dispatcher and exact successful GUI producer
        shell: python
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          import hashlib,json,os,platform,subprocess,urllib.request
          from pathlib import Path
          assert __debug__ and platform.system() == 'Windows'
          assert os.environ['GITHUB_REPOSITORY'] == 'mkurtgerald/K5-Vision'
          assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          assert os.environ['RUNNER_OS'] == 'Windows'
          source='b81a950975e50979f57b20fb13cdbfbe73fd1aac'
          tree='41a09ec229b848cc7594453fb61ba5f8e9bd16d9'
          dispatcher=Path('.transport-diagnostic-dispatcher').resolve()
          def git(root,*args):
              return subprocess.check_output(['git',*args],cwd=root,text=True).strip()
          assert git('.', 'rev-parse','HEAD') == source
          assert git('.', 'rev-parse','HEAD^{tree}') == tree
          assert not git('.', 'status','--porcelain','--untracked-files=no')
          observed=git(dispatcher,'rev-parse','HEAD')
          assert observed == os.environ['K5_DIAGNOSTIC_DISPATCHER_SHA']
          assert git(dispatcher,'rev-list','--parents','-n','1','HEAD').split() == [observed,source]
          allowed=['.github/workflows/diagnose-combined-transport-b81a950-8vm.yml','scripts/observe_combined_transport_b81a950.py']
          assert git(dispatcher,'diff','--name-status',source,'HEAD').splitlines() == ['A\t'+p for p in allowed]
          helper=dispatcher/'scripts/observe_combined_transport_b81a950.py'
          assert hashlib.sha256(helper.read_bytes()).hexdigest() == '5c4fc14de2facea7a55927d4aaa8e274e8d79bc13267c6a2b2539f7e763c0bdb'
          for name,expected in {'tests/integration/test_windows_desktop_app.py': 'e32632d81211987fccfb9b5412fcaa2759fe08ff0ad8db99b1dfba907efbf1ad', 'tests/integration/test_operator_product_runtime.py': 'd7c7eaa38fe36843a937e57d60b696a93bca66599b3883e51d84cd1f37345106', 'tests/integration/test_operator_beta_browser.py': '67eea5d12df2cfe6e19603fe459405eac05c93e6db8d59c068a23f69a573f771', 'tests/integration/installed_settings_acceptance.py': '3fcda240480194282712ee1e18fb820a327b9e0b840987775a358900c22bf165', '.github/actions/provision-operator-tools/action.yml': 'e50c55c29830ed793c0500e52628d145580d23209f49c9369a2c218e722c0c00', 'scripts/provision_operator_person_acceptance.py': '3dc414b2aa0ba92cae73ab02b81ffdca43386e5e0e1274c02dc0c52110d3c896'}.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected
          subprocess.run(['python',str(helper),'--source','.', '--preflight-only'],check=True)
          headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'K5-combined-transport-diagnostic'}
          def document(route):
              request=urllib.request.Request('https://api.github.com/repos/mkurtgerald/K5-Vision'+route,headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read(4194305)
              assert len(raw)<=4194304
              return json.loads(raw)
          run=document('/actions/runs/43349156360')
          assert run['id']==43349156360 and run['head_sha']==source and run['run_attempt']==1
          assert run['path']=='.github/workflows/operator-desktop-windows.yml'
          assert run['status'] in {'in_progress','completed'} and run['conclusion'] in {None,'success','failure'}
          jobs=document('/actions/runs/43349156360/attempts/1/jobs?per_page=100')['jobs']
          producer=[row for row in jobs if row['id']==131635698601]
          assert len(producer)==1 and producer[0]['conclusion']=='success' and producer[0]['head_sha']==source
          
          pins=[(14003800633,'k5-vision-windows-setup-'+source,298611267,'de4dbda0677d9cbfd35ecb82d28cad01e756c6ab95e4093e4feb4ab51ed0db8b'),(14004020113,'desktop-windows-witness-43349156360',7067,'4eaf46c93717f9ea62d07b5504cbe868215cd572666b4fb21eff4dd7b04852bb')]
          for identifier,name,size,digest in pins:
              artifact=document('/actions/artifacts/'+str(identifier))
              assert artifact['id']==identifier and artifact['name']==name and artifact['size_in_bytes']==size
              assert artifact['expired'] is False and artifact['digest']=='sha256:'+digest
              assert artifact['workflow_run']['id']==43349156360 and artifact['workflow_run']['head_sha']==source
          identity={'scope':'combined-media-transport-diagnostic-only','qualification':False,'source_head':source,'source_tree':tree,'dispatcher_head':observed,'helper_sha256':'5c4fc14de2facea7a55927d4aaa8e274e8d79bc13267c6a2b2539f7e763c0bdb','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'probe':os.environ['K5_TRANSPORT_DIAGNOSTIC_PROBE'],'input_native_run':43349156360,'input_gui_producer':131635698601,'input_gui_producer_conclusion':'success','input_workflow_status':run['status'],'input_workflow_conclusion':run['conclusion'],'setup_artifact':14003800633,'raw_primary_artifact':14004020113,'product_test_files_changed':False,'original_assertions_and_deadlines_changed':False,'request_retries_added':0}
          Path('combined-transport-b81a950-identity.json').write_text(json.dumps(identity,indent=2)+'\n',encoding='utf-8')
      - name: Download exact GUI-exercised installer for diagnostics only
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: "14003800633"
          run-id: "43349156360"
          github-token: ${{ github.token }}
          path: transport-setup-input
          merge-multiple: true
      - name: Download original raw GUI producer evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: "14004020113"
          run-id: "43349156360"
          github-token: ${{ github.token }}
          path: transport-primary-input
          merge-multiple: true
      - name: Bind exact source, Setup, manifest, package and raw GUI witness bytes
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('transport-setup-input')
          primary=Path('transport-primary-input')
          assert sorted(p.name for p in root.iterdir()) == ['K5VisionSetup.exe','dependency-inventory.json','desktop-package.json','desktop-windows-receipt.json','payload-manifest.json']
          assert sorted(p.name for p in primary.iterdir()) == ['desktop-windows-receipt.json','desktop-windows.xml']
          package=root/'desktop-package.json'
          manifest=root/'payload-manifest.json'
          setup=root/'K5VisionSetup.exe'
          assert hashlib.sha256(package.read_bytes()).hexdigest()=='40176d02e06ba3745033dd6c30272c2012d10d031106b3782adb7c4a152e16a9'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='cc1478a3fba9f38ca6275e012da6e52f9361a5abcbd68cebec0933a0cefef740'
          assert hashlib.sha256((primary/'desktop-windows.xml').read_bytes()).hexdigest()=='e912ee5e755e825d323994dbde443bbdcc310b28f1e37a2083b11683c6d970ce'
          assert hashlib.sha256((primary/'desktop-windows-receipt.json').read_bytes()).hexdigest()=='82093053ee254bd8af0b214bf3c4001e778e6cd8ef54a9b203dd0004f3653fc8'
          assert (primary/'desktop-windows-receipt.json').read_bytes()==(root/'desktop-windows-receipt.json').read_bytes()
          data=json.loads(package.read_bytes())
          assert data['head_sha']==json.loads(manifest.read_bytes())['head_sha']=='b81a950975e50979f57b20fb13cdbfbe73fd1aac'
          assert setup.stat().st_size==data['setup_bytes']==300004599
          with setup.open('rb') as stream:
              actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert actual==data['setup_sha256']=='0e3f887be3e524eba09c0dfa9821a2a2c4156b403439bf73663077c751e4b5f6'
          assert hashlib.sha256(Path('scripts/verify_desktop_receipt.py').read_bytes()).hexdigest()=='1dacff23c919e09c64ff7723f8ec64d80e7660739d327dc9ebb770207f1495ca'
          subprocess.run(['python','scripts/verify_desktop_receipt.py',str(primary/'desktop-windows.xml'),'transport-input-primary-verification.json'],check=True)
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as stream:
              stream.write('K5_DESKTOP_SETUP='+str(setup.resolve())+'\n')
              stream.write('K5_DESKTOP_SETUP_SHA256='+actual+'\n')
          print('Exact GUI-exercised source, installer and raw producer evidence admitted for transport diagnostics only')
      - name: Install original acceptance dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]" "playwright==1.58.0"
          if ($LASTEXITCODE -ne 0) { throw "Original diagnostic dependency install failed" }
      - name: Provision original immutable native acceptance tools
        uses: ./.github/actions/provision-operator-tools
      - name: Provision original admitted public person fixture
        shell: pwsh
        run: |
          python scripts/provision_operator_person_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "Original public person fixture admission failed" }
      - name: Run unchanged installed GUI tests with passive transport observations
        timeout-minutes: 12
        shell: pwsh
        run: |
          python .transport-diagnostic-dispatcher/scripts/observe_combined_transport_b81a950.py --source .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostic identity and finite original outcome
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: combined-transport-b81a950-probe-${{ matrix.probe }}-${{ github.run_id }}
          path: |
            combined-transport-b81a950-identity.json
            combined-transport-b81a950-original.xml
            combined-transport-b81a950-observation.json
          if-no-files-found: error
          retention-days: 7
