                      $aceKeys = 'access_mask,ace_type,effective_principal_category,expanded_access_mask,inheritance_flags,principal_category'
                      Test-K5Keys $inputAce $aceKeys
                      Test-K5Enum $inputAce.ace_type @('allow', 'deny', 'unknown')
                      $categories = @('local_system', 'builtin_administrators', 'builtin_users', 'everyone', 'authenticated_users', 'creator_owner', 'owner_rights', 'trusted_installer_sid', 'current_user', 'redacted_other', 'unknown')
                      Test-K5Enum $inputAce.principal_category $categories
