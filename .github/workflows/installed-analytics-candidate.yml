          # Fixed stdlib bootstrap: only verified binary Git source executes.
          import hashlib, json, os, re, stat, subprocess, sys, threading, types
          from pathlib import Path

          def require(value):
              if not value:
                  raise ValueError('binding')

          def ordinary(path, directory):
              require(path.is_absolute() and len(path.parts) <= 64 and not str(path).startswith(('\\\\', '//')))
              for item in reversed((path, *path.parents)):
                  info = item.lstat()
                  require(not stat.S_ISLNK(info.st_mode) and not getattr(info, 'st_file_attributes', 0) & 0x400)
                  is_dir = item != path or directory
                  require(stat.S_ISDIR(info.st_mode) if is_dir else stat.S_ISREG(info.st_mode) and info.st_nlink == 1)
              require(path.resolve(strict=True) == path)

          def file_digest(path):
              before = path.lstat()
              require(0 < before.st_size <= 64 * 1024 * 1024)
              identity = lambda info: (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
              digest, count = hashlib.sha256(), 0
              with path.open('rb') as stream:
                  require(identity(os.fstat(stream.fileno())) == identity(before))
                  while True:
                      chunk = stream.read(1024 * 1024)
                      if not chunk:
                          break
                      count += len(chunk)
                      require(count <= before.st_size)
                      digest.update(chunk)
                  require(identity(os.fstat(stream.fileno())) == identity(before))
              require(count == before.st_size and identity(path.lstat()) == identity(before))
              return digest.hexdigest()

          class SourceCleanupError(ValueError):
              pass

          def read_object(git, root, expression, kind, limit):
              # Every output read is bounded independently of the deadline. The foreground
              # never blocks in a pipe read, including if termination of our child fails.
              env = {key: value for key, value in os.environ.items() if not key.upper().startswith('GIT_')}
              env['GIT_NO_REPLACE_OBJECTS'] = '1'
              env['GIT_NO_LAZY_FETCH'] = '1'
              env['GIT_ALLOW_PROTOCOL'] = ''
              done, state = threading.Event(), {}
              process = subprocess.Popen([str(git), '--no-replace-objects', '--no-lazy-fetch', '-c', 'protocol.allow=never', 'cat-file', '--batch'],
                                         cwd=root, env=env, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                         stderr=subprocess.DEVNULL, shell=False, bufsize=0)
              reader = None
              def read_exact(count):
                  data = bytearray()
                  while len(data) < count:
                      chunk = process.stdout.read(count - len(data))
                      require(bool(chunk))
                      data.extend(chunk)
                  return bytes(data)
              def receive():
                  try:
                      request = expression.encode('ascii') + b'\n'
                      require(process.stdin.write(request) == len(request))
                      process.stdin.close()
                      header = process.stdout.readline(98)
                      match = re.fullmatch(rb'([0-9a-f]{40}) (blob|commit) ([1-9][0-9]{0,6})\n', header)
                      require(match is not None)
                      oid, actual_kind, size = match[1].decode('ascii'), match[2].decode('ascii'), int(match[3])
                      require(actual_kind == kind and 0 < size <= limit)
                      body = read_exact(size)
                      require(read_exact(1) == b'\n' and process.stdout.read(1) == b'')
                      require(hashlib.sha1(kind.encode('ascii') + b' ' + str(size).encode('ascii') + b'\0' + body).hexdigest() == oid)
                      state['result'] = oid, body
                  except BaseException:
                      state['failed'] = True
                  finally:
                      done.set()
              try:
                  reader = threading.Thread(target=receive, daemon=True)
                  reader.start()
                  require(done.wait(10) and 'result' in state and not state.get('failed'))
                  require(process.wait(timeout=2) == 0)
                  return state['result']
              finally:
                  quiet = True
                  try:
                      if process.poll() is None:
                          process.kill()
                  except BaseException:
                      quiet = False
                  try:
                      quiet = process.wait(timeout=2) is not None and quiet
                  except BaseException:
                      quiet = False
                  for stream in (process.stdin, process.stdout):
                      try:
                          stream.close()
                      except BaseException:
                          quiet = False
                  if reader is not None:
                      try:
                          reader.join(timeout=2)
                          quiet = not reader.is_alive() and quiet
                      except BaseException:
                          quiet = False
                  if not quiet:
                      raise SourceCleanupError('binding')
          record = dict(schema_version='storage-preflight-v1', scope='read-only-early-storage-admission',
                        status='refused', stage='runtime_binding', code='runtime_unavailable', storage_acl=None,
                        retention_state='not_started', later_admission_required=True)
          try:
              require(os.name == 'nt' and sys.implementation.name == 'cpython' and sys.version_info[:3] == (3, 12, 10))
              require(sys.prefix == sys.base_prefix and sys.flags.isolated == 1 and sys.flags.no_site == 1 and sys.dont_write_bytecode)
              runner, workspace, temporary = (Path(os.environ[key]) for key in ('RUNNER_WORKSPACE', 'GITHUB_WORKSPACE', 'RUNNER_TEMP'))
              require(workspace.parent == runner and workspace.name == runner.name == 'K5-Vision')
              require(temporary.parent == runner.parent and temporary.name == '_temp')
              runtime = runner.parent / '_tool/Python/3.12.10/x64/python.exe'
              require(Path(sys.executable) == runtime)
              for path in (runner, workspace, temporary):
                  ordinary(path, True)
              ordinary(runtime, False)
              require(file_digest(runtime) == '4d6f5f81a4bca11191c4c7c6b43632694d0a4ce74e068619d8fdc161d469859a')
              record.update(stage='source_binding', code='source_unavailable')
              revision = os.environ['K5_STAGE_ONE_REVISION']
              require(re.fullmatch('[0-9a-f]{40}', revision) and revision == os.environ['GITHUB_SHA'])
              require(os.environ['GITHUB_REPOSITORY'] == 'mkurtgerald/K5-Vision')
              require(os.environ['K5_CANDIDATE_BRANCH'] == 'fix/transactional-alpha-upgrade-20261003')
              for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
                  require(re.fullmatch('[1-9][0-9]{0,19}', os.environ[key]))
