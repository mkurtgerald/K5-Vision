              ordinary(git, False)
              ordinary(workspace / '.git', True)
              require(re.fullmatch('[0-9a-f]{64}', os.environ['K5_CHECKOUT_GIT_SHA256']))
              require(file_digest(git) == os.environ['K5_CHECKOUT_GIT_SHA256'])
