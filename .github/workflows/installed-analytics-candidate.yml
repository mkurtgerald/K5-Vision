      - name: Independently admit launcher Git compiler artifacts
        if: always()
        timeout-minutes: 2
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = @(
              @{ name = 'assert-stage-one-physical-admission.ps1'; size = 7643; blob = '9faae324ffaf008a7dc389aaab2d70198c5f4ea1'; sha256 = 'd7a38b5278802d9ba768d9987b4582a219d490923b0cc4da0c297d29a250b45d' },
              @{ name = 'assert-installed-git-alias.ps1'; size = 13028; blob = 'a3f9ae05f204905c9cd2e68f894a6bd53dc4d53c'; sha256 = '67c4d3d7bcef1ae8e8bfea56acaaf7e2192622a217ae1e2450f8680ae2b93dc8' },
              @{ name = 'admit_installed_git_alias.cs'; size = 36598; blob = '1e45e51c6171d88ff582466ba2664f9b81b75ebf'; sha256 = 'a751156ee06792f8f4625fa988c73a54c8e9a0a24937c06ab9264762f965d23f' }
          )
          # Fresh immutable source admission; no executable, checkout file or saved receipt is trusted here.
          $strictUtf8 = [Text.UTF8Encoding]::new($false, $true)
          function Read-K5PinnedBlob($Pin) {
              $response = $null; $stream = $null; $memory = $null; $sha1 = $null; $sha256 = $null
              try {
                  if ($env:GITHUB_API_URL -cne 'https://api.github.com' -or
                      $env:GITHUB_REPOSITORY -cne 'mkurtgerald/K5-Vision' -or
                      [string]::IsNullOrEmpty($env:K5_GITHUB_TOKEN) -or $env:K5_GITHUB_TOKEN.Length -gt 8192 -or
                      $Pin.size -le 0 -or $Pin.size -gt 65536 -or
                      $Pin.blob -cnotmatch '\A[0-9a-f]{40}\z' -or $Pin.sha256 -cnotmatch '\A[0-9a-f]{64}\z') { throw 'context' }
                  $url = 'https://api.github.com/repos/mkurtgerald/K5-Vision/git/blobs/' + $Pin.blob
                  $request = [Net.HttpWebRequest]::Create($url)
                  $request.Method = 'GET'; $request.AllowAutoRedirect = $false
                  $request.Timeout = 15000; $request.ReadWriteTimeout = 15000
                  $request.MaximumResponseHeadersLength = 16
                  $request.AutomaticDecompression = [Net.DecompressionMethods]::None
                  $request.Accept = 'application/vnd.github+json'; $request.UserAgent = 'K5-fixed-git-admission/1'
                  $request.Headers['Authorization'] = 'Bearer ' + $env:K5_GITHUB_TOKEN
                  $request.Headers['X-GitHub-Api-Version'] = '2022-11-28'
                  $response = $request.GetResponse()
                  if ([int]$response.StatusCode -ne 200 -or $response.ResponseUri.AbsoluteUri -cne $url -or
                      $response.ContentLength -gt 131072 -or -not [string]::IsNullOrEmpty($response.ContentEncoding)) { throw 'response' }
                  $stream = $response.GetResponseStream(); $memory = [IO.MemoryStream]::new()
                  $buffer = [byte[]]::new(4096)
                  $deadline = [Diagnostics.Stopwatch]::StartNew()
                  while ($true) {
                      $remaining = 131072 - [int]$memory.Length
                      if ($remaining -le 0 -or $deadline.ElapsedMilliseconds -ge 15000) { throw 'response_bound' }
                      $read = $stream.ReadAsync($buffer, 0, [Math]::Min($buffer.Length, $remaining))
                      if (-not $read.Wait([Math]::Max(1, 15000 - [int]$deadline.ElapsedMilliseconds))) { throw 'response_timeout' }
                      if ($read.Result -eq 0) { break }
                      $memory.Write($buffer, 0, $read.Result)
                  }
                  $record = ConvertFrom-Json -InputObject $strictUtf8.GetString($memory.ToArray()) -ErrorAction Stop
                  if ($record.sha -isnot [string] -or $record.sha -cne $Pin.blob -or $record.encoding -cne 'base64' -or
                      ($record.size -isnot [int] -and $record.size -isnot [long]) -or $record.size -ne $Pin.size -or
                      $record.content -isnot [string] -or $record.content.Length -gt 100000) { throw 'blob' }
                  $encoded = $record.content.Replace("`r", '').Replace("`n", '')
                  if ($encoded -cnotmatch '\A(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?\z' -or
                      $encoded.Length -ne 4 * [Math]::Ceiling($Pin.size / 3.0)) { throw 'base64' }
                  $bytes = [Convert]::FromBase64String($encoded)
                  if ($bytes.Length -ne $Pin.size -or [Convert]::ToBase64String($bytes) -cne $encoded) { throw 'size' }
                  $sha256 = [Security.Cryptography.SHA256]::Create(); $sha1 = [Security.Cryptography.SHA1]::Create()
                  if (([BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant() -cne $Pin.sha256) { throw 'digest' }
                  $header = [Text.Encoding]::ASCII.GetBytes('blob ' + [string]$bytes.Length + [char]0)
                  $framed = [byte[]]::new($header.Length + $bytes.Length)
                  [Array]::Copy($header, 0, $framed, 0, $header.Length); [Array]::Copy($bytes, 0, $framed, $header.Length, $bytes.Length)
                  if (([BitConverter]::ToString($sha1.ComputeHash($framed))).Replace('-', '').ToLowerInvariant() -cne $Pin.blob) { throw 'git_blob' }
                  $null = $strictUtf8.GetString($bytes)
                  return ,$bytes
              } catch { throw 'Pinned Git admission source refused; existing owners were preserved.' }
              finally {
                  foreach ($owned in @($sha1, $sha256, $memory, $stream, $response)) { if ($null -ne $owned) { $owned.Dispose() } }
              }
          }
          function Assert-K5OrdinaryCompilerPath([string]$Path, [bool]$Directory) {
              if ([string]::IsNullOrEmpty($Path) -or $Path.Length -gt 1024 -or $Path -cnotmatch '\A[A-Z]:\\' -or
                  $Path -match '[\x00-\x1f"<>|?*]' -or $Path.Substring(2).Contains(':') -or
                  [IO.Path]::GetFullPath($Path) -cne $Path) { throw 'compiler_path' }
              foreach ($part in $Path.Substring(3).Split('\')) {
                  if ($part.Length -eq 0 -or $part -in @('.', '..') -or $part.EndsWith('.') -or $part.EndsWith(' ')) { throw 'compiler_path' }
              }
              $item = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
              if ($item.FullName -cne $Path -or [bool]$item.PSIsContainer -ne $Directory) { throw 'compiler_type' }
              $depth = 0
              while ($null -ne $item) {
                  $depth++
                  if ($depth -gt 32 -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                      -not [string]::IsNullOrEmpty($item.LinkType)) { throw 'compiler_alias' }
                  $item = $(if ($item -is [IO.FileInfo]) { $item.Directory } else { $item.Parent })
              }
          }
          try {
              # This is a new same-host PowerShell process after all named owners exited.
              # Retained compiler artifacts must be ordinary FILES only. Never recurse or clean up.
              $trustedGuard = [scriptblock]::Create($strictUtf8.GetString((Read-K5PinnedBlob $pins[0])))
              & $trustedGuard | Out-Null
              $rows = @(Get-CimInstance -ClassName Win32_Process -Property Name -OperationTimeoutSec 10 -ErrorAction Stop)
              if ($rows.Count -lt 1 -or $rows.Count -gt 32768) { throw 'compiler_inventory' }
              foreach ($row in $rows) {
                  if ($row.Name -isnot [string] -or $row.Name.Length -eq 0 -or $row.Name.Length -gt 260 -or
                      $row.Name -match '[\x00\\/:\r\n]' -or $row.Name -iin @('csc.exe', 'cvtres.exe', 'vbc.exe', 'VBCSCompiler.exe')) { throw 'compiler_occupied' }
              }
              if ($env:GITHUB_RUN_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or $env:GITHUB_RUN_ATTEMPT -cnotmatch '\A[1-9][0-9]{0,19}\z') { throw 'context' }
              Assert-K5OrdinaryCompilerPath $env:RUNNER_TEMP $true
              foreach ($action in @('git_launcher_archives')) {
                  $path = Join-Path $env:RUNNER_TEMP ('k5-installed-git-alias-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $action)
                  if (-not (Test-Path -LiteralPath $path -ErrorAction Stop)) { continue }
                  Assert-K5OrdinaryCompilerPath $path $true
                  $entries = [IO.Directory]::EnumerateFileSystemEntries($path).GetEnumerator()
                  $count = 0; [long]$bytes = 0
                  try {
                      while ($entries.MoveNext()) {
                          $count++
                          if ($count -gt 64) { throw 'compiler_artifacts' }
                          $entry = [string]$entries.Current
                          Assert-K5OrdinaryCompilerPath $entry $false
                          $file = Get-Item -LiteralPath $entry -Force -ErrorAction Stop
                          $bytes += $file.Length
                          if ($file.Length -lt 0 -or $bytes -gt 16777216) { throw 'compiler_artifacts' }
                      }
                  } finally { $entries.Dispose() }
              }
              & $trustedGuard | Out-Null
              Write-Host 'K5_GIT_COMPILER_POST=passed'
          } catch { throw 'Independent Git compiler final admission refused; existing owners were preserved.' }

