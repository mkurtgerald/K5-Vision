name: Installed Analytics Candidate Qualification

on:
  push:
    branches:
      - feat/installed-analytics-operator-20261003
      - feat/alpha-analytics-preflight-20261004
      - fix/transactional-alpha-upgrade-20261003
      - feat/installed-alpha-facade-witness-20261005
    paths:
      - .github/workflows/installed-analytics-candidate.yml
      - scripts/installed_analytics_witness.py
      - scripts/installed_alpha_launcher_witness.py
      - scripts/installed_alpha_facade_witness.py
      - scripts/windows_owned_preflight.py
      - scripts/assert-stage-one-physical-admission.ps1
      - scripts/capture_installer_wheel_provenance.py
      - scripts/installer_wheel_requirements.py
      - scripts/installer_wheel_storage.py
      - scripts/windows-alpha/Install-K5VisionAlpha.ps1
      - scripts/windows-alpha/install_transaction.py
      - tests/test_capture_installer_wheel_provenance.py
      - tests/test_installer_wheel_requirements.py
      - tests/test_installer_wheel_storage.py
      - tests/test_stage_one_physical_admission_diagnostics.py
      - tests/test_installer_runtime_platform_dependencies.py
      - tests/test_windows_alpha_upgrade.py
      - tests/test_windows_alpha_bootstrap.py
      - scripts/build_analytics_runtime_wheel.py
      - scripts/windows-alpha/Invoke-K5InstalledAnalyticsWitness.ps1
      - scripts/windows-alpha/Start-K5VisionAlpha.ps1
      - scripts/windows-alpha/Test-K5VisionAlpha.ps1
      - scripts/windows-alpha/Run-K5VisionAlpha.ps1
      - scripts/windows-alpha/Invoke-K5VisionAlphaWitness.ps1
      - src/k5vision/**
      - pyproject.toml
      - scripts/windows-alpha/runtime-requirements.txt
      - tests/test_installed_analytics_witness.py
      - tests/test_installed_alpha_launcher_witness.py
      - tests/test_installed_alpha_facade_witness.py
      - tests/test_windows_alpha_facade_witness.py
      - tests/test_installed_analytics_candidate_workflow.py
      - tests/test_windows_alpha_analytics.py

# Shares the existing K5 physical lane only after hosted admission succeeds.
# Cross-repository launch coordination and fresh host admission remain required.
permissions:
  contents: read
  actions: read

jobs:
  hosted_admission:
    name: hosted-candidate-admission
    if: github.repository == 'mkurtgerald/K5-Vision' && (github.ref == 'refs/heads/feat/installed-analytics-operator-20261003' || github.ref == 'refs/heads/feat/alpha-analytics-preflight-20261004' || github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003' || github.ref == 'refs/heads/feat/installed-alpha-facade-witness-20261005')
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      qualified_sha: ${{ steps.qualify.outputs.qualified_sha }}
    env:
      K5_CANDIDATE_BRANCH: ${{ github.ref_name }}
      K5_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Require exact trusted head and green hosted PR qualification
        id: qualify
        timeout-minutes: 9
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          function Test-K5CandidateHostedGates {
            if ($env:GITHUB_REPOSITORY -cne "mkurtgerald/K5-Vision") { throw "Untrusted candidate repository refused." }
            if ($env:K5_EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') { throw "Exact candidate SHA required." }
            $legacyBranch = "feat/installed-analytics-operator-20261003"
            $launcherBranch = "feat/alpha-analytics-preflight-20261004"
            $upgradeBranch = "fix/transactional-alpha-upgrade-20261003"
            $facadeBranch = "feat/installed-alpha-facade-witness-20261005"
            if ($env:K5_CANDIDATE_BRANCH -cnotin @($legacyBranch, $launcherBranch, $upgradeBranch, $facadeBranch)) { throw "Unreviewed candidate branch refused." }
            $branch = [uri]::EscapeDataString($env:K5_CANDIDATE_BRANCH)
            $headers = @{ Authorization = "Bearer $env:K5_GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            # Launcher/upgrade/facade require three applicable gates; legacy retains all five.
            $required = @{
              "355859781" = "CI"
              "369354936" = "Windows Alpha Script Smoke"
              "361865932" = "PR Run Dedupe"
            }
            if ($env:K5_CANDIDATE_BRANCH -ceq $legacyBranch) {
              $required["362514400"] = "Current Gate Viewport Editor Qualification"
              $required["364801702"] = "Stage One Analytics Compatibility"
            }
            $head = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri "https://api.github.com/repos/mkurtgerald/K5-Vision/branches/$branch"
            if ($head.name -cne $env:K5_CANDIDATE_BRANCH) { throw "Candidate branch identity mismatch." }
            if ($head.commit.sha -cne $env:K5_EXPECTED_SHA) { throw "Candidate branch has advanced; no physical work admitted." }
            $uri = "https://api.github.com/repos/mkurtgerald/K5-Vision/actions/runs?event=pull_request&head_sha=$env:K5_EXPECTED_SHA&per_page=100"
            $response = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri $uri
            if ($null -eq $response -or $response.workflow_runs -isnot [System.Array]) { throw "Malformed hosted qualification response." }
            $qualified = $true
            foreach ($id in $required.Keys) {
              $matching = @($response.workflow_runs | Where-Object {
                [string]$_.workflow_id -ceq $id -and $_.head_sha -ceq $env:K5_EXPECTED_SHA -and
                $_.event -ceq "pull_request" -and $_.head_branch -ceq $env:K5_CANDIDATE_BRANCH -and
                $_.name -ceq $required[$id] -and
                $_.repository.full_name -ceq "mkurtgerald/K5-Vision" -and
                $_.head_repository.full_name -ceq "mkurtgerald/K5-Vision"
              } | Sort-Object -Property id -Descending)
              if ($matching.Count -eq 0) { $qualified = $false; continue }
              if (@($matching | Where-Object { $_.status -ceq "completed" -and $_.conclusion -cne "success" }).Count -ne 0) {
                throw "An exact-candidate hosted qualification failed; native execution refused."
              }
              if ($matching[0].status -cne "completed" -or $matching[0].conclusion -cne "success") { $qualified = $false }
            }
            return $qualified
          }
          $deadline = [DateTime]::UtcNow.AddMinutes(8)
          $qualified = $false
          while ([DateTime]::UtcNow -lt $deadline) {
            if (Test-K5CandidateHostedGates) { $qualified = $true; break }
            Start-Sleep -Seconds 15
          }
          if (-not $qualified -or [DateTime]::UtcNow -ge $deadline) { throw "Exact hosted qualification did not pass within the admission budget." }
          "qualified_sha=$env:K5_EXPECTED_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  installed-analytics-candidate:
    needs: hosted_admission
    if: needs.hosted_admission.result == 'success' && needs.hosted_admission.outputs.qualified_sha == github.sha && (github.repository == 'mkurtgerald/K5-Vision' && (github.ref == 'refs/heads/feat/installed-analytics-operator-20261003' || github.ref == 'refs/heads/feat/alpha-analytics-preflight-20261004' || github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003' || github.ref == 'refs/heads/feat/installed-alpha-facade-witness-20261005'))
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 25
    concurrency:
      group: stage-one-operator-physical
      cancel-in-progress: false
    env:
      PYTHONHOME: ""
      PYTHONPYCACHEPREFIX: ""
      ANALYTICS_LAB_SHA: c8b347ae538991a0c0ce38eabc2dc17b566531d3
      K5_STAGE_ONE_REVISION: ${{ github.sha }}
      K5_CANDIDATE_BRANCH: ${{ github.ref_name }}
      K5_ALPHA_DIRECT_RTSP_OUTPUT: artifacts\alpha-direct-rtsp-candidate-baseline.json
      K5_INSTALLED_ANALYTICS_OUTPUT: artifacts\installed-analytics-candidate.json
      K5_INSTALLED_WORK_OWNED: ""
      K5_INSTALLED_EVIDENCE_OWNED: ""
      K5_INSTALLED_CONTROLLER_OWNED: ""
      K5_ALPHA_LAUNCHER_OWNED: ""
      K5_ALPHA_LAUNCHER_OUTPUT: artifacts\installed-alpha-start-script-witness.json
      K5_ALPHA_FACADE_OWNED: ""
      K5_ALPHA_FACADE_INPUTS: artifacts\installed-alpha-facades-inputs.json
      K5_ALPHA_FACADE_EXPECTATIONS: artifacts\installed-alpha-facades-expectations.json
      K5_ALPHA_FACADE_OUTPUT: artifacts\installed-alpha-facades-witness.json

    steps:
      - name: Revalidate exact admitted candidate before native work
        timeout-minutes: 1
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
          K5_EXPECTED_SHA: ${{ github.sha }}
          K5_ADMITTED_SHA: ${{ needs.hosted_admission.outputs.qualified_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:K5_ADMITTED_SHA -cne $env:K5_EXPECTED_SHA) { throw "Hosted admission does not bind this exact candidate." }
          function Test-K5CandidateHostedGates {
            if ($env:GITHUB_REPOSITORY -cne "mkurtgerald/K5-Vision") { throw "Untrusted candidate repository refused." }
            if ($env:K5_EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') { throw "Exact candidate SHA required." }
            $legacyBranch = "feat/installed-analytics-operator-20261003"
            $launcherBranch = "feat/alpha-analytics-preflight-20261004"
            $upgradeBranch = "fix/transactional-alpha-upgrade-20261003"
            $facadeBranch = "feat/installed-alpha-facade-witness-20261005"
            if ($env:K5_CANDIDATE_BRANCH -cnotin @($legacyBranch, $launcherBranch, $upgradeBranch, $facadeBranch)) { throw "Unreviewed candidate branch refused." }
            $branch = [uri]::EscapeDataString($env:K5_CANDIDATE_BRANCH)
            $headers = @{ Authorization = "Bearer $env:K5_GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            # Launcher/upgrade/facade require three applicable gates; legacy retains all five.
            $required = @{
              "355859781" = "CI"
              "369354936" = "Windows Alpha Script Smoke"
              "361865932" = "PR Run Dedupe"
            }
            if ($env:K5_CANDIDATE_BRANCH -ceq $legacyBranch) {
              $required["362514400"] = "Current Gate Viewport Editor Qualification"
              $required["364801702"] = "Stage One Analytics Compatibility"
            }
            $head = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri "https://api.github.com/repos/mkurtgerald/K5-Vision/branches/$branch"
            if ($head.name -cne $env:K5_CANDIDATE_BRANCH) { throw "Candidate branch identity mismatch." }
            if ($head.commit.sha -cne $env:K5_EXPECTED_SHA) { throw "Candidate branch has advanced; no physical work admitted." }
            $uri = "https://api.github.com/repos/mkurtgerald/K5-Vision/actions/runs?event=pull_request&head_sha=$env:K5_EXPECTED_SHA&per_page=100"
            $response = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri $uri
            if ($null -eq $response -or $response.workflow_runs -isnot [System.Array]) { throw "Malformed hosted qualification response." }
            $qualified = $true
            foreach ($id in $required.Keys) {
              $matching = @($response.workflow_runs | Where-Object {
                [string]$_.workflow_id -ceq $id -and $_.head_sha -ceq $env:K5_EXPECTED_SHA -and
                $_.event -ceq "pull_request" -and $_.head_branch -ceq $env:K5_CANDIDATE_BRANCH -and
                $_.name -ceq $required[$id] -and
                $_.repository.full_name -ceq "mkurtgerald/K5-Vision" -and
                $_.head_repository.full_name -ceq "mkurtgerald/K5-Vision"
              } | Sort-Object -Property id -Descending)
              if ($matching.Count -eq 0) { $qualified = $false; continue }
              if (@($matching | Where-Object { $_.status -ceq "completed" -and $_.conclusion -cne "success" }).Count -ne 0) {
                throw "An exact-candidate hosted qualification failed; native execution refused."
              }
              if ($matching[0].status -cne "completed" -or $matching[0].conclusion -cne "success") { $qualified = $false }
            }
            return $qualified
          }
          if (-not (Test-K5CandidateHostedGates)) { throw "Exact hosted qualification is no longer green; no physical work admitted." }

      - name: Admit existing Git before immutable checkouts
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # This installation root was observed in candidate run 37164394848.
          # Never search another installation, download Git or alter machine PATH.
          $git = 'C:\Program Files\Git\cmd\git.exe'
          $attributes = [IO.File]::GetAttributes($git)
          if ($attributes -band ([IO.FileAttributes]::Directory -bor [IO.FileAttributes]::ReparsePoint)) { throw "Existing Git must be a regular executable." }
          $parent = [IO.DirectoryInfo]::new((Split-Path -Parent $git))
          while ($null -ne $parent) {
            $parent.Refresh()
            if (-not $parent.Exists -or ($parent.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "Existing Git ancestor is unavailable or aliased." }
            $parent = $parent.Parent
          }
          $output = @(& $git --version)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0 -or $output.Count -ne 1) { throw "Existing Git version could not be verified." }
          $versionText = ([string]$output[0]).Trim()
          if ($versionText -cnotmatch '\Agit version (?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)\.windows\.[0-9]+\z') { throw "Existing Git for Windows version is unsupported." }
          $version = [Version]::new([int]$Matches.major, [int]$Matches.minor, [int]$Matches.patch)
          if ($version -lt [Version]'2.18.0') { throw "Git 2.18 or newer is required for exact checkout provenance." }
          $gitSha256 = (Get-FileHash -LiteralPath $git -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "K5_CHECKOUT_GIT_VERSION=$versionText"
          Write-Host "K5_CHECKOUT_GIT_SHA256=$gitSha256"
          "K5_CHECKOUT_GIT_SHA256=$gitSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $git) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require idle exact physical host before provisioning
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:K5_CANDIDATE_BRANCH -cne "fix/transactional-alpha-upgrade-20261003") {
              .\scripts\assert-stage-one-physical-admission.ps1
          } else {
              # All Git children close before the existing PowerShell host snapshot.
              # No Python orchestrator, mutable-source import or newline reconstruction.
              function Read-K5GitObject([string]$Expression, [string]$Kind, [int]$Limit) {
                  $process = $null
                  try {
                      $start = [Diagnostics.ProcessStartInfo]::new()
                      $start.FileName = 'C:\Program Files\Git\cmd\git.exe'
                      $start.Arguments = '--no-replace-objects --no-lazy-fetch -c protocol.allow=never cat-file --batch'
                      $start.WorkingDirectory = $env:GITHUB_WORKSPACE
                      $start.UseShellExecute = $false
                      $start.CreateNoWindow = $true
                      $start.RedirectStandardInput = $true
                      $start.RedirectStandardOutput = $true
                      $start.RedirectStandardError = $true
                      foreach ($key in @($start.EnvironmentVariables.Keys)) {
                          if ($key -like 'GIT_*') { $start.EnvironmentVariables.Remove($key) }
                      }
                      $start.EnvironmentVariables['GIT_NO_REPLACE_OBJECTS'] = '1'
                      $start.EnvironmentVariables['GIT_NO_LAZY_FETCH'] = '1'
                      $start.EnvironmentVariables['GIT_ALLOW_PROTOCOL'] = ''
                      $process = [Diagnostics.Process]::new()
                      $process.StartInfo = $start
                      if (-not $process.Start()) { throw "source" }
                      # Drain without retaining any stderr, including on malformed framing.
                      $drain = $process.StandardError.BaseStream.CopyToAsync([IO.Stream]::Null)
                      $watch = [Diagnostics.Stopwatch]::StartNew()
                      $process.StandardInput.WriteLine($Expression)
                      $process.StandardInput.Close()
                      $stream = $process.StandardOutput.BaseStream
                      function Read-K5Bytes([int]$Count) {
                          $buffer = [byte[]]::new($Count)
                          $offset = 0
                          while ($offset -lt $Count) {
                              $remaining = 10000 - [int]$watch.ElapsedMilliseconds
                              if ($remaining -le 0) { throw "source" }
                              $read = $stream.ReadAsync($buffer, $offset, $Count - $offset)
                              if (-not $read.Wait($remaining)) { throw "source" }
                              if ($read.Result -eq 0) { throw "source" }
                              $offset += $read.Result
                          }
                          return ,$buffer
                      }
                      $header = [Collections.Generic.List[byte]]::new()
                      while ($true) {
                          $next = Read-K5Bytes 1
                          if ($next[0] -eq 10) { break }
                          if ($header.Count -ge 96) { throw "source" }
                          $header.Add($next[0])
                      }
                      $line = [Text.Encoding]::ASCII.GetString($header.ToArray())
                      if ($line -cnotmatch '\A([0-9a-f]{40}) (blob|commit) ([1-9][0-9]{0,6})\z') { throw "source" }
                      $oid, $type, $size = $Matches[1], $Matches[2], [int]$Matches[3]
                      if ($type -cne $Kind -or $size -gt $Limit) { throw "source" }
                      $body = Read-K5Bytes $size
                      $terminator = Read-K5Bytes 1
                      if ($terminator[0] -ne 10) { throw "source" }
                      $extra = [byte[]]::new(1)
                      $remaining = 10000 - [int]$watch.ElapsedMilliseconds
                      if ($remaining -le 0) { throw "source" }
                      $end = $stream.ReadAsync($extra, 0, 1)
                      if (-not $end.Wait($remaining) -or $end.Result -ne 0) { throw "source" }
                      $remaining = 10000 - [int]$watch.ElapsedMilliseconds
                      if ($remaining -le 0 -or -not $process.WaitForExit($remaining) -or $process.ExitCode -ne 0) { throw "source" }
                      $remaining = 10000 - [int]$watch.ElapsedMilliseconds
                      if ($remaining -le 0 -or -not $drain.Wait($remaining)) { throw "source" }
                      $prefix = [Text.Encoding]::ASCII.GetBytes("$type $size" + [char]0)
                      $sha1 = [Security.Cryptography.SHA1]::Create()
                      try {
                          $framed = [byte[]]::new($prefix.Length + $body.Length)
                          [Array]::Copy($prefix, 0, $framed, 0, $prefix.Length)
                          [Array]::Copy($body, 0, $framed, $prefix.Length, $body.Length)
                          $digest = ([BitConverter]::ToString($sha1.ComputeHash($framed))).Replace('-', '').ToLowerInvariant()
                      } finally { $sha1.Dispose() }
                      if ($digest -cne $oid) { throw "source" }
                      return @{ oid = $oid; bytes = $body }
                  } finally {
                      if ($null -ne $process) {
                          try {
                            if (-not $process.HasExited) { $process.Kill() }
                            if (-not $process.WaitForExit(2000)) { throw "source" }
                        } finally { $process.Dispose() }
                      }
                  }
              }
              try {
                  if ($env:GITHUB_REPOSITORY -cne 'mkurtgerald/K5-Vision' -or
                      $env:K5_STAGE_ONE_REVISION -cnotmatch '\A[0-9a-f]{40}\z' -or
                      $env:K5_STAGE_ONE_REVISION -cne $env:GITHUB_SHA -or
                      $env:GITHUB_RUN_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
                      $env:GITHUB_RUN_ATTEMPT -cnotmatch '\A[1-9][0-9]{0,19}\z') { throw "source" }
                  $git = 'C:\Program Files\Git\cmd\git.exe'
                  if ($env:K5_CHECKOUT_GIT_SHA256 -cnotmatch '\A[0-9a-f]{64}\z' -or
                      (Get-FileHash -LiteralPath $git -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:K5_CHECKOUT_GIT_SHA256) { throw "source" }
                  $utf8 = [Text.UTF8Encoding]::new($false, $true)
                  $commit = Read-K5GitObject $env:K5_STAGE_ONE_REVISION 'commit' 65536
                  if ($commit.oid -cne $env:K5_STAGE_ONE_REVISION) { throw "source" }
                  $commitText = $utf8.GetString($commit.bytes)
                  if ($commitText -cnotmatch '\Atree ([0-9a-f]{40})\n') { throw "source" }
                  $tree = $Matches[1]
                  $producer = Read-K5GitObject ($env:K5_STAGE_ONE_REVISION + ':scripts/assert-stage-one-physical-admission.ps1') 'blob' 131072
                  $sha256 = [Security.Cryptography.SHA256]::Create()
                  try { $producerHash = ([BitConverter]::ToString($sha256.ComputeHash($producer.bytes))).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
                  $script = [scriptblock]::Create($utf8.GetString($producer.bytes))
                  $context = @{
                      repository = 'mkurtgerald/K5-Vision'; source_sha = $env:K5_STAGE_ONE_REVISION
                      source_tree = $tree; producer_sha256 = $producerHash
                      run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; phase = 'pre_storage'
                  }
              } catch {
                  Write-Host 'K5_HOST_NAME_OBSERVATION_UNAVAILABLE'
                  throw 'Exact host diagnostic source binding refused.'
              }
              & $script -DiagnosticContext $context
          }

      - name: Checkout immutable Analytics source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mkurtgerald/Analytics-lab
          ref: ${{ env.ANALYTICS_LAB_SHA }}
          path: analytics-lab
          persist-credentials: false

      - name: Require exact Git-backed source checkouts
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-Command git -CommandType Application -ErrorAction Stop).Source -ine 'C:\Program Files\Git\cmd\git.exe') { throw "Checkout Git executable changed." }
          $sources = @{
            $env:GITHUB_WORKSPACE = $env:K5_STAGE_ONE_REVISION
            (Join-Path $env:GITHUB_WORKSPACE 'analytics-lab') = $env:ANALYTICS_LAB_SHA
          }
          foreach ($source in $sources.Keys) {
            $metadata = Join-Path $source '.git'
            $attributes = [IO.File]::GetAttributes($metadata)
            if (-not ($attributes -band [IO.FileAttributes]::Directory) -or ($attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "Real local Git checkout metadata required." }
            $actual = @(git -C $source rev-parse HEAD)
            if ($LASTEXITCODE -ne 0 -or $actual.Count -ne 1 -or $actual[0] -cne $sources[$source]) { throw "Exact Git checkout revision mismatch." }
          }

      - name: Observe read-only storage admission before provisioning
        if: github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003'
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
              $runner = [IO.DirectoryInfo]::new($env:RUNNER_WORKSPACE)
              $workspace = [IO.DirectoryInfo]::new($env:GITHUB_WORKSPACE)
              $temporary = [IO.DirectoryInfo]::new($env:RUNNER_TEMP)
              if ($runner.Name -cne 'K5-Vision' -or $workspace.Name -cne 'K5-Vision' -or
                  $workspace.Parent.FullName -cne $runner.FullName -or $temporary.Name -cne '_temp' -or
                  $temporary.Parent.FullName -cne $runner.Parent.FullName) { throw "runtime" }
              $base = Join-Path $runner.Parent.FullName '_tool\Python\3.12.10\x64\python.exe'
              foreach ($path in @($env:RUNNER_WORKSPACE, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $base)) {
                  if (-not [IO.Path]::IsPathRooted($path) -or $path.StartsWith('\\') -or
                      [IO.Path]::GetFullPath($path) -cne $path) { throw "runtime" }
                  $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
                  if ($item.FullName -cne $path -or ($path -ceq $base -and $item.PSIsContainer) -or
                      ($path -cne $base -and -not $item.PSIsContainer)) { throw "runtime" }
                  while ($null -ne $item) {
                      if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                          -not [string]::IsNullOrEmpty($item.LinkType)) { throw "runtime" }
                      $item = $(if ($item -is [IO.FileInfo]) { $item.Directory } else { $item.Parent })
                  }
              }
              if ((Get-FileHash -LiteralPath $base -Algorithm SHA256).Hash.ToLowerInvariant() -cne
