          try {
              $probe = @($bootstrap | & $base -I -B -S - 2>$null)
              $probeExit = $LASTEXITCODE
              if ($probe.Count -ne 1 -or $probe[0] -isnot [string] -or $probe[0].Length -gt 4096 -or
