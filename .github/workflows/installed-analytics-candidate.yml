        run: |
          $ErrorActionPreference = "Stop"
          $base = [IO.Path]::GetFullPath($env:K5_SETUP_PYTHON)
          $attributes = [IO.File]::GetAttributes($base)
          if ($attributes -band ([IO.FileAttributes]::Directory -bor [IO.FileAttributes]::ReparsePoint)) { throw "Admitted base Python must be a regular executable." }
