name: Installed Analytics Candidate Qualification

on:
  push:
    branches:
      - feat/installed-analytics-operator-20261003
      - feat/alpha-analytics-preflight-20261004
      - fix/transactional-alpha-upgrade-20261003
      - feat/installed-alpha-facade-witness-20261005
    paths:
      - .github/workflows/installed-analytics-candidate.yml
      - scripts/installed_analytics_witness.py
      - scripts/installed_alpha_launcher_witness.py
      - scripts/installed_alpha_facade_witness.py
      - scripts/windows_owned_preflight.py
      - scripts/assert-stage-one-physical-admission.ps1
      - tests/test_installed_git_alias_admission.py
      - scripts/admit_installed_git_alias.cs
      - scripts/assert-installed-git-alias.ps1
      - scripts/capture_installer_wheel_provenance.py
      - scripts/installer_wheel_requirements.py
      - scripts/installer_wheel_storage.py
      - scripts/windows-alpha/Install-K5VisionAlpha.ps1
      - scripts/windows-alpha/install_transaction.py
      - tests/test_capture_installer_wheel_provenance.py
      - tests/test_installer_wheel_requirements.py
      - tests/test_installer_wheel_storage.py
      - tests/test_stage_one_physical_admission_diagnostics.py
      - tests/test_installer_runtime_platform_dependencies.py
      - tests/test_windows_alpha_upgrade.py
      - tests/test_windows_alpha_bootstrap.py
      - scripts/build_analytics_runtime_wheel.py
      - scripts/windows-alpha/Invoke-K5InstalledAnalyticsWitness.ps1
      - scripts/windows-alpha/Start-K5VisionAlpha.ps1
      - scripts/windows-alpha/Test-K5VisionAlpha.ps1
      - scripts/windows-alpha/Run-K5VisionAlpha.ps1
      - scripts/windows-alpha/Invoke-K5VisionAlphaWitness.ps1
      - src/k5vision/**
      - pyproject.toml
      - scripts/windows-alpha/runtime-requirements.txt
      - tests/test_installed_analytics_witness.py
      - tests/test_installed_alpha_launcher_witness.py
      - tests/test_installed_alpha_facade_witness.py
      - tests/test_windows_alpha_facade_witness.py
      - tests/test_installed_analytics_candidate_workflow.py
      - tests/test_windows_alpha_analytics.py

# Shares the existing K5 physical lane only after hosted admission succeeds.
# Cross-repository launch coordination and fresh host admission remain required.
permissions:
  contents: read
  actions: read

jobs:
  hosted_admission:
    name: hosted-candidate-admission
    if: github.repository == 'mkurtgerald/K5-Vision' && (github.ref == 'refs/heads/feat/installed-analytics-operator-20261003' || github.ref == 'refs/heads/feat/alpha-analytics-preflight-20261004' || github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003' || github.ref == 'refs/heads/feat/installed-alpha-facade-witness-20261005')
    runs-on: windows-latest
    timeout-minutes: 18
    outputs:
      qualified_sha: ${{ steps.qualify.outputs.qualified_sha }}
    env:
      K5_CANDIDATE_BRANCH: ${{ github.ref_name }}
      K5_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Require exact trusted head and green hosted PR qualification
        id: qualify
        timeout-minutes: 17
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          function Test-K5CandidateHostedGates {
            if ($env:GITHUB_REPOSITORY -cne "mkurtgerald/K5-Vision") { throw "Untrusted candidate repository refused." }
            if ($env:K5_EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') { throw "Exact candidate SHA required." }
            $legacyBranch = "feat/installed-analytics-operator-20261003"
            $launcherBranch = "feat/alpha-analytics-preflight-20261004"
            $upgradeBranch = "fix/transactional-alpha-upgrade-20261003"
            $facadeBranch = "feat/installed-alpha-facade-witness-20261005"
            if ($env:K5_CANDIDATE_BRANCH -cnotin @($legacyBranch, $launcherBranch, $upgradeBranch, $facadeBranch)) { throw "Unreviewed candidate branch refused." }
            $branch = [uri]::EscapeDataString($env:K5_CANDIDATE_BRANCH)
            $headers = @{ Authorization = "Bearer $env:K5_GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            # Launcher/upgrade/facade require three applicable gates; legacy retains all five.
            $required = @{
              "355859781" = "CI"
              "369354936" = "Windows Alpha Script Smoke"
              "361865932" = "PR Run Dedupe"
            }
            if ($env:K5_CANDIDATE_BRANCH -ceq $legacyBranch) {
              $required["362514400"] = "Current Gate Viewport Editor Qualification"
              $required["364801702"] = "Stage One Analytics Compatibility"
            }
            $head = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri "https://api.github.com/repos/mkurtgerald/K5-Vision/branches/$branch"
            if ($head.name -cne $env:K5_CANDIDATE_BRANCH) { throw "Candidate branch identity mismatch." }
            if ($head.commit.sha -cne $env:K5_EXPECTED_SHA) { throw "Candidate branch has advanced; no physical work admitted." }
            $uri = "https://api.github.com/repos/mkurtgerald/K5-Vision/actions/runs?event=pull_request&head_sha=$env:K5_EXPECTED_SHA&per_page=100"
            $response = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri $uri
            if ($null -eq $response -or $response.workflow_runs -isnot [System.Array]) { throw "Malformed hosted qualification response." }
            $qualified = $true
            foreach ($id in $required.Keys) {
              $matching = @($response.workflow_runs | Where-Object {
                [string]$_.workflow_id -ceq $id -and $_.head_sha -ceq $env:K5_EXPECTED_SHA -and
                $_.event -ceq "pull_request" -and $_.head_branch -ceq $env:K5_CANDIDATE_BRANCH -and
                $_.name -ceq $required[$id] -and
                $_.repository.full_name -ceq "mkurtgerald/K5-Vision" -and
                $_.head_repository.full_name -ceq "mkurtgerald/K5-Vision"
              } | Sort-Object -Property id -Descending)
              if ($matching.Count -eq 0) { $qualified = $false; continue }
              if (@($matching | Where-Object { $_.status -ceq "completed" -and $_.conclusion -cne "success" }).Count -ne 0) {
                throw "An exact-candidate hosted qualification failed; native execution refused."
              }
              if ($matching[0].status -cne "completed" -or $matching[0].conclusion -cne "success") { $qualified = $false }
            }
            return $qualified
          }
          # Cover the smoke job's 15-minute bound plus a bounded scheduling margin.
          $deadline = [DateTime]::UtcNow.AddMinutes(16)
          $qualified = $false
          while ([DateTime]::UtcNow -lt $deadline) {
            if (Test-K5CandidateHostedGates) { $qualified = $true; break }
            Start-Sleep -Seconds 15
          }
          if (-not $qualified -or [DateTime]::UtcNow -ge $deadline) { throw "Exact hosted qualification did not pass within the admission budget." }
          "qualified_sha=$env:K5_EXPECTED_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  installed-analytics-candidate:
    needs: hosted_admission
    if: needs.hosted_admission.result == 'success' && needs.hosted_admission.outputs.qualified_sha == github.sha && (github.repository == 'mkurtgerald/K5-Vision' && (github.ref == 'refs/heads/feat/installed-analytics-operator-20261003' || github.ref == 'refs/heads/feat/alpha-analytics-preflight-20261004' || github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003' || github.ref == 'refs/heads/feat/installed-alpha-facade-witness-20261005'))
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 25
    concurrency:
      group: stage-one-operator-physical
      cancel-in-progress: false
    env:
      PYTHONHOME: ""
      PYTHONPYCACHEPREFIX: ""
      ANALYTICS_LAB_SHA: c8b347ae538991a0c0ce38eabc2dc17b566531d3
      K5_STAGE_ONE_REVISION: ${{ github.sha }}
      K5_CANDIDATE_BRANCH: ${{ github.ref_name }}
      K5_ALPHA_DIRECT_RTSP_OUTPUT: artifacts\alpha-direct-rtsp-candidate-baseline.json
      K5_INSTALLED_ANALYTICS_OUTPUT: artifacts\installed-analytics-candidate.json
      K5_INSTALLED_WORK_OWNED: ""
      K5_INSTALLED_EVIDENCE_OWNED: ""
      K5_INSTALLED_CONTROLLER_OWNED: ""
      K5_ALPHA_LAUNCHER_OWNED: ""
      K5_ALPHA_LAUNCHER_OUTPUT: artifacts\installed-alpha-start-script-witness.json
      K5_ALPHA_FACADE_OWNED: ""
      K5_ALPHA_FACADE_INPUTS: artifacts\installed-alpha-facades-inputs.json
      K5_ALPHA_FACADE_EXPECTATIONS: artifacts\installed-alpha-facades-expectations.json
      K5_ALPHA_FACADE_OUTPUT: artifacts\installed-alpha-facades-witness.json

    steps:
      - name: Revalidate exact admitted candidate before native work
        timeout-minutes: 1
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
          K5_EXPECTED_SHA: ${{ github.sha }}
          K5_ADMITTED_SHA: ${{ needs.hosted_admission.outputs.qualified_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:K5_ADMITTED_SHA -cne $env:K5_EXPECTED_SHA) { throw "Hosted admission does not bind this exact candidate." }
          function Test-K5CandidateHostedGates {
            if ($env:GITHUB_REPOSITORY -cne "mkurtgerald/K5-Vision") { throw "Untrusted candidate repository refused." }
            if ($env:K5_EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') { throw "Exact candidate SHA required." }
            $legacyBranch = "feat/installed-analytics-operator-20261003"
            $launcherBranch = "feat/alpha-analytics-preflight-20261004"
            $upgradeBranch = "fix/transactional-alpha-upgrade-20261003"
            $facadeBranch = "feat/installed-alpha-facade-witness-20261005"
            if ($env:K5_CANDIDATE_BRANCH -cnotin @($legacyBranch, $launcherBranch, $upgradeBranch, $facadeBranch)) { throw "Unreviewed candidate branch refused." }
            $branch = [uri]::EscapeDataString($env:K5_CANDIDATE_BRANCH)
            $headers = @{ Authorization = "Bearer $env:K5_GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            # Launcher/upgrade/facade require three applicable gates; legacy retains all five.
            $required = @{
              "355859781" = "CI"
              "369354936" = "Windows Alpha Script Smoke"
              "361865932" = "PR Run Dedupe"
            }
            if ($env:K5_CANDIDATE_BRANCH -ceq $legacyBranch) {
              $required["362514400"] = "Current Gate Viewport Editor Qualification"
              $required["364801702"] = "Stage One Analytics Compatibility"
            }
            $head = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri "https://api.github.com/repos/mkurtgerald/K5-Vision/branches/$branch"
            if ($head.name -cne $env:K5_CANDIDATE_BRANCH) { throw "Candidate branch identity mismatch." }
            if ($head.commit.sha -cne $env:K5_EXPECTED_SHA) { throw "Candidate branch has advanced; no physical work admitted." }
            $uri = "https://api.github.com/repos/mkurtgerald/K5-Vision/actions/runs?event=pull_request&head_sha=$env:K5_EXPECTED_SHA&per_page=100"
            $response = Invoke-RestMethod -Method Get -Headers $headers -TimeoutSec 20 -Uri $uri
            if ($null -eq $response -or $response.workflow_runs -isnot [System.Array]) { throw "Malformed hosted qualification response." }
            $qualified = $true
            foreach ($id in $required.Keys) {
              $matching = @($response.workflow_runs | Where-Object {
                [string]$_.workflow_id -ceq $id -and $_.head_sha -ceq $env:K5_EXPECTED_SHA -and
                $_.event -ceq "pull_request" -and $_.head_branch -ceq $env:K5_CANDIDATE_BRANCH -and
                $_.name -ceq $required[$id] -and
                $_.repository.full_name -ceq "mkurtgerald/K5-Vision" -and
                $_.head_repository.full_name -ceq "mkurtgerald/K5-Vision"
              } | Sort-Object -Property id -Descending)
              if ($matching.Count -eq 0) { $qualified = $false; continue }
              if (@($matching | Where-Object { $_.status -ceq "completed" -and $_.conclusion -cne "success" }).Count -ne 0) {
                throw "An exact-candidate hosted qualification failed; native execution refused."
              }
              if ($matching[0].status -cne "completed" -or $matching[0].conclusion -cne "success") { $qualified = $false }
            }
            return $qualified
          }
          if (-not (Test-K5CandidateHostedGates)) { throw "Exact hosted qualification is no longer green; no physical work admitted." }

      - name: Admit existing Git before immutable checkouts
        id: git_before_candidate
        timeout-minutes: 3
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $pins = @(
              @{ name = 'assert-stage-one-physical-admission.ps1'; size = 7643; blob = '9faae324ffaf008a7dc389aaab2d70198c5f4ea1'; sha256 = 'd7a38b5278802d9ba768d9987b4582a219d490923b0cc4da0c297d29a250b45d' },
              @{ name = 'assert-installed-git-alias.ps1'; size = 13028; blob = 'a3f9ae05f204905c9cd2e68f894a6bd53dc4d53c'; sha256 = '67c4d3d7bcef1ae8e8bfea56acaaf7e2192622a217ae1e2450f8680ae2b93dc8' },
              @{ name = 'admit_installed_git_alias.cs'; size = 36598; blob = '1e45e51c6171d88ff582466ba2664f9b81b75ebf'; sha256 = 'a751156ee06792f8f4625fa988c73a54c8e9a0a24937c06ab9264762f965d23f' }
          )
          # Fresh immutable source admission; no executable, checkout file or saved receipt is trusted here.
          $strictUtf8 = [Text.UTF8Encoding]::new($false, $true)
          function Read-K5PinnedBlob($Pin) {
              $response = $null; $stream = $null; $memory = $null; $sha1 = $null; $sha256 = $null
              try {
                  if ($env:GITHUB_API_URL -cne 'https://api.github.com' -or
                      $env:GITHUB_REPOSITORY -cne 'mkurtgerald/K5-Vision' -or
                      [string]::IsNullOrEmpty($env:K5_GITHUB_TOKEN) -or $env:K5_GITHUB_TOKEN.Length -gt 8192 -or
                      $Pin.size -le 0 -or $Pin.size -gt 65536 -or
                      $Pin.blob -cnotmatch '\A[0-9a-f]{40}\z' -or $Pin.sha256 -cnotmatch '\A[0-9a-f]{64}\z') { throw 'context' }
                  $url = 'https://api.github.com/repos/mkurtgerald/K5-Vision/git/blobs/' + $Pin.blob
                  $request = [Net.HttpWebRequest]::Create($url)
                  $request.Method = 'GET'; $request.AllowAutoRedirect = $false
                  $request.Timeout = 15000; $request.ReadWriteTimeout = 15000
                  $request.MaximumResponseHeadersLength = 16
                  $request.AutomaticDecompression = [Net.DecompressionMethods]::None
                  $request.Accept = 'application/vnd.github+json'; $request.UserAgent = 'K5-fixed-git-admission/1'
                  $request.Headers['Authorization'] = 'Bearer ' + $env:K5_GITHUB_TOKEN
                  $request.Headers['X-GitHub-Api-Version'] = '2022-11-28'
                  $response = $request.GetResponse()
                  if ([int]$response.StatusCode -ne 200 -or $response.ResponseUri.AbsoluteUri -cne $url -or
                      $response.ContentLength -gt 131072 -or -not [string]::IsNullOrEmpty($response.ContentEncoding)) { throw 'response' }
                  $stream = $response.GetResponseStream(); $memory = [IO.MemoryStream]::new()
                  $buffer = [byte[]]::new(4096)
                  $deadline = [Diagnostics.Stopwatch]::StartNew()
                  while ($true) {
                      $remaining = 131072 - [int]$memory.Length
                      if ($remaining -le 0 -or $deadline.ElapsedMilliseconds -ge 15000) { throw 'response_bound' }
                      $read = $stream.ReadAsync($buffer, 0, [Math]::Min($buffer.Length, $remaining))
                      if (-not $read.Wait([Math]::Max(1, 15000 - [int]$deadline.ElapsedMilliseconds))) { throw 'response_timeout' }
                      if ($read.Result -eq 0) { break }
                      $memory.Write($buffer, 0, $read.Result)
                  }
                  $record = ConvertFrom-Json -InputObject $strictUtf8.GetString($memory.ToArray()) -ErrorAction Stop
                  if ($record.sha -isnot [string] -or $record.sha -cne $Pin.blob -or $record.encoding -cne 'base64' -or
                      ($record.size -isnot [int] -and $record.size -isnot [long]) -or $record.size -ne $Pin.size -or
                      $record.content -isnot [string] -or $record.content.Length -gt 100000) { throw 'blob' }
                  $encoded = $record.content.Replace("`r", '').Replace("`n", '')
                  if ($encoded -cnotmatch '\A(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?\z' -or
                      $encoded.Length -ne 4 * [Math]::Ceiling($Pin.size / 3.0)) { throw 'base64' }
                  $bytes = [Convert]::FromBase64String($encoded)
                  if ($bytes.Length -ne $Pin.size -or [Convert]::ToBase64String($bytes) -cne $encoded) { throw 'size' }
                  $sha256 = [Security.Cryptography.SHA256]::Create(); $sha1 = [Security.Cryptography.SHA1]::Create()
                  if (([BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant() -cne $Pin.sha256) { throw 'digest' }
                  $header = [Text.Encoding]::ASCII.GetBytes('blob ' + [string]$bytes.Length + [char]0)
                  $framed = [byte[]]::new($header.Length + $bytes.Length)
                  [Array]::Copy($header, 0, $framed, 0, $header.Length); [Array]::Copy($bytes, 0, $framed, $header.Length, $bytes.Length)
                  if (([BitConverter]::ToString($sha1.ComputeHash($framed))).Replace('-', '').ToLowerInvariant() -cne $Pin.blob) { throw 'git_blob' }
                  $null = $strictUtf8.GetString($bytes)
                  return ,$bytes
              } catch { throw 'Pinned Git admission source refused; existing owners were preserved.' }
              finally {
                  foreach ($owned in @($sha1, $sha256, $memory, $stream, $response)) { if ($null -ne $owned) { $owned.Dispose() } }
              }
          }
          function Assert-K5OrdinaryCompilerPath([string]$Path, [bool]$Directory) {
              if ([string]::IsNullOrEmpty($Path) -or $Path.Length -gt 1024 -or $Path -cnotmatch '\A[A-Z]:\\' -or
                  $Path -match '[\x00-\x1f"<>|?*]' -or $Path.Substring(2).Contains(':') -or
                  [IO.Path]::GetFullPath($Path) -cne $Path) { throw 'compiler_path' }
              foreach ($part in $Path.Substring(3).Split('\')) {
                  if ($part.Length -eq 0 -or $part -in @('.', '..') -or $part.EndsWith('.') -or $part.EndsWith(' ')) { throw 'compiler_path' }
              }
              $item = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
              if ($item.FullName -cne $Path -or [bool]$item.PSIsContainer -ne $Directory) { throw 'compiler_type' }
              $depth = 0
              while ($null -ne $item) {
                  $depth++
                  if ($depth -gt 32 -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                      -not [string]::IsNullOrEmpty($item.LinkType)) { throw 'compiler_alias' }
                  $item = $(if ($item -is [IO.FileInfo]) { $item.Directory } else { $item.Parent })
              }
          }
          try {
              if ($env:GITHUB_RUN_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or $env:GITHUB_RUN_ATTEMPT -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
                  $env:GITHUB_ACTION -cnotmatch '\A[A-Za-z_][A-Za-z0-9_-]{0,79}\z') { throw 'context' }
              $guardBytes = Read-K5PinnedBlob $pins[0]
              $helperBytes = Read-K5PinnedBlob $pins[1]
              $collectorBytes = Read-K5PinnedBlob $pins[2]
              $trustedGuard = [scriptblock]::Create($strictUtf8.GetString($guardBytes))
              & $trustedGuard | Out-Null
              Assert-K5OrdinaryCompilerPath $env:RUNNER_TEMP $true
              $privateCompilerTemp = Join-Path $env:RUNNER_TEMP ('k5-installed-git-alias-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $env:GITHUB_ACTION)
              if (Test-Path -LiteralPath $privateCompilerTemp -ErrorAction Stop) { throw 'compiler_exists' }
              $created = New-Item -ItemType Directory -Path $privateCompilerTemp -ErrorAction Stop
              if ($created.FullName -cne $privateCompilerTemp) { throw 'compiler_path' }
              Assert-K5OrdinaryCompilerPath $privateCompilerTemp $true
              $invokeGit = & ([scriptblock]::Create($strictUtf8.GetString($helperBytes))) -SourceBytes $collectorBytes -AssertBoundary $trustedGuard -CompilerTemp $privateCompilerTemp
              if ($invokeGit -isnot [scriptblock]) { throw 'initializer' }
          } catch { throw 'Fresh exact Git admission initialization refused; existing owners were preserved.' }
          function Invoke-K5OwnedGitText([string]$AdmittedGitPath, [string]$Arguments, [int]$Budget = 10000) {
              # Called only inside one fresh held admission. One owned child, bounded output and lifetime.
              $process = $null; $started = $false; $memory = $null
              try {
                  if ($AdmittedGitPath -cne 'C:\Program Files\Git\cmd\git.exe' -or $Budget -notin @(10000, 30000)) { throw 'git' }
                  $start = [Diagnostics.ProcessStartInfo]::new()
                  $start.FileName = $AdmittedGitPath; $start.Arguments = $Arguments
                  $start.WorkingDirectory = $env:GITHUB_WORKSPACE
                  $start.UseShellExecute = $false; $start.CreateNoWindow = $true
                  $start.RedirectStandardInput = $true; $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
                  foreach ($key in @($start.EnvironmentVariables.Keys)) {
                      if ($key -like 'GIT_*') { $start.EnvironmentVariables.Remove($key) }
                  }
                  $start.EnvironmentVariables['GIT_NO_REPLACE_OBJECTS'] = '1'
                  $start.EnvironmentVariables['GIT_NO_LAZY_FETCH'] = '1'
                  $start.EnvironmentVariables['GIT_ALLOW_PROTOCOL'] = ''
                  $process = [Diagnostics.Process]::new(); $process.StartInfo = $start
                  $started = $process.Start()
                  if (-not $started) { throw 'git' }
                  $process.StandardInput.Close()
                  $drain = $process.StandardError.BaseStream.CopyToAsync([IO.Stream]::Null)
                  $watch = [Diagnostics.Stopwatch]::StartNew()
                  $stream = $process.StandardOutput.BaseStream
                  $memory = [IO.MemoryStream]::new(); $buffer = [byte[]]::new(1024)
                  while ($true) {
                      $remaining = $Budget - [int]$watch.ElapsedMilliseconds
                      if ($remaining -le 0) { throw 'git' }
                      $read = $stream.ReadAsync($buffer, 0, $buffer.Length)
                      if (-not $read.Wait($remaining)) { throw 'git' }
                      if ($read.Result -eq 0) { break }
                      if ($memory.Length + $read.Result -gt 4096) { throw 'git' }
                      $memory.Write($buffer, 0, $read.Result)
                  }
                  $remaining = $Budget - [int]$watch.ElapsedMilliseconds
                  if ($remaining -le 0 -or -not $process.WaitForExit($remaining) -or $process.ExitCode -ne 0) { throw 'git' }
                  $remaining = $Budget - [int]$watch.ElapsedMilliseconds
                  if ($remaining -le 0 -or -not $drain.Wait($remaining)) { throw 'git' }
                  $text = [Text.UTF8Encoding]::new($false, $true).GetString($memory.ToArray())
                  if ($text.Length -gt 0) {
                      $text = $text -replace '(?:\r?\n)\z', ''
                      foreach ($line in ($text -split '\r?\n')) { Write-Output $line }
                  }
              } catch { throw 'Bounded owned Git operation refused.' }
              finally {
                  try {
                      if ($null -ne $process -and $started) {
                          if (-not $process.HasExited) { $process.Kill() }
                          if (-not $process.WaitForExit(2000)) { throw 'Owned Git cleanup refused.' }
                      }
                  } finally {
                      if ($null -ne $memory) { $memory.Dispose() }
                      if ($null -ne $process) { $process.Dispose() }
                  }
              }
          }
          $ownedGitText = ${function:Invoke-K5OwnedGitText}
          # Only the exact approved installed pair is admitted. Never provision Git.
          $versionText = & $invokeGit -Operation ({
              param($AdmittedGitPath)
              $output = @(& $ownedGitText $AdmittedGitPath '--version')
              if ($output.Count -ne 1) { throw 'version' }
              $text = ([string]$output[0]).Trim()
              if ($text -cnotmatch '\Agit version (?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)\.windows\.[0-9]+\z') { throw 'version' }
              $version = [Version]::new([int]$Matches.major, [int]$Matches.minor, [int]$Matches.patch)
              if ($version -lt [Version]'2.18.0' -or $text -cne 'git version 2.55.0.windows.5') { throw 'version' }
              return $text
          }.GetNewClosure())
