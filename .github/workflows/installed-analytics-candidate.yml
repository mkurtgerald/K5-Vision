              # Reproject only the complete fixed schema; never echo a child output line.
              function Test-K5Keys($Value, [string]$Keys) {
                  if ($null -eq $Value -or $Value.GetType().FullName -cne 'System.Management.Automation.PSCustomObject' -or
                      (@($Value.PSObject.Properties.Name | Sort-Object) -join ',') -cne $Keys) { throw 'probe' }
              }
              function Test-K5Enum($Value, $Choices) {
                  if ($Value -isnot [string] -or $Value -cnotin $Choices) { throw 'probe' }
              }
              function Test-K5Integer($Value, [long]$Minimum, [long]$Maximum) {
                  if (($Value -isnot [int] -and $Value -isnot [long]) -or $Value -lt $Minimum -or $Value -gt $Maximum) { throw 'probe' }
              }
              $observed = $probe[0].Substring('K5_STORAGE_PREFLIGHT='.Length) | ConvertFrom-Json -ErrorAction Stop
              Test-K5Keys $observed 'code,later_admission_required,retention_state,schema_version,scope,stage,status,storage_acl'
              Test-K5Enum $observed.schema_version @('storage-preflight-v1')
              Test-K5Enum $observed.scope @('read-only-early-storage-admission')
              Test-K5Enum $observed.retention_state @('not_started')
              Test-K5Enum $observed.status @('passed', 'refused')
              Test-K5Enum $observed.stage @('runtime_binding', 'source_binding', 'storage_construction', 'storage_root')
              $stageCodes = @{
                  runtime_binding = @('runtime_unavailable')
                  source_binding = @('source_unavailable', 'source_cleanup_failed')
                  storage_construction = @('storage_path', 'storage_policy', 'storage_helper', 'storage_identity', 'storage_ownership', 'storage_interrupted')
                  storage_root = @('storage_path', 'storage_layout', 'storage_volume', 'storage_ownership', 'storage_acl', 'storage_helper', 'storage_interrupted', 'passed')
              }
              Test-K5Enum $observed.code $stageCodes[$observed.stage]
              if ($observed.later_admission_required -isnot [bool] -or -not $observed.later_admission_required -or
                  (($probeExit -eq 0) -ne ($observed.status -ceq 'passed')) -or
                  (($observed.code -ceq 'passed') -ne ($observed.status -ceq 'passed'))) { throw 'probe' }
              $acl = $null
              if ($null -ne $observed.storage_acl) {
                  if ($observed.code -cne 'storage_acl') { throw 'probe' }
                  $inputAcl = $observed.storage_acl
                  $aclKeys = 'ace,admission_mode,ancestor_distance,native_call,native_error,path_context,path_role,phase,reason,schema_version'
                  Test-K5Keys $inputAcl $aclKeys
                  Test-K5Enum $inputAcl.schema_version @('storage-acl-admission-v2')
                  Test-K5Enum $inputAcl.path_role @('runner_workspace', 'workspace', 'runner_temp', 'work_root', 'ancestor', 'unknown')
                  Test-K5Enum $inputAcl.path_context @('runner_workspace', 'workspace', 'runner_temp', 'work_root', 'unknown')
                  Test-K5Enum $inputAcl.admission_mode @('ancestor', 'owned', 'existing', 'unknown')
                  Test-K5Enum $inputAcl.phase @('principal_query', 'token_owner_query', 'descriptor_query', 'trusted_installer_query', 'ownership_policy', 'ace_policy', 'unknown')
                  Test-K5Enum $inputAcl.native_call @('GetNamedSecurityInfoW', 'none', 'unknown')
                  Test-K5Enum $inputAcl.native_error @('success', 'access_denied', 'path_missing', 'invalid_parameter', 'insufficient_buffer', 'invalid_acl', 'invalid_security_descriptor', 'other_error', 'not_observed', 'unknown')
                  Test-K5Enum $inputAcl.reason @('foreign_mutating_allow', 'unsupported_ace', 'native_query', 'descriptor_parse', 'owner_sid_parse', 'descriptor_validation', 'unknown')
                  if ($null -ne $inputAcl.ancestor_distance) { Test-K5Integer $inputAcl.ancestor_distance 1 64 }
                  $ace = $null
                  if ($null -ne $inputAcl.ace) {
                      if ($inputAcl.phase -cne 'ace_policy' -or $inputAcl.reason -cne 'foreign_mutating_allow') { throw 'probe' }
