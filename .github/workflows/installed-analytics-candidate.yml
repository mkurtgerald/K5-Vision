              common.require(initial["revision"] == os.environ["K5_STAGE_ONE_REVISION"])
              common.require(common.file_hash(controller) == initial["facade_controller_sha256"])
              common.require(all(admitted[key] == value for key, value in initial.items()))
              common.require(not (facade_root / "work").exists())
          except BaseException:
              print("K5_ALPHA_FACADE_AUTHORITY_VALIDATION_FAILED")
              raise SystemExit(1)
          '@ | & $base -I -B -S - $root $facade
          if ($LASTEXITCODE -ne 0) { throw "Independent facade authority validation failed." }
          & $base -I -B -S "$root\source\scripts\installed_alpha_facade_witness.py" --validate-receipt --expectations $env:K5_ALPHA_FACADE_EXPECTATIONS --output $env:K5_ALPHA_FACADE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw "Installed facade receipt violated independent source-free contract." }

      - name: Retain exact qualified wheel provenance locally
        id: wheel_provenance
        if: github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003' && steps.safe_evidence.outcome == 'success' && steps.safe_alpha_evidence.outcome == 'success'
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:K5_ALPHA_LAUNCHER_OWNED
          $base = $env:K5_WITNESS_BASE_PYTHON
          if ((Get-FileHash -LiteralPath $base -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:K5_WITNESS_BASE_PYTHON_SHA256) { throw "Admitted base Python changed." }
          # Derive the actual pipeline directory; collector independently binds
          # it to RUNNER_TEMP's parent and refuses aliases or another volume.
          $runnerWorkspace = Split-Path -Parent $env:GITHUB_WORKSPACE
          if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_WORKSPACE) -and [IO.Path]::GetFullPath($env:RUNNER_WORKSPACE) -cne [IO.Path]::GetFullPath($runnerWorkspace)) { throw "Runner workspace admission mismatch." }
          & $base -I -B -S "$root\source\scripts\capture_installer_wheel_provenance.py" --launcher-root $root --receipt $env:K5_ALPHA_LAUNCHER_OUTPUT --normal-receipt $env:K5_INSTALLED_ANALYTICS_OUTPUT --workspace $env:GITHUB_WORKSPACE --runner-workspace $runnerWorkspace --runner-temp $env:RUNNER_TEMP --revision $env:K5_STAGE_ONE_REVISION --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT --base-python-sha256 $env:K5_WITNESS_BASE_PYTHON_SHA256 --output artifacts\installed-alpha-wheel-provenance.json
          if ($LASTEXITCODE -ne 0) { throw "Qualified wheel provenance capture failed closed." }

      - name: Remove only this job's disposable fixture and controller
        if: always()
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # The controllers alone know whether their collectors/Jobs are quiescent.
          # Any remaining work root, missing ownership proof or denied read preserves
          # ALL shared input/controller roots. Never override their deletion guard.
          $preserveOwnedRoots = $false
          $guardedRoots = @{ K5_ALPHA_LAUNCHER_OWNED = "k5-alpha-launcher-"; K5_ALPHA_FACADE_OWNED = "k5-alpha-facades-" }
          foreach ($name in $guardedRoots.Keys) {
            $owned = [Environment]::GetEnvironmentVariable($name, "Process")
            if ([string]::IsNullOrWhiteSpace($owned)) { continue }
            try {
              $expected = Join-Path $env:RUNNER_TEMP ($guardedRoots[$name] + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
              if ([IO.Path]::GetFullPath($owned) -cne [IO.Path]::GetFullPath($expected)) { throw "ownership" }
              try {
                $null = [IO.File]::GetAttributes((Join-Path $owned "work"))
                $preserveOwnedRoots = $true
              } catch [IO.FileNotFoundException] {
                # Only positively absent controller work authorizes outer cleanup.
              } catch [IO.DirectoryNotFoundException] {
              } catch { $preserveOwnedRoots = $true }
            } catch { $preserveOwnedRoots = $true }
          }
          if ($preserveOwnedRoots) { throw "Controller work retained or unavailable; preserving all owned roots for diagnosis." }
          $cleanupComplete = $true
          $prefixes = @{ K5_INSTALLED_WORK_OWNED = "k5-installed-work-"; K5_INSTALLED_EVIDENCE_OWNED = "k5-installed-evidence-"; K5_INSTALLED_CONTROLLER_OWNED = "k5-installed-controller-"; K5_ALPHA_LAUNCHER_OWNED = "k5-alpha-launcher-"; K5_ALPHA_FACADE_OWNED = "k5-alpha-facades-" }
          foreach ($name in @("K5_INSTALLED_WORK_OWNED", "K5_INSTALLED_EVIDENCE_OWNED", "K5_INSTALLED_CONTROLLER_OWNED", "K5_ALPHA_LAUNCHER_OWNED", "K5_ALPHA_FACADE_OWNED")) {
            $owned = [Environment]::GetEnvironmentVariable($name, "Process")
            if ([string]::IsNullOrWhiteSpace($owned)) { continue }
            try {
              $expected = Join-Path $env:RUNNER_TEMP ($prefixes[$name] + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
              if ([IO.Path]::GetFullPath($owned) -cne [IO.Path]::GetFullPath($expected)) { throw "ownership" }
              if (Test-Path -LiteralPath $owned) { Remove-Item -LiteralPath $owned -Recurse -Force -ErrorAction Stop }
              if (Test-Path -LiteralPath $owned) { throw "cleanup" }
            } catch { $cleanupComplete = $false }
          }
          if (-not $cleanupComplete) { throw "Owned installed-witness fixture cleanup was incomplete." }

      - name: Upload only validated installed normal-app receipt
        if: success() && steps.safe_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-analytics-candidate-witness
          path: artifacts/installed-analytics-candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload only validated installed Start-script receipt
        if: success() && steps.safe_alpha_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-alpha-start-script-witness
          path: artifacts/installed-alpha-start-script-witness.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload only validated installed facade receipt
        if: success() && steps.safe_facade_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-alpha-facades-witness
          path: artifacts/installed-alpha-facades-witness.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain only validated source-free facade expectations
        if: success() && steps.safe_facade_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-alpha-facades-expectations
          path: artifacts/installed-alpha-facades-expectations.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload source-free wheel provenance only
        if: success() && steps.wheel_provenance.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-alpha-wheel-provenance
          path: artifacts/installed-alpha-wheel-provenance.json
          if-no-files-found: error
          retention-days: 14
