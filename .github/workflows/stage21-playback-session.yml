name: Stage 21 Playback Session Qualification

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed commit selected for this qualification
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage21-playback-session:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      inputs.reviewed_sha == github.sha
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 25
    env:
      K5_STAGE20_PHYSICAL: "1"
      K5_STAGE20_OUTPUT: ${{ github.workspace }}\artifacts\stage21-stage20-regression.json
      K5_STAGE20_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout exact Stage 21 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provision isolated reviewed GStreamer runtime
        shell: powershell
        run: .\scripts\provision-stage03-gstreamer.ps1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bounded session regressions
        shell: powershell
        run: pytest tests/unit/test_playback_session.py -q --no-cov

      - name: Verify private physical configuration
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Required Stage 21 physical source configuration is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CAM_CRED)) {
            throw "Required Stage 21 physical credential configuration is missing."
          }

      - name: Resolve private camera credential candidate
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          $index = & python -m k5vision.stage03_credential_probe "env:K5_STAGE03_SOURCE"
          if ($LASTEXITCODE -ne 0 -or $index -notmatch '^\d+$') {
            throw "No supplied camera credential candidate authenticated the Stage 21 source."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "K5_STAGE03_CREDENTIAL_INDEX=$index"

      - name: Regress accepted transient decoder boundary
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: pytest tests/integration/test_stage20_physical.py -q --no-cov

      - name: Assert retained evidence is source-free
        id: safe_evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:K5_STAGE20_OUTPUT)) {
            throw "Stage 21 decoder-regression evidence was not produced."
          }
          $text = Get-Content -LiteralPath $env:K5_STAGE20_OUTPUT -Raw
          foreach ($pattern in @(
            'rtsp://',
            '(?i)username',
            '(?i)password',
            '(?i)credential',
            '(?i)runner[_ -]?name',
            '[A-Za-z]:\\',
            '\\Users\\',
            '(?<![0-9])(?:10\.|127\.|169\.254\.|192\.168\.)'
          )) {
            if ($text -match $pattern) {
              throw "Stage 21 retained evidence violated the source-free contract."
            }
          }

      - name: Upload source-free Stage 21 regression evidence
        if: success() && steps.safe_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage21-playback-session-evidence
          path: artifacts/stage21-stage20-regression.json
          if-no-files-found: warn
          retention-days: 14
