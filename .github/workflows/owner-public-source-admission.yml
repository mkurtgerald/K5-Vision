name: Owner Public Source Admission
on:
  push:
    branches: [fix/transactional-alpha-upgrade-20261003]
    paths: [.github/workflows/owner-public-source-admission.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-interface:
    if: github.repository == 'mkurtgerald/K5-Vision' && github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate anonymous publisher handshake without acquiring media
        shell: python
        run: |
          import http.cookiejar
          import json
          import re
          import urllib.request
          import urllib.parse
          origin = 'https://rtsplink.com'
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(path):
              request = urllib.request.Request(origin + path, headers={'User-Agent': 'K5-Engineering-TestSourceReview/1.0', 'Accept':'application/json'})
              with opener.open(request, timeout=15) as response:
                  if urllib.parse.urlsplit(response.url).hostname != 'rtsplink.com':
                      raise RuntimeError('Unexpected publisher origin')
                  data = response.read(262145)
                  if len(data) > 262144:
                      raise RuntimeError('Publisher response exceeds bound')
                  return json.loads(data)
          def keys(value):
              return sorted(k for k in value if re.fullmatch(r'[A-Za-z_]{1,48}', k))[:30] if isinstance(value,dict) else []
          try:
              session = get('/api/v1/session/active')
              print('K5_PUBLISHER_SESSION_SCHEMA=' + json.dumps(keys(session)))
              print('K5_PUBLISHER_SESSION_HANDSHAKE=' + str(bool(session.get('csrfToken') and session.get('nonce'))).lower())
              catalog = get('/api/v1/streams/catalog')
              print('K5_PUBLISHER_CATALOG_SCHEMA=' + json.dumps(keys(catalog)))
              streams = catalog.get('streams', [])
              approved = {'live/test','live/people','live/traffic','live/objects','live/retail','people','traffic','objects','retail'}
              for stream in streams[:12]:
                  print('K5_PUBLISHER_STREAM_SCHEMA=' + json.dumps(keys(stream)))
                  if isinstance(stream,dict):
                      for key,value in stream.items():
                          if isinstance(value,str) and value in approved:
                              print('K5_PUBLISHER_LIBRARY_SELECTOR=' + key + ':' + value)
              print('K5_EXTERNAL_MEDIA_ACCEPTANCE=not_attempted')
          except Exception:
              print('K5_PUBLISHER_HANDSHAKE=unavailable')
              raise SystemExit(1)
