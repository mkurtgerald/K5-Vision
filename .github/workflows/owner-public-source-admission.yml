name: Owner Public Source Admission
on:
  push:
    branches: [fix/transactional-alpha-upgrade-20261003]
    paths: [.github/workflows/owner-public-source-admission.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-interface:
    if: github.repository == 'mkurtgerald/K5-Vision' && github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Review documented anonymous session initialization without acquiring media
        shell: python
        run: |
          import http.cookiejar
          import json
          import urllib.error
          import urllib.request
          import urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          cookies = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPCookieProcessor(cookies))
          csrf = None
          issued = False
          failed = False
          stage = 'homepage'
          def request(path, payload=None, document=False):
              headers = {'User-Agent':'K5-Engineering-TestSourceReview/1.0', 'Accept':'text/html' if document else 'application/json', 'Origin':'https://rtsplink.com'}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers.update({'Content-Type':'application/json','X-CSRF-Token':csrf})
              req = urllib.request.Request('https://rtsplink.com'+path, data=data, headers=headers)
              with opener.open(req, timeout=15) as response:
                  raw = response.read(524289)
                  if len(raw) > 524288:
                      raise ValueError('Response exceeds bound')
                  return None if document else json.loads(raw)
          try:
              # Follow the documented browser entry before requesting its anonymous
              # session. No account/authentication endpoint or access-control bypass.
              request('/', document=True)
              print('K5_PUBLISHER_HOMEPAGE_COOKIE_COUNT=' + str(len(cookies)))
              stage = 'session'
              session = request('/api/v1/session/active')
              csrf, nonce = session.get('csrfToken'), session.get('nonce')
              print('K5_PUBLISHER_SESSION_COOKIE_COUNT=' + str(len(cookies)))
              assert isinstance(csrf,str) and isinstance(nonce,str) and csrf and nonce
              stage = 'catalog'
              catalog = request('/api/v1/streams/catalog')
              assert len([s for s in catalog.get('streams',[]) if s.get('id') == 'live/people']) == 1
              stage = 'issue'
              issued = True
              token = request('/api/v1/token/generate', {'csrfToken':csrf,'nonce':nonce,'streamName':'live/people','forceNew':False,'quality':{'resolution':'source','fps':'source','allowCompatibilityUpscale':False}})
              source = token.get('rtspUrl')
              assert isinstance(source,str) and len(source) <= 2048
              uri = urllib.parse.urlsplit(source)
              assert uri.scheme == 'rtsp' and uri.hostname == 'rtsp.rtsplink.com'
              assert uri.username is None and uri.password is None and not uri.fragment
              print('K5_PUBLISHER_PUBLIC_TOKEN=verified_transiently')
          except urllib.error.HTTPError as error:
              failed = True
              print('K5_PUBLISHER_FAILURE_STAGE=' + stage)
              print('K5_PUBLISHER_HTTP_STATUS=' + str(int(error.code)))
              try:
                  body = json.loads(error.read(4096))
                  detail = json.dumps(body).lower()
                  # Only fixed booleans leave this fresh anonymous-session probe.
                  for category in ('session','csrf','nonce','authentication','login','quality','expired','unauthorized'):
                      print('K5_PUBLISHER_ERROR_' + category.upper() + '=' + str(category in detail).lower())
              except Exception:
                  print('K5_PUBLISHER_ERROR_CODE=unclassified')
          except Exception:
              failed = True
              print('K5_PUBLISHER_FAILURE_STAGE=' + stage)
          finally:
              if issued:
                  try:
                      request('/api/v1/token/revoke', {'csrfToken':csrf})
                      state = request('/api/v1/session/active')
                      assert state.get('active') is False
                      print('K5_PUBLISHER_PUBLIC_TOKEN=revoked')
                  except Exception:
                      failed = True
                      print('K5_PUBLISHER_PUBLIC_TOKEN=revocation_unconfirmed')
              print('K5_EXTERNAL_MEDIA_ACCEPTANCE=not_attempted')
          if failed:
              raise SystemExit(1)
