name: Owner Installed Product Smoke
on:
  push:
    branches: [fix/transactional-alpha-upgrade-20261003]
    paths:
      - .github/workflows/owner-installed-product-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  engineering-source:
    if: github.repository == 'mkurtgerald/K5-Vision' && github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Archive tracked engineering source only
        run: |
          mkdir -p source-export
          git archive --format=zip --output=source-export/source.zip HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: owner-product-engineering-source-${{ github.sha }}
          path: source-export/source.zip
          if-no-files-found: error
          retention-days: 3
  installed-gui-smoke:
    if: github.repository == 'mkurtgerald/K5-Vision' && github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Download exact repaired setup with independent byte identity
        shell: powershell
        timeout-minutes: 3
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{ Authorization = "Bearer $env:GH_READ_TOKEN"; Accept = 'application/vnd.github+json' }
          $zip = Join-Path $env:RUNNER_TEMP 'retained-owner-setup.zip'
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 -Headers $headers -Uri 'https://api.github.com/repos/mkurtgerald/K5-Vision/actions/artifacts/11683221888/zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '4bfd043b2e7694e52a942712b7f25c41e49f20b2e0250cecebc7c476d8ce04ab') { throw 'Retained artifact identity mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'retained-owner-setup')
          $setup = Join-Path $env:RUNNER_TEMP 'retained-owner-setup\K5VisionAlpha-Setup-887051738890ca2c0e34431bd707fe302654747e.exe'
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -cne '5d78b0e464fee40f482fed97ce31c66f4df457b87f023cd3bcaf5ec06d9c19fb') { throw 'Retained executable identity mismatch.' }
          if ((Get-Item -LiteralPath $setup).Length -ne 163468532) { throw 'Retained executable size mismatch.' }
          Write-Host 'K5_PRODUCT_SETUP_IDENTITY=8870517_verified'
      - name: Install exact executable without owner shell interaction
        shell: powershell
        timeout-minutes: 23
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:LOCALAPPDATA 'K5VisionAlpha'
          if (Test-Path -LiteralPath $root) { throw 'Fresh installed-product root required.' }
          $setup = Join-Path $env:RUNNER_TEMP 'retained-owner-setup\K5VisionAlpha-Setup-887051738890ca2c0e34431bd707fe302654747e.exe'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Exact setup installation failed.' }
          if (([IO.File]::ReadAllText((Join-Path $root 'k5-revision.txt'))).Trim() -cne '887051738890ca2c0e34431bd707fe302654747e') { throw 'Installed revision mismatch.' }
          Write-Host 'K5_PRODUCT_INSTALL=passed'
      - name: Invoke real GUI Run test and require installed operator presentation
        shell: powershell
        timeout-minutes: 7
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root = Join-Path $env:LOCALAPPDATA 'K5VisionAlpha'
          $gui = Start-Process -FilePath (Join-Path $root 'K5VisionAlpha.exe') -PassThru
          $stage = 'gui-open'
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $gui.Refresh()
            } until ($gui.HasExited -or $gui.MainWindowHandle -ne [IntPtr]::Zero -or [DateTime]::UtcNow -gt $deadline)
            if ($gui.HasExited -or $gui.MainWindowHandle -eq [IntPtr]::Zero) { throw 'GUI did not open.' }
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($gui.MainWindowHandle)
            $buttonCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Run test')
            $button = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $buttonCondition)
            if ($null -eq $button -or -not $button.Current.IsEnabled) { throw 'Installed test action unavailable.' }
            $editCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Edit)
            $edits = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $editCondition)
            $status = $null
            foreach ($edit in $edits) {
              $value = $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              if ($value.Current.IsReadOnly) { $status = $value }
            }
            if ($null -eq $status) { throw 'GUI status unavailable.' }
            # Blank input uses generated loopback video only. No cameras, screenshots,
            # media files, source values, stack traces or raw child logs are retained.
            $stage = 'run-test'
            $invoke = $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invoke.Invoke()
            $deadline = [DateTime]::UtcNow.AddMinutes(5)
            $passed = $false
            do {
              Start-Sleep -Milliseconds 500
              $text = $status.Current.Value
              if ($text.Contains('Synthetic video-only smoke passed; public RTSP analytics NOT qualified.')) { $passed = $true; break }
              if ($text.Contains('Test did not pass:') -or $text.Contains('Stage-One NOT qualified:')) { break }
            } while ([DateTime]::UtcNow -lt $deadline -and -not $gui.HasExited)
            # Only bounded fixed diagnostic codes leave this job, never GUI text.
            $diagnostic = 'no-terminal-status'
            if ($text.Contains('Analytics did not meet')) { $diagnostic = 'analytics-gate' }
            elseif ($text.Contains('GStreamer runtime validation failed')) { $diagnostic = 'gstreamer' }
            elseif ($text.Contains('RTSP test source could not')) { $diagnostic = 'source-decode' }
            elseif ($text.Contains('local K5 service did not')) { $diagnostic = 'service-health' }
            elseif ($text.Contains('missing health, analytics')) { $diagnostic = 'receipt-incomplete' }
            elseif ($text.Contains('Test did not pass:')) { $diagnostic = 'runtime-failed' }
            Write-Host ('K5_PRODUCT_GUI_HEALTH=' + [int]$text.Contains('K5 local service health passed.'))
            Write-Host ('K5_PRODUCT_GUI_PRESENTATION=' + [int]$text.Contains('Positive operator frames and presentations confirmed.'))
            Write-Host ('K5_PRODUCT_GUI_PRIVACY=' + [int]$text.Contains('No test media was retained.'))
            if (-not $passed) { Write-Host "K5_PRODUCT_GUI_DIAGNOSTIC=$diagnostic"; throw 'Installed GUI operator smoke did not pass.' }
            Write-Host 'K5_PRODUCT_GUI_SYNTHETIC_OPERATOR=passed'
            Write-Host 'K5_PRODUCT_EXTERNAL_RTSP_ACCEPTANCE=not_tested'
          } catch {
            Write-Host "K5_PRODUCT_FAILURE_STAGE=$stage"
            throw 'Installed-product smoke failed; inspect fixed diagnostic codes.'
          } finally {
            if (-not $gui.HasExited) { [void]$gui.CloseMainWindow(); [void]$gui.WaitForExit(10000) }
            $gui.Dispose()
          }
      - name: Remove owned installed application
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'K5VisionAlpha\unins000.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            $p = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw 'Owned application cleanup failed.' }
          }
