name: Windows generated camera probe diagnostic (9cbeb30)
on:
  pull_request:
    paths:
      - .github/workflows/diagnose-camera-probe-9cbeb30.yml
      - scripts/diagnose_windows_camera_probe_9cbeb30.py
permissions:
  contents: read
jobs:
  compare-probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic head with frozen application parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up development Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install diagnostic dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Probe diagnostic dependency install failed" }
      - name: Provision the exact immutable Windows FFprobe9 tools
        uses: ./.github/actions/provision-operator-tools
      - name: Compare original and bounded analysis on real generated media
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u scripts/diagnose_windows_camera_probe_9cbeb30.py --output camera-probe-9cbeb30-diagnostic.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve sanitized numeric diagnostic only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camera-probe-9cbeb30-diagnostic-${{ github.run_id }}
          path: camera-probe-9cbeb30-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only owned development tools
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:K5_DONOR_TOOL_ROOT)) { exit 0 }
          $toolRoot = [IO.Path]::GetFullPath($env:K5_DONOR_TOOL_ROOT)
          $expected = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          if (-not [string]::Equals([IO.Directory]::GetParent($toolRoot).FullName, $expected, [StringComparison]::OrdinalIgnoreCase) -or
              [IO.Path]::GetFileName($toolRoot) -notmatch '^K5 donor development tools [a-f0-9]{32}$') { throw "Probe diagnostic ownership refused" }
          if (Test-Path -LiteralPath $toolRoot) { Remove-Item -LiteralPath $toolRoot -Recurse -Force }
