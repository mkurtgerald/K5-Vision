name: Stage 19 Native Decoder ABI Qualification

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed commit selected for this qualification
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage19-native-decoder-abi:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      inputs.reviewed_sha == github.sha
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 15
    env:
      K5_STAGE19_OUTPUT: ${{ github.workspace }}\artifacts\stage19-native-decoder-abi.json
      K5_STAGE19_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout exact Stage 19 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provision isolated reviewed GStreamer runtime
        shell: powershell
        run: .\scripts\provision-stage03-gstreamer.ps1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Re-qualify exact Stage 18 decoder surface
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $surfaceOutput = Join-Path $env:RUNNER_TEMP "k5-stage19-runtime-surface.json"
          $qualifyArgs = @(
            "-m", "k5vision.media.decoder_runtime",
            "--revision", $env:K5_STAGE19_REVISION,
            "--output", $surfaceOutput
          )
          if (-not [string]::IsNullOrWhiteSpace($env:K5_GSTREAMER_INSTALLER_SHA256)) {
            $qualifyArgs += @("--installer-sha256", $env:K5_GSTREAMER_INSTALLER_SHA256)
          }
          & python @qualifyArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Stage 19 could not reproduce the accepted Stage 18 decoder surface."
          }
          Remove-Item -LiteralPath $surfaceOutput -Force -ErrorAction SilentlyContinue

      - name: Qualify native decoder ABI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m k5vision.media.gstreamer_native_abi `
            --revision $env:K5_STAGE19_REVISION `
            --runtime-root $env:K5_GSTREAMER_ROOT `
            --output $env:K5_STAGE19_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            throw "Stage 19 native decoder ABI qualification failed closed."
          }

      - name: Assert retained ABI evidence is source-free
        id: safe_evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:K5_STAGE19_OUTPUT)) {
            throw "Stage 19 evidence was not produced."
          }
          $text = Get-Content -LiteralPath $env:K5_STAGE19_OUTPUT -Raw
          foreach ($pattern in @(
            'rtsp://',
            '(?i)username',
            '(?i)password',
            '(?i)credential',
            '(?i)runner[_ -]?name',
            '[A-Za-z]:\\',
            '\\Users\\',
            '(?<![0-9])(?:10\.|127\.|169\.254\.|192\.168\.)'
          )) {
            if ($text -match $pattern) {
              throw "Stage 19 retained evidence violated the source-free contract."
            }
          }

      - name: Upload source-free Stage 19 evidence
        if: success() && steps.safe_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage19-native-decoder-abi-evidence
          path: artifacts/stage19-native-decoder-abi.json
          if-no-files-found: warn
          retention-days: 14
