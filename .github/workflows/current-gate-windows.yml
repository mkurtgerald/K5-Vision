name: Current Gate Windows Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/current-gate-windows.yml
      - src/k5vision/media/mixed_presentation.py
      - src/k5vision/media/presentation_runtime.py
      - src/k5vision/media/windows_operator_runtime.py
      - src/k5vision/media/windows_operator_host.py
      - src/k5vision/media/windows_operator_application.py
      - src/k5vision/media/windows_operator_control.py
      - src/k5vision/media/windows_operator_catalog_ui.py
      - src/k5vision/media/windows_operator_catalog_overlay.py
      - src/k5vision/media/windows_operator_catalog_feedback.py
      - src/k5vision/media/windows_operator_catalog_selector.py
      - tests/unit/test_current_gate_live_plan.py
      - tests/unit/test_current_gate_all_live_control.py
      - tests/unit/test_current_gate_operator_relayout_control.py
      - tests/unit/test_current_gate_operator_catalog_ui.py
      - tests/unit/test_current_gate_operator_catalog_overlay.py
      - tests/unit/test_current_gate_operator_catalog_feedback.py
      - tests/unit/test_current_gate_operator_catalog_selector.py
      - tests/integration/test_current_gate_windows.py
      - tests/integration/test_current_gate_all_live_application_windows.py
      - docs/current-gate-dependency-review.md
  push:
    branches: [main]
    paths:
      - .github/workflows/current-gate-windows.yml
      - src/k5vision/media/mixed_presentation.py
      - src/k5vision/media/presentation_runtime.py
      - src/k5vision/media/windows_operator_runtime.py
      - src/k5vision/media/windows_operator_host.py
      - src/k5vision/media/windows_operator_application.py
      - src/k5vision/media/windows_operator_control.py
      - src/k5vision/media/windows_operator_catalog_ui.py
      - src/k5vision/media/windows_operator_catalog_overlay.py
      - src/k5vision/media/windows_operator_catalog_feedback.py
      - src/k5vision/media/windows_operator_catalog_selector.py
      - tests/unit/test_current_gate_live_plan.py
      - tests/unit/test_current_gate_all_live_control.py
      - tests/unit/test_current_gate_operator_relayout_control.py
      - tests/unit/test_current_gate_operator_catalog_ui.py
      - tests/unit/test_current_gate_operator_catalog_overlay.py
      - tests/unit/test_current_gate_operator_catalog_feedback.py
      - tests/unit/test_current_gate_operator_catalog_selector.py
      - tests/integration/test_current_gate_windows.py
      - tests/integration/test_current_gate_all_live_application_windows.py
      - docs/current-gate-dependency-review.md

permissions:
  contents: read

jobs:
  current-gate-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run exact gate regression
        shell: powershell
        run: |
          pytest tests/unit/test_current_gate_live_plan.py tests/unit/test_current_gate_all_live_control.py tests/unit/test_current_gate_operator_relayout_control.py tests/unit/test_current_gate_operator_catalog_ui.py tests/unit/test_current_gate_operator_catalog_overlay.py tests/unit/test_current_gate_operator_catalog_feedback.py tests/unit/test_current_gate_operator_catalog_selector.py tests/integration/test_current_gate_windows.py tests/integration/test_current_gate_all_live_application_windows.py -q --no-cov
