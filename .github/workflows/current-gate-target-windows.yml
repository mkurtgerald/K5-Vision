      - docs/current-gate-dependency-review.md

permissions:
  contents: read

jobs:
  current-gate-target:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run exact gate regression
        shell: powershell
        run: |
          pytest tests/unit/test_mixed_presentation.py tests/unit/test_current_gate_all_live_control.py tests/unit/test_current_gate_operator_relayout_control.py tests/unit/test_current_gate_viewport_relayout.py tests/unit/test_current_gate_viewport_history.py tests/unit/test_current_gate_viewport_history_control.py tests/unit/test_current_gate_operator_history_control.py tests/unit/test_viewport_dispatch.py tests/unit/test_viewport_geometry.py tests/unit/test_windows_operator_application.py tests/unit/test_windows_operator_control.py tests/unit/test_windows_operator_session.py tests/unit/test_windows_operator_host.py tests/unit/test_windows_operator_runtime.py tests/unit/test_windows_presentation_surface.py tests/unit/test_windows_presentation_target.py tests/unit/test_windows_viewport_layout.py tests/unit/test_windows_viewport_runtime.py tests/integration/test_current_gate_application_windows.py tests/integration/test_current_gate_all_live_application_windows.py tests/integration/test_current_gate_control_windows.py tests/integration/test_current_gate_session_windows.py tests/integration/test_current_gate_operator_host_windows.py tests/integration/test_current_gate_operator_windows.py tests/integration/test_current_gate_target_windows.py tests/integration/test_current_gate_layout_windows.py tests/integration/test_current_gate_runtime_windows.py -q --no-cov
