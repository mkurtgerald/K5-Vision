name: Owner Windows Installer Candidate
on:
  push:
    branches:
      - fix/transactional-alpha-upgrade-20261003
    paths:
      - scripts/windows-alpha/**
      - scripts/provision-stage03-gstreamer.ps1
      - .github/workflows/owner-windows-installer-candidate.yml
      - .github/workflows/installed-analytics-candidate.yml
      - src/k5vision/**
      - scripts/installed_analytics_witness.py
      - scripts/build_owner_analytics_bundle.py
      - scripts/build_analytics_runtime_wheel.py
      - src/k5vision/analytics_config.py
      - src/k5vision/analytics_package.py
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-installer-candidate:
    if: github.repository == 'mkurtgerald/K5-Vision' && github.ref == 'refs/heads/fix/transactional-alpha-upgrade-20261003'
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Compile graphical owner launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build\owner-installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Expected Windows GUI compiler unavailable.' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-alpha\owner-installer\K5VisionAlpha.cs'
          $exe = Join-Path $out 'K5VisionAlpha.exe'
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "/out:$exe" $source
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $exe)) { throw 'Owner GUI compilation failed.' }
          $probe = Start-Process -FilePath $exe -ArgumentList '--self-check' -PassThru -Wait -WindowStyle Hidden -ErrorAction Stop
          if ($probe.ExitCode -ne 3) { throw 'GUI must refuse incomplete runtime.' }

      - name: Acquire pinned upstream CPython 3.12.10 setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe'
          $target = Join-Path $env:GITHUB_WORKSPACE 'build\owner-installer\python-3.12.10-amd64.exe'
          Invoke-WebRequest -Uri $uri -OutFile $target -UseBasicParsing -ErrorAction Stop
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          if ($hash -cne '67B5635E80EA51072B87941312D00EC8927C4DB9BA18938F7AD2D27B328B95FB') { throw 'Pinned Python artifact hash mismatch.' }
          $sig = Get-AuthenticodeSignature -FilePath $target
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw 'Python vendor signature verification failed.' }
          Write-Host 'K5_BUNDLED_PYTHON_IDENTITY=3.12.10/verified'

      - name: Checkout exact Analytics Lab engineering donor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mkurtgerald/Analytics-lab
          ref: c8b347ae538991a0c0ce38eabc2dc17b566531d3
          path: build/owner-analytics-donor
          persist-credentials: false

      - name: Build and verify pinned local analytics payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $donor = Join-Path $env:GITHUB_WORKSPACE 'build/owner-analytics-donor'
          $output = Join-Path $env:GITHUB_WORKSPACE 'build/owner-installer/analytics'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/build_owner_analytics_bundle.py'
          & py -3.12 -I -B $script --analytics-source $donor --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'Pinned analytics payload verification failed.' }
          foreach ($item in @('manifest.json','Analytics-Lab-LICENSE','Analytics-Lab-THIRD_PARTY.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $output $item))) {
              throw 'Verified analytics payload is incomplete.'
            }
          }
          Write-Host 'K5_OWNER_ANALYTICS_BUNDLE=verified_engineering_only'

      - name: Compile double-click setup candidate
        id: compile_setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.7.1 --no-progress --yes --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Inno Setup compiler installation failed.' }
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Pinned Inno compiler missing.' }
          # Chocolatey pins Inno 6.7.1; ISCC /? emits stderr on Windows PowerShell 5.1.
          # Actual setup compilation below checks that the compiler functions.
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-alpha\owner-installer\K5VisionAlpha.iss'
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist\owner-installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $compiler "/DSourceRoot=$env:GITHUB_WORKSPACE" "/DK5Revision=$env:GITHUB_SHA" $script
          if ($LASTEXITCODE -ne 0) { throw 'Inno setup compilation failed.' }
          $exe = Join-Path $out ("K5VisionAlpha-Setup-" + $env:GITHUB_SHA + ".exe")
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Compiled installer missing.' }
          if ((Get-Item -LiteralPath $exe).Length -le 25000000) { throw 'Python payload unexpectedly absent.' }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $out 'SHA256.txt') -Encoding ASCII -Value ("$sha  " + (Split-Path $exe -Leaf))
          Write-Host "K5_INSTALLER_CANDIDATE_SHA256=$sha"
          Write-Host "K5_SOURCE_REVISION=$env:GITHUB_SHA"

      - name: Retain explicitly unqualified candidate
        if: steps.compile_setup.conclusion == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unqualified-owner-installer-${{ github.sha }}
          path: dist/owner-installer/
          if-no-files-found: error
          retention-days: 14

      - name: Qualify clean Windows install launcher and shortcuts
        if: steps.compile_setup.conclusion == 'success'
        shell: powershell
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:GITHUB_WORKSPACE ("dist\owner-installer\K5VisionAlpha-Setup-" + $env:GITHUB_SHA + ".exe")
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait -ErrorAction Stop
          $root = Join-Path $env:LOCALAPPDATA 'K5VisionAlpha'
          $gui = Join-Path $root 'K5VisionAlpha.exe'
          # Output is restricted to fixed code identifiers, never installer log
          # text, stack traces, owner paths, credentials, sources, or media.
          $stageFile = Join-Path $root 'payload\owner-install-stage.txt'
          $allowedStages = @(
            'gstreamer','wheel-build-base','wheel-build-k5',
            'wheel-copy-analytics','wheel-hashes','stage-venv',
            'stage-runtime','stage-preflight','shortcut','verify-wheels',
            'activation-prepare','activation-venv','activation-runtime',
            'activation-preflight','commit','complete'
          )
          $stage = 'no-stage-receipt'
          if (Test-Path -LiteralPath $stageFile -PathType Leaf) {
            $rawStage = [IO.File]::ReadAllText($stageFile, [Text.Encoding]::ASCII).Trim()
            if ($allowedStages -ccontains $rawStage) { $stage = $rawStage }
            else { $stage = 'invalid-stage-receipt' }
          }
          Write-Host "K5_OWNER_TRANSACTION_STAGE=$stage"
          # Source-free inventory: fixed labels and boolean presence only,
          # never owner paths, source URIs, credentials, logs or file contents.
          $requirements = [ordered]@{
            private_python = (Join-Path $root 'python312\python.exe')
            venv_directory = (Join-Path $root '.venv')
            venv_scripts = (Join-Path $root '.venv\Scripts')
            venv_python = (Join-Path $root '.venv\Scripts\python.exe')
            launcher = (Join-Path $root 'Start-K5VisionAlpha.ps1')
            revision = (Join-Path $root 'k5-revision.txt')
            analytics_config = (Join-Path $root 'analytics-config.json')
            model_directory = (Join-Path $root 'analytics-models')
          }
          foreach ($entry in $requirements.GetEnumerator()) {
            Write-Host ('K5_OWNER_COMPONENT_' + $entry.Key + '=' +
              [int][bool](Test-Path -LiteralPath $entry.Value))
          }
          if ($p.ExitCode -ne 0) { throw ('One-click setup install failed: ' + $p.ExitCode) }
          if (-not (Test-Path -LiteralPath $gui)) { throw 'GUI missing after install.' }
          $probe = Start-Process -FilePath $gui -ArgumentList '--self-check' -PassThru -Wait -WindowStyle Hidden -ErrorAction Stop
          if ($probe.ExitCode -ne 0) {
            # Safe opaque component IDs, not paths or any runtime/owner source data.
            $missing = @{
              3 = 'private Python executable'; 4 = 'application virtual environment'
              5 = 'runtime launcher'; 6 = 'source revision receipt'
              7 = 'analytics configuration'; 8 = 'person-detection model asset'
              9 = 'pose-estimation model asset'; 10 = 'GStreamer video runtime'
            }
            $component = $missing[[int]$probe.ExitCode]
            if (-not $component) { $component = 'unrecognized prerequisite failure' }
            throw ("Installed GUI self-check failed: $component (component code $($probe.ExitCode)).")
          }
          $installedPython = Join-Path $root '.venv\Scripts\python.exe'
          $installedConfig = Join-Path $root 'analytics-config.json'
          if (-not (Test-Path -LiteralPath $installedPython) -or -not (Test-Path -LiteralPath $installedConfig)) {
            throw 'Installed owner analytics runtime is incomplete.'
          }
          $oldConfig = $env:K5_ANALYTICS_CONFIG
          try {
            $env:K5_ANALYTICS_CONFIG = $installedConfig
            $analyticsStatus = (& $installedPython -I -B -m k5vision.cli analytics-preflight | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $analyticsStatus -cne '{"schema_version":"1","analytics_enabled":true,"status":"ready"}') {
              throw 'Installed analytics model and package admission failed.'
            }
          } finally {
            if ($null -eq $oldConfig) { Remove-Item Env:K5_ANALYTICS_CONFIG -ErrorAction SilentlyContinue }
            else { $env:K5_ANALYTICS_CONFIG = $oldConfig }
          }
          Write-Host 'K5_OWNER_SETUP_INSTALLED_ANALYTICS_PREFLIGHT=passed'
          if (-not (Test-Path -LiteralPath (Join-Path $root 'unins000.exe'))) { throw 'Windows uninstaller missing.' }
          $programs = Join-Path ([Environment]::GetFolderPath('Programs')) 'K5 Vision Alpha.lnk'
          if (-not (Test-Path -LiteralPath $programs)) { throw 'Start Menu shortcut missing.' }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'K5 Vision Alpha.lnk'
          if (-not (Test-Path -LiteralPath $desktop)) { throw 'Desktop shortcut missing.' }
          Write-Host 'K5_OWNER_SETUP_INSTALL_LAUNCH_SHORTCUT_CHECK=passed'
          # Qualify actual graphical startup through both Windows shortcuts.
          # This is an isolated hosted Windows worker; never touch cameras.
          function Assert-K5ShortcutLaunch([string]$link) {
            if (@(Get-Process -Name K5VisionAlpha -ErrorAction SilentlyContinue).Count -ne 0) {
              throw 'Unexpected pre-existing K5 GUI process.'
            }
            Start-Process -FilePath $link -ErrorAction Stop
            $opened = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              $running = @(Get-Process -Name K5VisionAlpha -ErrorAction SilentlyContinue)
              if ($running.Count -gt 1) { throw 'Duplicate K5 GUI instance.' }
              if ($running.Count -eq 1 -and $running[0].MainWindowTitle -ceq 'K5 Vision Alpha') {
                $opened = $running[0]
                break
              }
            }
            if ($null -eq $opened) { throw 'Shortcut did not open the graphical K5 launcher.' }
            if (-not $opened.CloseMainWindow() -or -not $opened.WaitForExit(10000)) {
              throw 'K5 GUI could not be closed normally before reinstall.'
            }
          }
          $revisionFile = Join-Path $root 'k5-revision.txt'
          if (-not (Test-Path -LiteralPath $revisionFile)) { throw 'Installed revision receipt missing.' }
          if ((Get-Content -LiteralPath $revisionFile -Raw).Trim() -cne $env:GITHUB_SHA) {
            throw 'Installed runtime revision is not the setup source revision.'
          }
          foreach ($shortcut in @($desktop, $programs)) { Assert-K5ShortcutLaunch $shortcut }
          Write-Host 'K5_OWNER_SETUP_FIRST_GUI_LAUNCH_CHECK=passed'

          # Same-package in-place reinstall is a separate required acceptance gate.
          # It is not evidence of a different-revision upgrade or rollback.
          $reinstalled = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait -ErrorAction Stop
          if ($reinstalled.ExitCode -ne 0) { throw ('In-place reinstall failed: ' + $reinstalled.ExitCode) }
          $reprobe = Start-Process -FilePath $gui -ArgumentList '--self-check' -PassThru -Wait -WindowStyle Hidden -ErrorAction Stop
          if ($reprobe.ExitCode -ne 0) { throw ('GUI runtime self-check failed after reinstall (component code ' + $reprobe.ExitCode + ').') }
          if ((Get-Content -LiteralPath $revisionFile -Raw).Trim() -cne $env:GITHUB_SHA) {
            throw 'Reinstalled runtime revision mismatch.'
          }
          foreach ($shortcut in @($desktop, $programs)) {
            if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Shortcut missing after reinstall.' }
            Assert-K5ShortcutLaunch $shortcut
          }
          Write-Host 'K5_OWNER_SETUP_REINSTALL_CHECK=passed'

          # Exercise the actual Windows uninstaller after all installed gates.
          $uninstaller = Join-Path $root 'unins000.exe'
          $removed = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait -ErrorAction Stop
          if ($removed.ExitCode -ne 0) { throw ('Windows uninstall failed: ' + $removed.ExitCode) }
          foreach ($ownedPath in @($gui,(Join-Path $root 'python312\python.exe'),(Join-Path $root '.venv\Scripts\python.exe'),$programs,$desktop)) {
            if (Test-Path -LiteralPath $ownedPath) { throw 'Owned K5 runtime or launch shortcut survived uninstall.' }
          }
          Write-Host 'K5_OWNER_SETUP_UNINSTALL_CHECK=passed'
