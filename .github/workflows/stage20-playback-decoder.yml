name: Stage 20 Playback Decoder Qualification

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed commit selected for this qualification
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage20-playback-decoder:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.reviewed_sha == github.sha
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 25
    env:
      K5_STAGE20_PHYSICAL: "1"
      K5_STAGE20_OUTPUT: ${{ github.workspace }}\artifacts\stage20-playback-decoder.json
      K5_STAGE20_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout exact Stage 20 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provision isolated reviewed GStreamer runtime
        shell: powershell
        run: .\scripts\provision-stage03-gstreamer.ps1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify private physical configuration
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Required Stage 20 physical source configuration is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CAM_CRED)) {
            throw "Required Stage 20 physical credential configuration is missing."
          }

      - name: Resolve private camera credential candidate
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          $index = & python -m k5vision.stage03_credential_probe $env:K5_STAGE03_SOURCE
          if ($LASTEXITCODE -ne 0 -or $index -notmatch '^\d+$') {
            throw "No supplied camera credential candidate authenticated the Stage 20 source."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "K5_STAGE03_CREDENTIAL_INDEX=$index"

      - name: Re-qualify exact Stage 18 decoder runtime surface
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $surfaceOutput = Join-Path $env:RUNNER_TEMP "k5-stage20-runtime-surface.json"
          $args = @(
            "-m", "k5vision.media.decoder_runtime",
            "--revision", $env:K5_STAGE20_REVISION,
            "--output", $surfaceOutput
          )
          if (-not [string]::IsNullOrWhiteSpace($env:K5_GSTREAMER_INSTALLER_SHA256)) {
            $args += @("--installer-sha256", $env:K5_GSTREAMER_INSTALLER_SHA256)
          }
          & python @args
          if ($LASTEXITCODE -ne 0) {
            throw "Stage 20 could not reproduce the accepted Stage 18 decoder surface."
          }
          Remove-Item -LiteralPath $surfaceOutput -Force -ErrorAction SilentlyContinue

      - name: Re-qualify exact Stage 19 native ABI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $abiOutput = Join-Path $env:RUNNER_TEMP "k5-stage20-native-abi.json"
          python -m k5vision.media.gstreamer_native_abi `
            --revision $env:K5_STAGE20_REVISION `
            --runtime-root $env:K5_GSTREAMER_ROOT `
            --output $abiOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Stage 20 could not reproduce the accepted Stage 19 native ABI."
          }
          Remove-Item -LiteralPath $abiOutput -Force -ErrorAction SilentlyContinue

      - name: Run ephemeral RTP-to-frame qualification
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: pytest tests/integration/test_stage20_physical.py -q --no-cov

      - name: Assert retained decoder evidence is source-free
        id: safe_evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:K5_STAGE20_OUTPUT)) {
            throw "Stage 20 evidence was not produced."
          }
          $text = Get-Content -LiteralPath $env:K5_STAGE20_OUTPUT -Raw
          foreach ($pattern in @(
            'rtsp://',
            '(?i)username',
            '(?i)password',
            '(?i)credential',
            '(?i)runner[_ -]?name',
            '[A-Za-z]:\\',
            '\\Users\\',
            '(?<![0-9])(?:10\.|127\.|169\.254\.|192\.168\.)'
          )) {
            if ($text -match $pattern) {
              throw "Stage 20 retained evidence violated the source-free contract."
            }
          }

      - name: Upload source-free Stage 20 evidence
        if: always() && steps.safe_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage20-playback-decoder-evidence
          path: artifacts/stage20-playback-decoder.json
          if-no-files-found: warn
          retention-days: 14
