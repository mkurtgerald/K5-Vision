name: Native Windows Operator Product

on:
  workflow_dispatch:
  pull_request:
    branches: [main, codex/windows-mediamtx-donor]
    paths:
      - .github/workflows/operator-product-windows.yml
      - src/k5vision/operator_product*.py
      - src/k5vision/operator_media_gateway.py
      - src/k5vision/operator_native_process.py
      - src/k5vision/operator_profile_lock.py
      - src/k5vision/operator_recording_storage.py
      - src/k5vision/operator_web/**
      - src/k5vision/identity_state.py
      - src/k5vision/windows_identity_security.py
      - src/k5vision/auth_sessions.py
      - src/k5vision/user_admin_api.py
      - src/k5vision/services/user_registry.py
      - src/k5vision/services/device_registry.py
      - src/k5vision/main.py
      - scripts/Start-K5Operator.ps1
      - docs/WINDOWS_OPERATOR_PILOT.md
      - tests/unit/test_operator_*.py
      - tests/integration/test_operator_product_runtime.py
      - tests/integration/test_operator_windows_launcher.py
      - src/k5vision/data/caddy-donor-manifest.json
      - src/k5vision/media/mediamtx_provider.py
      - src/k5vision/media/mediamtx_config.py
      - src/k5vision/data/mediamtx-donor-manifest.json
      - src/k5vision/data/mediamtx-donor-test-tools.json
      - tests/unit/test_mediamtx_provider.py
      - tests/integration/test_mediamtx_donor_runtime.py
      - pyproject.toml

permissions:
  contents: read

jobs:
  native-operator-product:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Project development installation failed" }

      - name: Verify and provision pinned native development tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mediaManifest = Get-Content -LiteralPath src/k5vision/data/mediamtx-donor-manifest.json -Raw | ConvertFrom-Json
          $mediaArtifacts = @($mediaManifest.artifacts | Where-Object { $_.platform -eq "windows_amd64" })
          if ($mediaArtifacts.Count -ne 1) { throw "Expected one pinned native Windows MediaMTX archive" }
          $mediaArtifact = $mediaArtifacts[0]
          $caddyManifest = Get-Content -LiteralPath src/k5vision/data/caddy-donor-manifest.json -Raw | ConvertFrom-Json
          $caddyArtifacts = @($caddyManifest.artifacts | Where-Object { $_.platform -eq "windows_amd64" })
          if ($caddyArtifacts.Count -ne 1) { throw "Expected one pinned native Windows Caddy archive" }
          $caddyArtifact = $caddyArtifacts[0]
          $testTools = Get-Content -LiteralPath src/k5vision/data/mediamtx-donor-test-tools.json -Raw | ConvertFrom-Json
          foreach ($field in @("url", "sha256", "version", "license", "source")) {
            if ([string]::IsNullOrWhiteSpace([string]$testTools.$field)) {
              throw "Development tool manifest is incomplete"
            }
          }
          $toolRoot = Join-Path $env:RUNNER_TEMP ("K5 donor development tools " + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          "K5_DONOR_TOOL_ROOT=$toolRoot" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

          function Get-VerifiedArchive {
            param([string]$Url, [string]$ExpectedHash, [string]$Archive, [string]$Destination)
            if ($Url -notmatch '^https://[^\s]+$' -or $ExpectedHash -notmatch '^[a-fA-F0-9]{64}$') {
              throw "Native tool archive identity is invalid"
            }
            Invoke-WebRequest -Uri $Url -OutFile $Archive -TimeoutSec 180
            $actualHash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash
            if (-not [string]::Equals($actualHash, $ExpectedHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Native tool archive SHA256 mismatch"
            }
            Expand-Archive -LiteralPath $Archive -DestinationPath $Destination
          }

          $mediaDirectory = Join-Path $toolRoot "MediaMTX"
          $caddyDirectory = Join-Path $toolRoot "Caddy"
          $ffmpegDirectory = Join-Path $toolRoot "FFmpeg development only"
          Get-VerifiedArchive -Url $mediaArtifact.url -ExpectedHash $mediaArtifact.sha256 -Archive (Join-Path $toolRoot "mediamtx.zip") -Destination $mediaDirectory
          Get-VerifiedArchive -Url $caddyArtifact.url -ExpectedHash $caddyArtifact.sha256 -Archive (Join-Path $toolRoot "caddy.zip") -Destination $caddyDirectory
          Get-VerifiedArchive -Url $testTools.url -ExpectedHash $testTools.sha256 -Archive (Join-Path $toolRoot "ffmpeg.zip") -Destination $ffmpegDirectory

          function Get-SingleExecutable {
            param([string]$Directory, [string]$Name)
            $executables = @(Get-ChildItem -LiteralPath $Directory -Filter $Name -File -Recurse)
            if ($executables.Count -ne 1) { throw "Expected exactly one supplied native executable" }
            return $executables[0].FullName
          }
          $mediaExe = Get-SingleExecutable -Directory $mediaDirectory -Name "mediamtx.exe"
          $caddyExe = Get-SingleExecutable -Directory $caddyDirectory -Name "caddy.exe"
          foreach ($entry in @(@{Path=$mediaExe; Artifact=$mediaArtifact}, @{Path=$caddyExe; Artifact=$caddyArtifact})) {
            $file = Get-Item -LiteralPath $entry.Path
            $digest = (Get-FileHash -LiteralPath $entry.Path -Algorithm SHA256).Hash
            if ($file.Length -ne $entry.Artifact.executable_bytes -or
                -not [string]::Equals($digest, $entry.Artifact.executable_sha256, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Native executable content identity does not match its archive manifest"
            }
          }
          $ffmpegExe = Get-SingleExecutable -Directory $ffmpegDirectory -Name "ffmpeg.exe"
          $ffprobeExe = Get-SingleExecutable -Directory $ffmpegDirectory -Name "ffprobe.exe"

          # Only verified archives have been extracted; execute nothing from an
          # archive until its immutable SHA256 identity has been admitted.
          $mediaVersion = @(& $mediaExe --version)
          if ($LASTEXITCODE -ne 0 -or $mediaVersion.Count -ne 1 -or $mediaVersion[0].Trim() -ne $mediaManifest.version) {
            throw "Native MediaMTX version does not match its manifest"
          }
          $caddyVersion = @(& $caddyExe version)
          if ($LASTEXITCODE -ne 0 -or $caddyVersion.Count -eq 0 -or
              $caddyVersion[0].Split(" ")[0] -ne $caddyManifest.version) {
            throw "Native Caddy version does not match its manifest"
          }
          $ffmpegVersion = @(& $ffmpegExe -version)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion.Count -eq 0) { throw "FFmpeg development provenance failed" }
          $ffprobeVersion = @(& $ffprobeExe -version)
          if ($LASTEXITCODE -ne 0 -or $ffprobeVersion.Count -eq 0) { throw "ffprobe development provenance failed" }
          $expectedVersion = [regex]::Escape([string]$testTools.version)
          if ($ffmpegVersion[0] -notmatch "^ffmpeg version n?$expectedVersion(?:[-\s]|$)" -or
              $ffprobeVersion[0] -notmatch "^ffprobe version n?$expectedVersion(?:[-\s]|$)") {
            throw "FFmpeg development tool version does not match its manifest"
          }
          $buildConfiguration = @(& $ffmpegExe -buildconf 2>&1 | ForEach-Object { $_.ToString() }) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg development build provenance failed" }
          foreach ($flag in @("--enable-libx264", "--enable-gpl", "--enable-version3")) {
            if (-not $buildConfiguration.Contains($flag)) { throw "FFmpeg development build is missing an admitted feature" }
          }
          if ($buildConfiguration.Contains("--enable-nonfree")) { throw "Nonfree FFmpeg development build is not admitted" }
          Write-Host "MediaMTX native Windows: $($mediaVersion[0])"
          Write-Host "Caddy native Windows: $($caddyVersion[0])"
          Write-Host "FFmpeg development tool: $($ffmpegVersion[0])"
          Write-Host "ffprobe development tool: $($ffprobeVersion[0])"
          Write-Host "FFmpeg development build verified: libx264, GPL, version3; nonfree disabled"
          Write-Host "Development tool license: $($testTools.license)"
          Write-Host "Development tool source: $($testTools.source)"
          "K5_MEDIAMTX_DONOR_EXE=$mediaExe" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "K5_CADDY_DONOR_EXE=$caddyExe" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "K5_DONOR_FFMPEG=$ffmpegExe" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "K5_DONOR_FFPROBE=$ffprobeExe" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Build project wheel for native launcher acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheelDirectory = Join-Path $env:GITHUB_WORKSPACE "operator-pilot-wheel"
          if (Test-Path -LiteralPath $wheelDirectory) { throw "Pilot wheel directory already exists" }
          New-Item -ItemType Directory -Path $wheelDirectory | Out-Null
          python -m pip wheel . --no-deps --wheel-dir $wheelDirectory
          if ($LASTEXITCODE -ne 0) { throw "Pilot wheel build failed" }
          $wheels = @(Get-ChildItem -LiteralPath $wheelDirectory -Filter "*.whl" -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one project pilot wheel" }
          "K5_OPERATOR_WHEEL=$($wheels[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Run real native PowerShell launcher acceptance
        id: launcher_acceptance
        timeout-minutes: 4
        shell: pwsh
        run: |
          python -m pytest tests/integration/test_operator_windows_launcher.py --no-cov -s -o faulthandler_timeout=120 --junitxml=operator-launcher-native-windows.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native launcher acceptance receipt
        id: launcher_qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$report = Get-Content -LiteralPath operator-launcher-native-windows.xml -Raw
          $properties = @($report.SelectNodes("//property[@name='operator_windows_launcher_receipt']"))
          $cases = @($report.SelectNodes("//testcase[@name='test_native_windows_powershell_launcher_installs_wheel_and_authenticates']"))
          if ($properties.Count -ne 1 -or $cases.Count -ne 1 -or $cases[0].SelectSingleNode("skipped") -ne $null) {
            throw "Native launcher acceptance did not execute and produce its receipt"
          }
          $receipt = $properties[0].GetAttribute("value") | ConvertFrom-Json
          if ($receipt.schema_version -ne "1" -or $receipt.platform -ne "Windows" -or
              $receipt.native_windows_execution -ne $true -or $receipt.powershell_version -notlike "5.1*" -or
              $receipt.preprovisioned_identity -ne $true -or $receipt.verified_cached_workers -ne $true -or
              $receipt.wheel_install -ne $true -or $receipt.isolated_wheel_import -ne $true -or
              $receipt.health -ne $true -or $receipt.administrator_login -ne $true -or
              $receipt.worker_ready -ne $true -or $receipt.owned_tree_cleanup -ne $true) {
            throw "Native Windows PowerShell launcher receipt is incomplete"
          }
          Write-Host "Native Windows PowerShell 5.1 launcher installed the wheel, started verified workers, authenticated and cleaned up"
          "Native PowerShell 5.1 launcher and installed-wheel acceptance passed." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Run product regressions, Windows Job ownership and assembled acceptance
        timeout-minutes: 6
        shell: pwsh
        run: |
          python -m pytest tests/unit/test_mediamtx_provider.py tests/unit/test_operator_media_gateway.py tests/unit/test_operator_product_state.py tests/unit/test_operator_product_api.py tests/unit/test_operator_product_service.py tests/unit/test_operator_recording_storage.py tests/unit/test_operator_native_process.py tests/unit/test_operator_profile_lock.py tests/integration/test_operator_product_runtime.py --no-cov -s -o faulthandler_timeout=120 --junitxml=operator-product-native-windows.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify assembled native Windows product receipt
        id: qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$report = Get-Content -LiteralPath operator-product-native-windows.xml -Raw
          $properties = @($report.SelectNodes("//property[@name='operator_product_runtime_receipt']"))
          $cases = @($report.SelectNodes("//testcase[@name='test_assembled_operator_product_login_live_recording_logout_and_restart']"))
          if ($properties.Count -ne 1 -or $cases.Count -ne 1 -or $cases[0].SelectSingleNode("skipped") -ne $null) {
            throw "Assembled product acceptance did not execute and produce its receipt"
          }
          $receipt = $properties[0].GetAttribute("value") | ConvertFrom-Json
          if ($receipt.platform -ne "Windows" -or $receipt.native_windows_execution -ne $true -or
              $receipt.portable_ancestor_adjustment -ne $false -or $receipt.whole_product_restart_preserved -ne $true -or
              $receipt.logout_revoked_cached_media -ne $true -or $receipt.session_invalid_after_restart -ne $true -or
              $receipt.live_hls_media_received -ne $true -or $receipt.source_reconnected -ne $true -or
              $receipt.playback_decoded_frames -le 0 -or $receipt.recording_spans -lt 3) {
            throw "Native Windows assembled product receipt is incomplete"
          }
          Write-Host "Native Windows assembled product: login, camera enrollment, live HLS, recording and decoded playback passed"
          Write-Host "Logout invalidated cached media; whole-product restart retained identity, camera and recording history"
          @(
            "Native Windows assembled operator product acceptance passed.",
            "",
            "Generated stream, actual K5 API, Caddy gateway and MediaMTX recorder were exercised together.",
            "",
            "Recording spans: $($receipt.recording_spans); decoded export frames: $($receipt.playback_decoded_frames).",
            "",
            "Browser decoding, real cameras and analytics acceptance require their own witnesses."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Remove owned native development tool downloads
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrEmpty($env:K5_DONOR_TOOL_ROOT)) { exit 0 }
          $toolRoot = [IO.Path]::GetFullPath($env:K5_DONOR_TOOL_ROOT)
          $expectedParent = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $actualParent = [IO.Directory]::GetParent($toolRoot).FullName
          if (-not [string]::Equals($actualParent, $expectedParent, [StringComparison]::OrdinalIgnoreCase) -or
              [IO.Path]::GetFileName($toolRoot) -notmatch '^K5 donor development tools [a-f0-9]{32}$') {
            throw "Native tool cleanup path is outside its owned temporary directory"
          }
          if (Test-Path -LiteralPath $toolRoot) {
            Remove-Item -LiteralPath $toolRoot -Recurse -Force
          }

      - name: Build runnable Windows pilot package
        if: success() && steps.qualification.outcome == 'success' && steps.launcher_qualification.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pilotRoot = Join-Path $env:GITHUB_WORKSPACE "windows-operator-pilot"
          if (Test-Path -LiteralPath $pilotRoot) { throw "Pilot package directory already exists" }
          $wheelDirectory = Join-Path $pilotRoot "dist"
          New-Item -ItemType Directory -Path $wheelDirectory | Out-Null
          if ([string]::IsNullOrEmpty($env:K5_OPERATOR_WHEEL)) { throw "Qualified project wheel is missing" }
          Copy-Item -LiteralPath $env:K5_OPERATOR_WHEEL -Destination $wheelDirectory
          $wheels = @(Get-ChildItem -LiteralPath $wheelDirectory -Filter "*.whl" -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one project pilot wheel" }
          $files = @(
            @{Source="scripts/Start-K5Operator.ps1"; Destination="scripts/Start-K5Operator.ps1"},
            @{Source="src/k5vision/windows_identity_security.py"; Destination="src/k5vision/windows_identity_security.py"},
            @{Source="docs/WINDOWS_OPERATOR_PILOT.md"; Destination="README.md"},
            @{Source="LICENSE"; Destination="LICENSE"},
            @{Source="THIRD_PARTY_NOTICES.md"; Destination="THIRD_PARTY_NOTICES.md"},
            @{Source="third_party/licenses/MediaMTX-MIT.txt"; Destination="third_party/licenses/MediaMTX-MIT.txt"},
            @{Source="third_party/licenses/Caddy-Apache-2.0.txt"; Destination="third_party/licenses/Caddy-Apache-2.0.txt"}
          )
          foreach ($entry in $files) {
            $source = Join-Path $env:GITHUB_WORKSPACE $entry.Source
            $destination = Join-Path $pilotRoot $entry.Destination
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination
          }
          $allowed = @($wheels[0].FullName) + @($files | ForEach-Object { Join-Path $pilotRoot $_.Destination })
          foreach ($file in @(Get-ChildItem -LiteralPath $pilotRoot -File -Recurse)) {
            if ($file.FullName -notin $allowed) { throw "Pilot package contains an unexpected file" }
          }
          if (@(Get-ChildItem -LiteralPath $pilotRoot -File -Recurse).Count -ne $allowed.Count) {
            throw "Pilot package is incomplete"
          }
          Write-Host "Windows pilot package contains the project wheel, launcher, identity helper and required notices"

      - name: Upload qualified runnable Windows pilot
        if: success() && steps.qualification.outcome == 'success' && steps.launcher_qualification.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: k5-operator-windows-pilot-${{ github.sha }}
          path: windows-operator-pilot/
          if-no-files-found: error
          retention-days: 7

      - name: Upload JUnit evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operator-product-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            operator-product-native-windows.xml
            operator-launcher-native-windows.xml
          if-no-files-found: warn
          retention-days: 7
