name: Stage 03 Runtime Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage03-runtime-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 5
    steps:
      - name: Inventory candidate executables and GStreamer metadata
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $names = @("ffmpeg", "ffprobe", "gst-launch-1.0", "gst-inspect-1.0", "vlc", "mpv")
          $results = @()

          foreach ($name in $names) {
            $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $command) {
              $results += [pscustomobject]@{
                candidate = $name
                present = $false
                version = $null
              }
              continue
            }

            $version = $null
            if ($command.CommandType -eq "Application" -and -not [string]::IsNullOrWhiteSpace($command.Source)) {
              try {
                $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($command.Source).ProductVersion
              } catch {
                $version = $null
              }
            }
            if ([string]::IsNullOrWhiteSpace([string]$version) -and $name -eq "gst-launch-1.0") {
              try {
                $versionLine = & $command.Source --version 2>$null | Select-Object -First 1
                if (-not [string]::IsNullOrWhiteSpace([string]$versionLine)) {
                  $version = [string]$versionLine
                }
              } catch {
                $version = $null
              }
            }

            $results += [pscustomobject]@{
              candidate = $name
              present = $true
              version = $version
            }
          }

          $pluginResults = @()
          $gstInspect = Get-Command "gst-inspect-1.0" -ErrorAction SilentlyContinue | Select-Object -First 1
          $pluginNames = @("rtspsrc", "queue", "identity", "fakesink")
          foreach ($pluginName in $pluginNames) {
            $present = $false
            $pluginVersion = $null
            $license = $null
            $sourceModule = $null
            $origin = $null

            if ($null -ne $gstInspect) {
              $inspectOutput = @(& $gstInspect.Source $pluginName 2>$null)
              $present = ($LASTEXITCODE -eq 0)
              if ($present) {
                foreach ($line in $inspectOutput) {
                  if ($line -match '^\s*Version\s+(.+?)\s*$' -and [string]::IsNullOrWhiteSpace([string]$pluginVersion)) {
                    $pluginVersion = $Matches[1].Trim()
                  } elseif ($line -match '^\s*License\s+(.+?)\s*$' -and [string]::IsNullOrWhiteSpace([string]$license)) {
                    $license = $Matches[1].Trim()
                  } elseif ($line -match '^\s*Source module\s+(.+?)\s*$' -and [string]::IsNullOrWhiteSpace([string]$sourceModule)) {
                    $sourceModule = $Matches[1].Trim()
                  } elseif ($line -match '^\s*Origin URL\s+(.+?)\s*$' -and [string]::IsNullOrWhiteSpace([string]$origin)) {
                    $origin = $Matches[1].Trim()
                  }
                }
              }
            }

            $pluginResults += [pscustomobject]@{
              plugin = $pluginName
              present = $present
              version = $pluginVersion
              license = $license
              source_module = $sourceModule
              origin = $origin
            }
          }

          $registryPackages = @()
          $roots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          foreach ($root in $roots) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "GStreamer 1.0*" } |
              ForEach-Object {
                $registryPackages += [pscustomobject]@{
                  name = [string]$_.DisplayName
                  version = [string]$_.DisplayVersion
                  publisher = [string]$_.Publisher
                }
              }
          }
          $registryPackages = @($registryPackages | Sort-Object name, version -Unique)

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          [pscustomobject]@{
            executables = $results
            gstreamer_plugins = $pluginResults
            gstreamer_packages = $registryPackages
          } | ConvertTo-Json -Depth 5 | Set-Content -Path artifacts/stage03-runtime-inventory.json -Encoding UTF8

          $presentExecutables = @($results | Where-Object { $_.present } | ForEach-Object { $_.candidate })
          if ($presentExecutables.Count -eq 0) {
            Write-Host "No known Stage 03 runtime executables were detected on the physical runner."
          } else {
            Write-Host ("Detected Stage 03 runtime executable names: " + ($presentExecutables -join ", "))
          }

          $presentPlugins = @($pluginResults | Where-Object { $_.present } | ForEach-Object { $_.plugin })
          if ($presentPlugins.Count -gt 0) {
            Write-Host ("Detected required GStreamer plugin names: " + ($presentPlugins -join ", "))
          }

      - name: Upload sanitized runtime inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage03-runtime-inventory
          path: artifacts/stage03-runtime-inventory.json
          if-no-files-found: error
          retention-days: 2
