name: Diagnostic only - exact Windows installer timing

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-install-profile-20261122]
    paths:
      - .github/workflows/windows-install-profile.yml
      - scripts/profile_windows_installer.py

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-install-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: DIAGNOSTIC ONLY - exact 7cc installation stages
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout immutable product and native ownership helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 7cc4e227fca152ebd04c5a7eae728e02fd4143aa
          path: product-source
          persist-credentials: false
      - name: Checkout the separate diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - name: Admit the exact unqualified producer and retained artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          $meta = Invoke-RestMethod -Uri "$api/artifacts/14740417355" -Headers $headers
          $attempt = Invoke-RestMethod -Uri "$api/runs/44987532116/attempts/1" -Headers $headers
          $jobs = Invoke-RestMethod -Uri "$api/runs/44987532116/attempts/1/jobs?per_page=100" -Headers $headers
          $producer = @($jobs.jobs | Where-Object { $_.id -eq 137101275650 })
          if ($meta.id -ne 14740417355 -or $meta.expired -ne $false -or
              $meta.name -ne 'k5-vision-windows-upgrade-candidate-7cc4e227fca152ebd04c5a7eae728e02fd4143aa-44987532116-attempt-1' -or
              $meta.digest -ne 'sha256:d8e80958809d3e56cb9e2d29ff467e63b5f43a1bdc38f82a5ee669fa97639bae' -or
              $meta.size_in_bytes -ne 285141695 -or $meta.workflow_run.id -ne 44987532116 -or
              $meta.workflow_run.head_sha -ne '7cc4e227fca152ebd04c5a7eae728e02fd4143aa' -or
              $attempt.id -ne 44987532116 -or $attempt.run_attempt -ne 1 -or
              $attempt.head_sha -ne '7cc4e227fca152ebd04c5a7eae728e02fd4143aa' -or $producer.Count -ne 1) {
            throw 'Exact diagnostic installer provenance was refused'
          }
          # This producer's later GUI journey FAILED its unchanged total deadline.
          # Admit only its successful build/upload steps, never qualification.
          foreach ($name in @('Build click-through native Windows installer', 'Stage byte-admitted unqualified candidate for independent upgrade testing', 'Upload non-release candidate for independent upgrade and reversal qualification')) {
            $step = @($producer[0].steps | Where-Object { $_.name -eq $name })
            if ($step.Count -ne 1 -or $step[0].conclusion -ne 'success') { throw 'Exact candidate build/upload did not succeed' }
          }
      - name: Download the original immutable candidate by artifact ID
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 14740417355
          github-token: ${{ github.token }}
          run-id: 44987532116
          path: profile-input
          merge-multiple: true
      - name: Bind original installer bytes and exact diagnostic Git blob
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git -C product-source rev-parse HEAD).Trim() -ne '7cc4e227fca152ebd04c5a7eae728e02fd4143aa' -or
              (& git -C diagnostic-source rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'Source identity mismatch' }
          & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c 'git -C diagnostic-source cat-file blob HEAD:scripts/profile_windows_installer.py > installer-profile-admitted.py'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath installer-profile-admitted.py -Algorithm SHA256).Hash.ToLowerInvariant() -ne '830558ec46dde5b7b0877335f4bac09aa8aff4a8d1340ec9f9f777abafbec878') { throw 'Diagnostic controller byte identity mismatch' }
          $setup = Get-Item -LiteralPath profile-input/K5VisionSetup.exe
          $package = Get-Content -LiteralPath profile-input/desktop-package.json -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath profile-input/payload-manifest.json -Raw | ConvertFrom-Json
          if ($setup.Length -ne 286579963 -or
              (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '427c8faa7e8aa647dbff5746f7620f9b0c3738c911ca58edd06bfebbccefa37b' -or
              (Get-FileHash -LiteralPath profile-input/desktop-package.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a9f1cd15527db95e5ff79b5a764d5619516f15e64b05e3cadbc639288fb9db24' -or
              (Get-FileHash -LiteralPath profile-input/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a564b6b038da136a5378180e9e8d1164050c4a01eee010e9a5de884325c7e959' -or
              $package.head_sha -ne '7cc4e227fca152ebd04c5a7eae728e02fd4143aa' -or $manifest.head_sha -ne $package.head_sha -or
              $package.setup_bytes -ne $setup.Length -or $package.setup_sha256 -ne '427c8faa7e8aa647dbff5746f7620f9b0c3738c911ca58edd06bfebbccefa37b' -or
              $package.launcher_sha256 -ne '90d38c54c0af0c3307db56bf62e74d22be2d73468ce8c24314b0cb934cf46111' -or
              $package.qualification_status -ne 'unqualified' -or $package.run_id -ne 44987532116 -or $package.run_attempt -ne 1) { throw 'Exact unqualified candidate byte identity mismatch' }
      - name: Set up controller Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install only the pinned process observer dependency
        shell: pwsh
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependency installation failed' }
      - name: Measure unchanged silent installation, graceful stop, reinstall and uninstall
        shell: pwsh
        env:
          K5_INSTALL_PROFILE_HARNESS_SHA: ${{ github.sha }}
        run: |
          python installer-profile-admitted.py --input profile-input --source product-source --output installer-profile.json
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic installer profiling failed; inspect finite evidence' }
      - name: Retain finite diagnostic observations only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-only-windows-installer-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: installer-profile.json
          if-no-files-found: warn
          retention-days: 14
