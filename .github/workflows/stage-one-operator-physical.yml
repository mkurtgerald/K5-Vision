name: Stage One Authenticated Operator Physical Witness

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stage-one-operator-physical
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stage-one-operator-physical:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 35
    env:
      ANALYTICS_LAB_SHA: c8b347ae538991a0c0ce38eabc2dc17b566531d3
      K5_STAGE_ONE_OPERATOR_PHYSICAL: "1"
      K5_STAGE_ONE_OUTPUT: artifacts\stage-one-operator-physical.json
      K5_STAGE_ONE_REVISION: ${{ github.sha }}

    steps:
      - name: Verify exact reviewed branch head
        shell: powershell
        env:
          K5_REVIEWED_BRANCH: main
          K5_REVIEWED_SHA: ${{ github.sha }}
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_REVIEWED_BRANCH)) {
            throw "Reviewed branch is required."
          }
          if ($env:K5_REVIEWED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Reviewed SHA must be an exact 40-character commit SHA."
          }
          # GitHub expression string comparisons are case-insensitive, while the
          # branches REST route is case-sensitive. Canonicalize the already-gated
          # main input before the API lookup so an accepted case variant cannot
          # fail before exact-head verification.
          $reviewedBranch = $env:K5_REVIEWED_BRANCH.ToLowerInvariant()
          if ($reviewedBranch -ne "main") {
            throw "Reviewed branch must be main."
          }
          $encodedBranch = [uri]::EscapeDataString($reviewedBranch)
          $headers = @{
            Authorization = "Bearer $env:K5_GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/$encodedBranch"
          $branch = Invoke-RestMethod -Method Get -Headers $headers -Uri $uri
          if ($branch.commit.sha -ne $env:K5_REVIEWED_SHA) {
            throw "Reviewed SHA is not the current head of the reviewed branch."
          }

      - name: Checkout exact Stage One revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact reviewed Analytics-lab revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mkurtgerald/Analytics-lab
          ref: ${{ env.ANALYTICS_LAB_SHA }}
          path: analytics-lab
          persist-credentials: false

      - name: Bind reviewed Analytics-lab revision
        shell: powershell
        env:
          K5_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ANALYTICS_LAB_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Analytics-lab revision must be an exact 40-character commit SHA."
          }
          $headers = @{
            Authorization = "Bearer $env:K5_GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/mkurtgerald/Analytics-lab/commits/$env:ANALYTICS_LAB_SHA"
          $commit = Invoke-RestMethod -Method Get -Headers $headers -Uri $uri
          if ($commit.sha.ToLowerInvariant() -ne $env:ANALYTICS_LAB_SHA.ToLowerInvariant()) {
            throw "Analytics-lab exact revision verification failed."
          }
          $analytics = Join-Path $env:GITHUB_WORKSPACE "analytics-lab"
          if (-not (Test-Path -LiteralPath $analytics)) {
            throw "Analytics-lab checkout path is unavailable."
          }
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "analytics-validation"
          "PYTHONPATH=$analytics" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "K5_ANALYTICS_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision isolated reviewed GStreamer runtime
        shell: powershell
        run: .\scripts\provision-stage03-gstreamer.ps1

      - name: Verify private physical configuration
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Required Stage One physical source configuration is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CAM_CRED)) {
            throw "Required Stage One physical credential configuration is missing."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install K5 and pinned detector evidence runtimes
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install --no-cache-dir "openvino==2026.3.1" "opencv-python-headless==4.12.0.88"

      - name: Prepare bounded rights-reviewed detector evidence
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m analytics_lab.validation_seed --output-dir "$env:K5_ANALYTICS_EVIDENCE_ROOT"

      - name: Run authenticated physical operator witness
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: pytest tests/integration/test_stage_one_operator_physical.py -q --no-cov --tb=no --show-capture=no

      - name: Assert retained witness is source-free
        id: safe_evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:K5_STAGE_ONE_OUTPUT)) {
            throw "Stage One authenticated operator witness was not produced."
          }
          $text = Get-Content -LiteralPath $env:K5_STAGE_ONE_OUTPUT -Raw
          foreach ($pattern in @(
            'rtsp://',
            'rtsps://',
            '(?i)username',
            '(?i)password',
            '(?i)credential',
            '(?i)session_token',
            '(?i)device_id',
            '(?i)source_uri',
            '(?i)runner[_ -]?name',
            '[A-Za-z]:\\',
            '\\Users\\',
            '(?<![0-9])(?:10\.|127\.|169\.254\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.)'
          )) {
            if ($text -match $pattern) {
              throw "Stage One retained witness violated the source-free contract."
            }
          }

      - name: Upload source-free Stage One witness
        if: success() && steps.safe_evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage-one-operator-physical-witness
          path: artifacts/stage-one-operator-physical.json
          if-no-files-found: error
          retention-days: 14
