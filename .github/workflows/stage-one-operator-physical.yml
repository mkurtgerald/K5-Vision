name: Stage One Authenticated Operator Physical Witness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/stage-one-operator-physical.yml
      - scripts/provision-stage03-gstreamer.ps1
      - src/k5vision/auth_sessions.py
      - src/k5vision/domain/devices.py
      - src/k5vision/domain/users.py
      - src/k5vision/main.py
      - src/k5vision/operator_launch.py
      - src/k5vision/operator_launch_api.py
      - src/k5vision/operator_runtime.py
      - src/k5vision/stage_one_app.py
      - src/k5vision/stage03_credentials.py
      - src/k5vision/stage03_credential_probe.py
      - src/k5vision/services/device_registry.py
      - src/k5vision/services/user_registry.py
      - src/k5vision/user_admin_api.py
      - src/k5vision/media/**
      - tests/integration/test_stage_one_operator_physical.py
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-one-operator-physical.yml
      - scripts/provision-stage03-gstreamer.ps1
      - src/k5vision/auth_sessions.py
      - src/k5vision/domain/devices.py
      - src/k5vision/domain/users.py
      - src/k5vision/main.py
      - src/k5vision/operator_launch.py
      - src/k5vision/operator_launch_api.py
      - src/k5vision/operator_runtime.py
      - src/k5vision/stage_one_app.py
      - src/k5vision/stage03_credentials.py
      - src/k5vision/stage03_credential_probe.py
      - src/k5vision/services/device_registry.py
      - src/k5vision/services/user_registry.py
      - src/k5vision/user_admin_api.py
      - src/k5vision/media/**
      - tests/integration/test_stage_one_operator_physical.py

permissions:
  contents: read

jobs:
  stage-one-operator-physical:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 25
    env:
      K5_STAGE_ONE_OPERATOR_PHYSICAL: "1"
      K5_STAGE_ONE_OUTPUT: ${{ github.workspace }}\artifacts\stage-one-operator-physical.json
      K5_STAGE_ONE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
      K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}

    steps:
      - name: Checkout exact Stage One revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Provision isolated reviewed GStreamer runtime
        shell: powershell
        run: .\scripts\provision-stage03-gstreamer.ps1

      - name: Verify private physical configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Required Stage One physical source configuration is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CAM_CRED)) {
            throw "Required Stage One physical credential configuration is missing."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run authenticated physical operator witness
        shell: powershell
        run: pytest tests/integration/test_stage_one_operator_physical.py -q --no-cov

      - name: Assert retained witness is source-free
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:K5_STAGE_ONE_OUTPUT)) {
            throw "Stage One authenticated operator witness was not produced."
          }
          $text = Get-Content -LiteralPath $env:K5_STAGE_ONE_OUTPUT -Raw
          foreach ($pattern in @(
            'rtsp://',
            'rtsps://',
            '(?i)username',
            '(?i)password',
            '(?i)credential',
            '(?i)session_token',
            '(?i)device_id',
            '(?i)source_uri',
            '(?i)runner[_ -]?name',
            '[A-Za-z]:\\',
            '\\Users\\',
            '(?<![0-9])(?:10\.|127\.|169\.254\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.)'
          )) {
            if ($text -match $pattern) {
              throw "Stage One retained witness violated the source-free contract."
            }
          }

      - name: Upload source-free Stage One witness
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage-one-operator-physical-witness
          path: artifacts/stage-one-operator-physical.json
          if-no-files-found: error
          retention-days: 14
