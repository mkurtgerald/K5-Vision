name: Physical Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage03-physical:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 30
    env:
      K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
      K5_STAGE03_CANDIDATES_JSON: ${{ secrets.K5_STAGE03_CANDIDATES_JSON }}
      K5_STAGE03_OUTPUT: ${{ github.workspace }}\artifacts\stage03-physical.json
      K5_STAGE03_SCORED_RUNS: "5"
      K5_STAGE03_TIMEOUT: "10"
      K5_STAGE03_LOAD_LADDER: "1,2,3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify physical configuration
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) { throw "K5_STAGE03_SOURCE secret is not configured" }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CANDIDATES_JSON)) { throw "K5_STAGE03_CANDIDATES_JSON secret is not configured" }

      - name: Run Stage 03 physical qualification
        shell: powershell
        run: pytest tests/integration/test_stage03_physical.py -q

      - name: Upload retained qualification evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: stage03-physical-evidence
          path: artifacts/stage03-physical.json
          if-no-files-found: warn
          retention-days: 14
