name: Physical Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/physical-validation.yml
      - config/stage03-gstreamer-candidates.json
      - src/k5vision/stage03_gst_candidate.py
      - src/k5vision/stage03_credentials.py
      - src/k5vision/stage03_credential_probe.py

permissions:
  contents: read

jobs:
  stage03-physical:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 30
    env:
      K5_STAGE03_OUTPUT: ${{ github.workspace }}\artifacts\stage03-physical.json
      K5_STAGE03_SCORED_RUNS: "5"
      K5_STAGE03_TIMEOUT: "10"
      K5_STAGE03_LOAD_LADDER: "1,2,3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load versioned runtime candidate configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:GITHUB_WORKSPACE "config\stage03-gstreamer-candidates.json"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Versioned Stage 03 runtime candidate configuration is missing."
          }

          $raw = Get-Content -LiteralPath $path -Raw
          try {
            $null = $raw | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Versioned Stage 03 runtime candidate configuration is not valid JSON."
          }

          $delimiter = "K5_STAGE03_CANDIDATES_$([guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "K5_STAGE03_CANDIDATES_JSON<<$delimiter"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $raw
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $delimiter

      - name: Verify GStreamer runtime boundary
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("gst-launch-1.0", "gst-inspect-1.0")) {
            if ($null -eq (Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Required Stage 03 GStreamer executable is unavailable."
            }
          }

          foreach ($plugin in @("rtspsrc", "queue", "fakesink")) {
            & gst-inspect-1.0 $plugin *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Required Stage 03 GStreamer plugin is unavailable."
            }
          }

      - name: Verify physical configuration
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) { $missing += "K5_STAGE03_SOURCE" }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CAM_CRED)) { $missing += "CAM_CRED" }
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_CANDIDATES_JSON)) { $missing += "K5_STAGE03_CANDIDATES_JSON" }
          if ($missing.Count -gt 0) {
            throw ("Required physical configuration is missing: " + ($missing -join ", "))
          }

          try {
            $candidateConfig = $env:K5_STAGE03_CANDIDATES_JSON | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Required physical candidate configuration is not valid JSON."
          }

          try {
            $candidates = @($candidateConfig)
            if ($candidates.Count -lt 2) {
              throw "invalid"
            }

            $allowed = @(
              "schema_version",
              "candidate",
              "argv",
              "interruption_seconds",
              "poll_interval_seconds"
            )
            $seen = @{}

            foreach ($candidate in $candidates) {
              if ($null -eq $candidate -or $candidate -is [string]) { throw "invalid" }
              $propertyNames = @($candidate.PSObject.Properties.Name)
              if (@($propertyNames | Where-Object { $_ -notin $allowed }).Count -gt 0) { throw "invalid" }
              if ($propertyNames -notcontains "candidate" -or $propertyNames -notcontains "argv") { throw "invalid" }
              if ($propertyNames -contains "schema_version" -and [string]$candidate.schema_version -ne "1") { throw "invalid" }

              $candidateName = [string]$candidate.candidate
              if ([string]::IsNullOrWhiteSpace($candidateName) -or $candidateName.Length -gt 128) { throw "invalid" }
              if ($seen.ContainsKey($candidateName)) { throw "invalid" }
              $seen[$candidateName] = $true

              if ($candidate.argv -isnot [System.Array]) { throw "invalid" }
              $argv = @($candidate.argv)
              if ($argv.Count -lt 1 -or $argv.Count -gt 64) { throw "invalid" }
              foreach ($arg in $argv) {
                if ($arg -isnot [string] -or [string]::IsNullOrWhiteSpace($arg)) { throw "invalid" }
              }
              if (@($argv | Where-Object { $_ -eq "{source}" }).Count -ne 1) { throw "invalid" }
              if ($argv[0] -eq "{source}") { throw "invalid" }

              if ($propertyNames -contains "interruption_seconds") {
                $interruption = [double]$candidate.interruption_seconds
                if ($interruption -le 0 -or $interruption -gt 30) { throw "invalid" }
              }
              if ($propertyNames -contains "poll_interval_seconds") {
                $poll = [double]$candidate.poll_interval_seconds
                if ($poll -le 0 -or $poll -gt 1) { throw "invalid" }
              }
            }
          } catch {
            throw "Required physical candidate configuration failed schema validation."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve private camera credential candidate
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: |
          $ErrorActionPreference = "Stop"
          $index = & python -m k5vision.stage03_credential_probe $env:K5_STAGE03_SOURCE
          if ($LASTEXITCODE -ne 0 -or $index -notmatch '^\d+$') {
            throw "No supplied camera credential candidate authenticated the Stage 03 source."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "K5_STAGE03_CREDENTIAL_INDEX=$index"

      - name: Run Stage 03 physical qualification
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
          K5_STAGE03_CAM_CRED: ${{ secrets.CAM_CRED }}
        run: pytest tests/integration/test_stage03_physical.py -q --no-cov

      - name: Upload retained qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage03-physical-evidence
          path: artifacts/stage03-physical.json
          if-no-files-found: warn
          retention-days: 14
