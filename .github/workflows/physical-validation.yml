name: Physical Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage03-physical:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 30
    env:
      K5_STAGE03_CANDIDATES_PATH: ${{ github.workspace }}\config\stage03-candidates.windows.json
      K5_STAGE03_OUTPUT: ${{ github.workspace }}\artifacts\stage03-physical.json
      K5_STAGE03_SCORED_RUNS: "5"
      K5_STAGE03_TIMEOUT: "10"
      K5_STAGE03_LOAD_LADDER: "1,2,3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify physical configuration
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Required physical source configuration is missing."
          }
          if (-not (Test-Path -LiteralPath $env:K5_STAGE03_CANDIDATES_PATH -PathType Leaf)) {
            throw "Versioned physical candidate configuration is missing."
          }

          try {
            $candidateConfig = Get-Content -LiteralPath $env:K5_STAGE03_CANDIDATES_PATH -Raw |
              ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Versioned physical candidate configuration is not valid JSON."
          }

          try {
            $candidates = @($candidateConfig)
            if ($candidates.Count -lt 2) {
              throw "invalid"
            }

            $allowed = @(
              "schema_version",
              "candidate",
              "argv",
              "interruption_seconds",
              "poll_interval_seconds"
            )
            $seen = @{}

            foreach ($candidate in $candidates) {
              if ($null -eq $candidate -or $candidate -is [string]) { throw "invalid" }
              $propertyNames = @($candidate.PSObject.Properties.Name)
              if (@($propertyNames | Where-Object { $_ -notin $allowed }).Count -gt 0) {
                throw "invalid"
              }
              if ($propertyNames -notcontains "candidate" -or $propertyNames -notcontains "argv") {
                throw "invalid"
              }
              if (
                $propertyNames -contains "schema_version" -and
                [string]$candidate.schema_version -ne "1"
              ) {
                throw "invalid"
              }

              $candidateName = [string]$candidate.candidate
              if (
                [string]::IsNullOrWhiteSpace($candidateName) -or
                $candidateName.Length -gt 128
              ) {
                throw "invalid"
              }
              if ($seen.ContainsKey($candidateName)) { throw "invalid" }
              $seen[$candidateName] = $true

              if ($candidate.argv -isnot [System.Array]) { throw "invalid" }
              $argv = @($candidate.argv)
              if ($argv.Count -lt 1 -or $argv.Count -gt 64) { throw "invalid" }
              foreach ($arg in $argv) {
                if ($arg -isnot [string] -or [string]::IsNullOrWhiteSpace($arg)) {
                  throw "invalid"
                }
              }
              if (@($argv | Where-Object { $_ -eq "{source}" }).Count -ne 1) {
                throw "invalid"
              }
              if ($argv[0] -eq "{source}") { throw "invalid" }

              if ($propertyNames -contains "interruption_seconds") {
                $interruption = [double]$candidate.interruption_seconds
                if ($interruption -le 0 -or $interruption -gt 30) { throw "invalid" }
              }
              if ($propertyNames -contains "poll_interval_seconds") {
                $poll = [double]$candidate.poll_interval_seconds
                if ($poll -le 0 -or $poll -gt 1) { throw "invalid" }
              }
            }
          } catch {
            throw "Versioned physical candidate configuration failed schema validation."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qualification dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --only-binary=:all: --require-hashes `
            -r config/stage03-candidate-requirements.txt

      - name: Verify candidate runtime dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gst = Get-Command gst-launch-1.0 -ErrorAction SilentlyContinue
          if ($null -eq $gst) {
            throw "Required GStreamer candidate runtime is unavailable."
          }

          $versionText = (& gst-launch-1.0 --version | Out-String)
          if ($versionText -notmatch "gst-launch-1\.0 version 1\.20\.4") {
            throw "GStreamer candidate runtime version does not match the reviewed version."
          }

          foreach ($plugin in @("playbin", "fakesink")) {
            & gst-inspect-1.0 $plugin *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Required GStreamer candidate plugin is unavailable."
            }
          }

          python -c "import cv2, numpy; assert cv2.__version__ == '4.14.0'; assert numpy.__version__ == '2.2.6'"

      - name: Run Stage 03 physical qualification
        shell: powershell
        env:
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
        run: |
          $env:K5_STAGE03_CANDIDATES_JSON = Get-Content `
            -LiteralPath $env:K5_STAGE03_CANDIDATES_PATH -Raw
          pytest tests/integration/test_stage03_physical.py -q --no-cov

      - name: Upload retained qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage03-physical-evidence
          path: artifacts/stage03-physical.json
          if-no-files-found: warn
          retention-days: 14
