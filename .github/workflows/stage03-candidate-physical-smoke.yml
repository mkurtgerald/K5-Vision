name: Stage 03 Candidate Physical Smoke

on:
  push:
    branches:
      - automation/stage03-versioned-candidates-1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install candidate-only dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: --require-hashes `
            -r config/stage03-candidate-requirements.txt

      - name: Exercise physical source without media retention
        shell: powershell
        env:
          CAM_CRED: ${{ secrets.CAM_CRED }}
          K5_STAGE03_SOURCE: ${{ secrets.K5_STAGE03_SOURCE }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:K5_STAGE03_SOURCE)) {
            throw "Physical source is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:CAM_CRED)) {
            throw "Physical credential candidates are not configured."
          }

          $credentialValues = @(
            $env:CAM_CRED -split "\r?\n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($credentialValues.Count -lt 2) {
            throw "Physical credential candidate structure is invalid."
          }

          try {
            $sourceTemplate = [System.Uri]$env:K5_STAGE03_SOURCE
          } catch {
            throw "Physical source configuration is not a valid URI."
          }

          $selectedSource = $null
          $selectedIndex = 0
          $ErrorActionPreference = "Continue"
          for ($index = 1; $index -lt $credentialValues.Count; $index++) {
            $builder = [System.UriBuilder]::new($sourceTemplate)
            $builder.UserName = $credentialValues[0]
            $builder.Password = $credentialValues[$index]
            $candidateSource = $builder.Uri.AbsoluteUri

            python tools/stage03/opencv_ffmpeg_probe.py $candidateSource 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) {
              $selectedSource = $candidateSource
              $selectedIndex = $index
              break
            }
          }
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($selectedSource)) {
            throw "No configured credential candidate authenticated the physical source."
          }
          Write-Output "credential_candidate_match=$selectedIndex"

          $ErrorActionPreference = "Continue"
          python tools/stage03/gstreamer_probe.py $selectedSource 1>$null 2>$null
          $gstStatus = $LASTEXITCODE
          python tools/stage03/opencv_ffmpeg_probe.py $selectedSource 1>$null 2>$null
          $opencvStatus = $LASTEXITCODE
          $ErrorActionPreference = "Stop"

          if ($gstStatus -eq 0) {
            Write-Output "gstreamer_physical_smoke=success"
          } else {
            Write-Output "gstreamer_physical_smoke=failed code=$gstStatus"
          }
          if ($opencvStatus -eq 0) {
            Write-Output "opencv_ffmpeg_physical_smoke=success"
          } else {
            Write-Output "opencv_ffmpeg_physical_smoke=failed code=$opencvStatus"
          }

          if ($gstStatus -ne 0 -or $opencvStatus -ne 0) {
            throw "One or more Stage 03 physical candidate smokes failed."
          }
