              $meta.size_in_bytes -ne 298920547 -or $meta.workflow_run.id -ne 44960391488 -or
              $meta.workflow_run.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or
              $attempt.id -ne 44960391488 -or $attempt.run_attempt -ne 1 -or
