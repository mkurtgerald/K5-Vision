name: Windows motion clock diagnostics

on:
  workflow_dispatch:
  push:
    branches: [codex/browser-probe-20261121]
    paths:
      - .github/workflows/windows-service-compile.yml
      - tests/integration/test_windows_motion_recording.py
      - scripts/probe_windows_motion*.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-service-compile.yml
      - tests/integration/test_windows_motion_recording.py
      - scripts/probe_windows_motion*.py

permissions:
  contents: read

concurrency:
  group: motion-clock-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-runtime-clock-diagnostic:
    name: DIAGNOSTIC ONLY - exact d171 motion runtime across real clock steps
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      K5_DESKTOP_HEAD_SHA: d17120f413ff0cf7415c4462b3a50e1e19e65aaa
      K5_DIAGNOSTIC_HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      K5_VM_CLOCK_ACCEPTANCE: "1"
    steps:
      - name: Checkout exact d171 product runtime, store and original clock guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d17120f413ff0cf7415c4462b3a50e1e19e65aaa
          persist-credentials: false
      - name: Checkout separately identified parent-only runtime clock diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - name: Admit exact controller Git blob without changing the original runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Runtime clock diagnostic requires a disposable hosted Windows VM'
          }
          $harnessHead = (& git -C diagnostic-source rev-parse HEAD).Trim()
          & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c 'git -C diagnostic-source cat-file blob HEAD:scripts/probe_windows_motion_runtime.py > scripts/probe_windows_motion_runtime.py'
          $scriptSha = (Get-FileHash -LiteralPath scripts/probe_windows_motion_runtime.py -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $scriptSha -ne 'fa8126218870c378a43ca3fdae29308aded4e8be00c23e6dc83fa8c8f8c19a78' -or
              $harnessHead -ne $env:K5_DIAGNOSTIC_HARNESS_SHA -or $harnessHead -eq $env:K5_DESKTOP_HEAD_SHA) {
            throw 'Diagnostic runtime clock controller identity mismatch'
          }
          @{ schema_version=1; diagnostic_only=$true; product_qualification=$false;
             runtime_head=$env:K5_DESKTOP_HEAD_SHA; harness_head=$harnessHead; script_sha256=$scriptSha } |
            ConvertTo-Json | Set-Content -LiteralPath motion-runtime-clock-provenance.json -Encoding utf8
      - name: Set up native development Python for the diagnostic controller
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact d171 development dependencies and declared CV5 stack
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]" "numpy==2.2.6" "opencv-python-headless==5.0.0.93"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime clock diagnostic dependencies unavailable' }
      - name: Provision exact d171 pinned media, gateway and generated-video tools
        uses: ./.github/actions/provision-operator-tools
      - name: Observe parent runtime and source progress across guarded plus and minus two-day steps
        timeout-minutes: 3
        shell: pwsh
        run: |
          python scripts/probe_windows_motion_runtime.py --clock-steps --baseline-source-head $env:K5_DESKTOP_HEAD_SHA --output native-motion-runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'Runtime clock diagnostic infrastructure or restoration failed' }
          $evidence = Get-Content -LiteralPath native-motion-runtime.json -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 1 -or $evidence.status -ne 'diagnostic_complete' -or
              $evidence.diagnostic_only -ne $true -or $evidence.cleanup_complete -ne $true -or
              $evidence.baseline_source_head -ne $env:K5_DESKTOP_HEAD_SHA -or
              $evidence.motion_child_argv_unchanged -ne $true -or
              @($evidence.clock_steps).Count -ne 2 -or $evidence.clock_guard.clock_restored -ne $true -or
              $evidence.clock_guard.services_restored -ne $true) {
            throw 'Runtime clock diagnostic scope, observation or restoration mismatch'
          }
          $clockSteps = @($evidence.clock_steps)
          if ($clockSteps[0].offset_seconds -ne 172800 -or $clockSteps[1].offset_seconds -ne -172800) {
            throw 'Runtime clock diagnostic did not observe both original clock offsets'
          }
          foreach ($clockStep in $clockSteps) {
            if ($clockStep.shift.verified -ne $true -or $clockStep.immediate_state -ne 'post_capture' -or
                $clockStep.post_capture_elapsed_seconds -lt 0.5 -or $clockStep.post_capture_elapsed_seconds -gt 8 -or
                $clockStep.policy_wait.wanted -ne 'armed' -or $clockStep.policy_wait.last_status -ne 'armed' -or
                $clockStep.restoration.restored -ne $true) {
              throw 'Runtime clock diagnostic active hold transition or restoration mismatch'
            }
          }
      - name: Retain parent-only clock observations without qualification or promotion
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-only-d171-motion-runtime-clock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-motion-runtime.json
            motion-runtime-clock-provenance.json
          if-no-files-found: warn
          retention-days: 14
  motion-diagnostic:
    name: DIAGNOSTIC ONLY - replay exact d171 motion clock installer without rebuilding
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      K5_DESKTOP_HEAD_SHA: d17120f413ff0cf7415c4462b3a50e1e19e65aaa
      K5_DESKTOP_SETUP_SHA256: 1d97d0161c103ec57e25d346d7d37b93e1c5f58f04a1befde244edaca5a7bdb2
      K5_OPERATOR_BROWSER_ACCEPTANCE: "1"
      K5_OPERATOR_BROWSER_CHANNEL: msedge
      K5_NATIVE_MOTION_ACCEPTANCE: "1"
      K5_VM_CLOCK_ACCEPTANCE: "1"
      K5_MOTION_DIAGNOSTIC_ONLY: "1"
      K5_MOTION_DIAGNOSTIC_HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout original immutable installer runtime and acceptance helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d17120f413ff0cf7415c4462b3a50e1e19e65aaa
          persist-credentials: false
      - name: Checkout the separate diagnostic harness without replacing product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - name: Admit the original successful producer and immutable artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          $meta = Invoke-RestMethod -Uri "$api/artifacts/14733111153" -Headers $headers
          $attempt = Invoke-RestMethod -Uri "$api/runs/44969219929/attempts/1" -Headers $headers
          $jobs = Invoke-RestMethod -Uri "$api/runs/44969219929/attempts/1/jobs?per_page=100" -Headers $headers
          $producer = @($jobs.jobs | Where-Object { $_.id -eq 137045084135 })
          if ($meta.id -ne 14733111153 -or $meta.expired -ne $false -or
              $meta.name -ne "k5-vision-windows-upgrade-candidate-$($env:K5_DESKTOP_HEAD_SHA)-44969219929-attempt-1" -or
              $meta.digest -ne 'sha256:4ff14a67edc47d784cb71646a742ca5cd3c0dac3b59925cfc5a3f9f93dd6fa82' -or
              $meta.size_in_bytes -ne 298908902 -or $meta.workflow_run.id -ne 44969219929 -or
              $meta.workflow_run.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or
              $attempt.id -ne 44969219929 -or $attempt.run_attempt -ne 1 -or
              $attempt.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or
              $producer.Count -ne 1 -or $producer[0].conclusion -ne 'success') {
            throw 'Original motion replay producer or artifact identity mismatch'
          }
      - name: Download exact original d171 candidate installer by exact artifact ID
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 14733111153
          github-token: ${{ github.token }}
          run-id: 44969219929
          path: motion-replay-input
          merge-multiple: true
      - name: Bind original bytes and overlay only the diagnostic motion test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -LiteralPath motion-replay-input/desktop-package.json -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath motion-replay-input/payload-manifest.json -Raw | ConvertFrom-Json
          $setup = Get-Item -LiteralPath motion-replay-input/K5VisionSetup.exe
          $sha = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $worktreeOverlaySha = (Get-FileHash -LiteralPath diagnostic-source/tests/integration/test_windows_motion_recording.py -Algorithm SHA256).Hash.ToLowerInvariant()
          # Read the exact immutable Git blob, before checkout EOL filters.
          # cmd's native byte redirection avoids PowerShell text re-encoding.
          & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c 'git -C diagnostic-source cat-file blob HEAD:tests/integration/test_windows_motion_recording.py > motion-overlay-admitted.py'
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic motion overlay Git blob unavailable' }
          $overlay = 'motion-overlay-admitted.py'
          $overlaySha = (Get-FileHash -LiteralPath $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ checkout_overlay_sha256=$worktreeOverlaySha; git_blob_overlay_sha256=$overlaySha } | ConvertTo-Json -Compress | Write-Host
          if ($sha -ne $env:K5_DESKTOP_SETUP_SHA256 -or $package.setup_sha256 -ne $sha -or
              $package.setup_bytes -ne $setup.Length -or
              $package.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or $manifest.head_sha -ne $env:K5_DESKTOP_HEAD_SHA -or
              $package.payload_manifest_sha256 -ne (Get-FileHash -LiteralPath motion-replay-input/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $package.qualification_status -ne 'unqualified' -or $package.run_id -ne 44969219929 -or $package.run_attempt -ne 1 -or
              $package.payload_manifest_sha256 -ne 'd3d90edde5b69ba52a124ec34d176ef4fc0efe5e79e48f530a716451b52bdb8c' -or
              $package.launcher_sha256 -ne '7f0a48885feb936dffb14fe59d3f4efff1217e32dde98ab4068ab50241253317' -or
              $manifest.files.path -notcontains 'K5VisionRecorder.exe' -or $manifest.files.path -notcontains 'K5VisionRecorder.xml' -or
              $overlaySha -ne '690f3e00542dbd189cbd5f075f2c2d84b711a79706a3914c419fc27ed5d899c7' -or
              $env:K5_MOTION_DIAGNOSTIC_HARNESS_SHA -eq $env:K5_DESKTOP_HEAD_SHA) {
            throw 'Diagnostic motion replay source or installer byte identity mismatch'
          }
          Copy-Item -LiteralPath $overlay -Destination tests/integration/test_windows_motion_recording.py -Force
          "K5_DESKTOP_SETUP=$($setup.FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          @{ schema_version=1; diagnostic_only=$true; product_qualification=$false;
             installer_head=$env:K5_DESKTOP_HEAD_SHA; harness_head=$env:K5_MOTION_DIAGNOSTIC_HARNESS_SHA;
             source_run_id=44969219929; source_run_attempt=1; artifact_id=14733111153;
             setup_sha256=$sha; overlay_sha256=$overlaySha; replay_run_id=$env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content -LiteralPath motion-replay-provenance.json -Encoding utf8
      - name: Prepare only the disposable CI user's default browser
        uses: ./.github/actions/prepare-windows-browser
      - name: Set up development Python for the diagnostic controller
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install original acceptance dependencies before changing guest time
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]" "playwright==1.58.0"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic motion dependency installation failed' }
      - name: Provision original pinned generated-media tools before changing guest time
        uses: ./.github/actions/provision-operator-tools
      - name: Replay original installed motion criteria with diagnostic-only properties
        timeout-minutes: 8
        shell: pwsh
        run: |
          python -m pytest tests/integration/test_windows_motion_recording.py -o addopts= --no-cov -s --tb=short -o faulthandler_timeout=460 --junitxml=motion-replay-diagnostic.xml
          $testResult = $LASTEXITCODE
          [xml]$report = Get-Content -LiteralPath motion-replay-diagnostic.xml -Raw
          if ($report.SelectNodes('//property[@name="motion_windows_receipt"]').Count -ne 0 -or
              $report.SelectNodes('//property[@name="diagnostic_only_motion_scope"]').Count -ne 1) {
            throw 'Diagnostic replay emitted an invalid qualification scope'
          }
          if ($testResult -ne 0) { throw 'Diagnostic-only motion replay reproduced a failing criterion' }
      - name: Retain diagnostic-only replay observations without promotion
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-only-motion-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            motion-replay-diagnostic.xml
            motion-replay-provenance.json
          if-no-files-found: warn
          retention-days: 14
