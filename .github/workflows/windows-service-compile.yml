            if ($LASTEXITCODE -ne 0) { throw 'Actual native wire fixture compilation failed' }
            # Only the fixture's Main executes: private generated pipes, no
            # product entry point, service, profile, account or clock operation.
            & $output ('--' + $variant) | Tee-Object -FilePath ('recorder-wire-' + $variant + '.json')
            $observed = $LASTEXITCODE
            $expected = if ($variant -eq 'baseline') { 10 } elseif ($variant -eq 'delivery-baseline') { 11 } else { 0 }
            if ($observed -ne $expected) { throw "Native wire $variant did not establish its required result" }
          }
          Remove-Item -LiteralPath wire-proof -Recurse -Force
      - name: Retain finite native wire red and green observations
