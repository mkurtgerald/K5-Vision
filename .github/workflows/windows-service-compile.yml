          $identity = (Resolve-Path -LiteralPath wire-proof/PayloadIdentity.cs).Path
          $references = @('System.dll', 'System.Core.dll', 'System.Drawing.dll', 'System.Windows.Forms.dll',
            'System.Web.Extensions.dll', 'System.IO.Compression.dll', 'System.IO.Compression.FileSystem.dll')
          $referenceFlags = @($references | ForEach-Object { '/reference:' + $_ })
          foreach ($variant in @('baseline', 'delivery-baseline', 'fixed')) {
            $sourceRoot = if ($variant -eq 'baseline') { 'wire-baseline/windows/desktop' }
              elseif ($variant -eq 'delivery-baseline') { 'wire-delivery-baseline/windows/desktop' }
              else { 'windows/desktop' }
            $sources = @('K5Vision.cs', 'K5RecorderHost.cs', 'K5ServiceInstallation.cs', 'K5VisionClient.cs') |
