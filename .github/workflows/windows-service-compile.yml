              $package.payload_manifest_sha256 -ne (Get-FileHash -LiteralPath motion-replay-input/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $package.motion_recording -ne $true -or $package.camera_trigger_zones -ne $true -or
              $package.no_terminal_required -ne $true -or $package.workers_bundled -ne $true -or
              $overlaySha -ne 'cb77f657cee15edf4a8b6007fb8101ea5b32a42ce7fecb324a56536e91706fdc' -or
