          # The probe invokes only the actual guard's read-only admission method.
          # Never launch or distribute this placeholder product executable, or
          # treat a completed diagnostic as installed-service qualification.
          Remove-Item -LiteralPath compile-only -Recurse -Force
      - name: Retain finite machine-admission observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: machine-admission-${{ github.run_id }}
          path: |
            machine-admission-native.json
            machine-admission-python.json
          if-no-files-found: warn
          retention-days: 14
