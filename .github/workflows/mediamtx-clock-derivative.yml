name: Experimental native MediaMTX monotonic watchdog derivative

on:
  workflow_dispatch:
  push:
    branches: [codex/mediamtx-clock-20261122]
    paths:
      - .github/workflows/mediamtx-clock-derivative.yml
      - scripts/build_mediamtx_clock_derivative.py
      - third_party/builds/mediamtx-clock-derivative.json
      - third_party/patches/gortsplib-5.6.7-monotonic-tcp-watchdog.*
      - third_party/licenses/gortsplib-MIT.txt
      - third_party/licenses/hls.js-LICENSE.txt
      - third_party/licenses/Apache-2.0.txt
      - THIRD_PARTY_NOTICES.md

permissions:
  contents: read

concurrency:
  group: mediamtx-clock-derivative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build-and-regression:
    name: Experimental derivative - native regression and reproducible Windows builds
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact K5 patch and build specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout exact original MediaMTX source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bluenviron/mediamtx
          ref: 914e39535ece709919ac325aaeed98d394ed9093
          path: donor-source/mediamtx
          persist-credentials: false
      - name: Checkout exact original gortsplib source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bluenviron/gortsplib
          ref: 09cc2060a7188c1f5f58498a8ede1e56338cd804
          path: donor-source/gortsplib
          persist-credentials: false
      - name: Set up development-only Python for reproducible build control
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Admit and extract the exact official Go 1.27.0 Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -LiteralPath third_party/builds/mediamtx-clock-derivative.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'k5-go1.27.0.windows-amd64.zip'
          Invoke-WebRequest -Uri $pin.go.url -OutFile $archive -TimeoutSec 180
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.go.archive_bytes -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.go.archive_sha256) {
            throw 'Official Go toolchain archive content identity mismatch'
          }
          $toolchain = Join-Path $env:RUNNER_TEMP 'k5-monotonic-go-toolchain'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolchain
          "K5_DERIVATIVE_GO_ROOT=$(Join-Path $toolchain 'go')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "K5_DERIVATIVE_GO_ARCHIVE=$archive" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Prove original native failures, patched native passes and two matching derivative builds
        shell: pwsh
        run: |
          python scripts/build_mediamtx_clock_derivative.py --mediamtx-source donor-source/mediamtx --gortsplib-source donor-source/gortsplib --go-root $env:K5_DERIVATIVE_GO_ROOT --go-archive $env:K5_DERIVATIVE_GO_ARCHIVE --output derivative-proof
          if ($LASTEXITCODE -ne 0) { throw 'Experimental donor derivative build or regression failed' }
          $proof = Get-Content -LiteralPath derivative-proof/build-provenance.json -Raw | ConvertFrom-Json
          if ($proof.status -ne 'passed' -or $proof.reproducible_binary -ne $true -or
              $proof.product_qualification -ne $false -or $proof.installer_built -ne $false -or
              $proof.derivative_version -ne 'v1.21.2-k5-monotonic1' -or @($proof.builds).Count -ne 2 -or
              $proof.builds[0].sha256 -ne $proof.builds[1].sha256) {
            throw 'Experimental donor provenance does not admit the exact derivative'
          }
      - name: Retain experimental binary, original notices and native regression provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: experimental-mediamtx-monotonic-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            derivative-proof/mediamtx.exe
            derivative-proof/build-provenance.json
            derivative-proof/build-info-*.txt
            derivative-proof/*native-regression.*
            derivative-proof/go-module-graph.jsonl
            derivative-proof/notice-inventory.json
            derivative-proof/licenses/
            derivative-proof/*.patch
            derivative-proof/gortsplib-5.6.7-monotonic-tcp-watchdog.json
            derivative-proof/mediamtx-clock-derivative.json
            derivative-proof/THIRD_PARTY_NOTICES.md
          if-no-files-found: warn
          retention-days: 30
