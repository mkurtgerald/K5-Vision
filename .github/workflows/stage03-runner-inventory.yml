name: Stage 03 Runner Inventory

on:
  push:
    branches:
      - automation/stage03-runner-inventory-1

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 5
    steps:
      - name: Inspect available GStreamer qualification surface
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $commands = @("gst-launch-1.0", "gst-inspect-1.0", "gst-discoverer-1.0", "gst-play-1.0")
          foreach ($name in $commands) {
            $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $command) {
              Write-Output "$name=absent"
            } else {
              Write-Output "$name=present"
            }
          }

          if (Get-Command gst-launch-1.0 -ErrorAction SilentlyContinue) {
            & gst-launch-1.0 --version | Select-Object -First 3
          }

          if (Get-Command gst-inspect-1.0 -ErrorAction SilentlyContinue) {
            & gst-inspect-1.0 --version | Select-Object -First 3
            foreach ($plugin in @("rtspsrc", "decodebin", "fakesink", "identity", "rtph264depay", "h264parse")) {
              & gst-inspect-1.0 $plugin *> $null
              if ($LASTEXITCODE -eq 0) {
                Write-Output "plugin:$plugin=present"
              } else {
                Write-Output "plugin:$plugin=absent"
              }
            }
            $identity = & gst-inspect-1.0 identity 2>$null
            if ($identity -match "eos-after") {
              Write-Output "identity:eos-after=present"
            } else {
              Write-Output "identity:eos-after=absent"
            }
          }
