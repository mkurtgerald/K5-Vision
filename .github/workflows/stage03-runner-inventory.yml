name: Stage 03 Runner Inventory

on:
  push:
    branches:
      - automation/stage03-runner-inventory-1

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, k5-physical, camera-lab]
    timeout-minutes: 5
    steps:
      - name: Inspect local GStreamer installation provenance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-Command gst-launch-1.0 -ErrorAction Stop).Source
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          Write-Output "exe=$exe"
          Write-Output "file_version=$($info.FileVersion)"
          Write-Output "product_version=$($info.ProductVersion)"
          Write-Output "company=$($info.CompanyName)"
          Write-Output "product=$($info.ProductName)"

          $roots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          foreach ($root in $roots) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*GStreamer*" } |
              ForEach-Object {
                Write-Output "registry:name=$($_.DisplayName) version=$($_.DisplayVersion) publisher=$($_.Publisher) install=$($_.InstallLocation)"
              }
          }

          $installRoot = Split-Path (Split-Path $exe -Parent) -Parent
          Write-Output "install_root=$installRoot"
          Get-ChildItem -LiteralPath $installRoot -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(COPYING|LICENSE|LICENSES|NOTICE)(\.|$)" } |
            Select-Object -First 40 -ExpandProperty FullName |
            ForEach-Object { Write-Output "notice=$_" }
