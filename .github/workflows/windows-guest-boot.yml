name: Disposable Windows guest qualification infrastructure
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: recording
        options: [recording, planned-restart-recording, image-discovery, bootstrap-observation]
  push:
    branches: [codex/windows-guest-20261122]
    paths:
      - .github/workflows/windows-guest-boot.yml
      - scripts/probe_windows_guest_image.ps1
      - scripts/probe_windows_guest_recording.ps1
      - scripts/windows_guest_witness.ps1
      - scripts/windows_guest_bootstrap.cs
      - scripts/windows_guest_bootstrap_controls.cs
      - scripts/windows_guest_boot_sequence_controls.ps1
permissions:
  contents: read
concurrency:
  group: windows-guest-image-${{ github.sha }}-${{ github.event_name == 'push' && 'bootstrap-observation' || inputs.scope }}
  cancel-in-progress: false
jobs:
  image-discovery:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'image-discovery'
    name: DIAGNOSTIC ONLY - inspect official Windows evaluation guest image
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Checkout exact image discovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect resources, official image bytes and offline Windows edition
        timeout-minutes: 16
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c 'git cat-file blob HEAD:scripts/probe_windows_guest_image.ps1 > guest-image-admitted.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Image discovery Git blob unavailable' }
          $scriptSha = (Get-FileHash -LiteralPath guest-image-admitted.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokens=$null; $parseErrors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path guest-image-admitted.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -ne 0) { throw 'Image discovery source did not parse' }
          pwsh -NoProfile -NonInteractive -File guest-image-admitted.ps1 | Tee-Object -FilePath windows-guest-image.json
          if ($LASTEXITCODE -ne 0) { throw 'Image discovery could not clean up its exact resources' }
          $evidence=Get-Content -LiteralPath windows-guest-image.json -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 1 -or $evidence.diagnostic_only -ne $true -or
              $evidence.product_qualification -ne $false -or $evidence.windows_boot_qualified -ne $false -or
              $evidence.cleanup_complete -ne $true) { throw 'Image discovery scope differs' }
          @{schema_version=1; diagnostic_only=$true; head_sha=$env:GITHUB_SHA; script_sha256=$scriptSha;
            run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; product_qualification=$false} |
            ConvertTo-Json | Set-Content -LiteralPath windows-guest-image-provenance.json -Encoding utf8
      - name: Retain only finite image identity and capacity observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-windows-guest-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows-guest-image.json
            windows-guest-image-provenance.json
          if-no-files-found: warn
          retention-days: 14
  guest-recording:
    if: github.event_name == 'push' || inputs.scope == 'recording' || inputs.scope == 'planned-restart-recording' || inputs.scope == 'bootstrap-observation'
    # Branch pushes diagnose initialization for four minutes. A manual recording
    # dispatch retains the original complete qualification criteria and budgets.
    name: ${{ (github.event_name == 'push' || inputs.scope == 'bootstrap-observation') && 'DIAGNOSTIC ONLY - 4-minute Windows initialization observation (no qualification)' || (inputs.scope == 'planned-restart-recording' && 'DIAGNOSTIC ONLY - actual 5247fd96 planned guest shutdown/start and sign-out recording' || 'DIAGNOSTIC ONLY - actual 5247fd96 hard-reset guest reboot and sign-out recording') }}
    runs-on: windows-2025
    timeout-minutes: 38
    permissions:
      contents: read
      actions: read
    env:
      K5_GUEST_PRODUCT_HEAD: 5247fd96b827129c010bfcf1e924824535f4d1c2
      K5_GUEST_SETUP_SHA256: 68690ee4f6a18321af7bde22ae679c196d562608c1e3b468f6a78dc2480dc01f
      K5_GUEST_REBOOT_OPERATION: ${{ inputs.scope == 'planned-restart-recording' && 'planned-shutdown-start' || 'hard-reset' }}
      K5_GUEST_BOOTSTRAP_OBSERVATION: ${{ (github.event_name == 'push' || inputs.scope == 'bootstrap-observation') && 'true' || 'false' }}
    steps:
      - name: Checkout the separately identified guest controller and helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact guest source Git blobs and compile actual Framework GUI helper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path guest-native-build | Out-Null
          foreach ($name in @('probe_windows_guest_recording.ps1','windows_guest_witness.ps1','windows_guest_bootstrap.cs','windows_guest_bootstrap_controls.cs','windows_guest_boot_sequence_controls.ps1','windows_guest_logon_identity_controls.ps1')) {
            & (Join-Path $env:SYSTEMROOT 'System32/cmd.exe') /d /c "git cat-file blob HEAD:scripts/$name > guest-native-build\$name"
            if ($LASTEXITCODE -ne 0) { throw 'Guest source Git blob unavailable' }
          }
          $sourceHashes=@{}
          foreach ($file in Get-ChildItem -LiteralPath guest-native-build -File) {
            $sourceHashes[$file.Name]=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($file.Extension -eq '.ps1') {
              $tokens=$null; $errors=$null
              [Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
              if (@($errors).Count) { throw 'Guest controller source did not parse' }
            }
          }
          if ($sourceHashes['probe_windows_guest_recording.ps1'] -ne 'ab0152dfd13ad5ce4093e3d7692f16ce6ba6c78e2b846e722ed5d4bea00a83f1') { throw 'Native guest controller Git blob differs' }
          if ($sourceHashes['windows_guest_witness.ps1'] -ne '0c95c4a387964a76f4aee9a26b991646b187bc0d02b39c776c94ca02909129a6') { throw 'Native guest witness Git blob differs' }
          if ($sourceHashes['windows_guest_bootstrap.cs'] -ne 'b8ef1a885d876d0a66833b3350221bd66794f972843e418815628278b9163909' -or
              $sourceHashes['windows_guest_bootstrap_controls.cs'] -ne '4757e92ab04d387d9d04f0572949c1224dbfa2f25222cb5680290577ec30c837') { throw 'Guest GUI bootstrap controls source differs' }
          if ($sourceHashes['windows_guest_boot_sequence_controls.ps1'] -ne '84204b182165214c3cf46558ff812c87892b6213a0529d7641a2ea3606cb48c0') { throw 'Native boot sequence controls source differs' }
          if ($sourceHashes['windows_guest_logon_identity_controls.ps1'] -ne '7cdaac46bfb21e52a0fe717683adc52f3192ccf860d7cc2561acfbb89482f1fb') { throw 'Native logon identity controls source differs' }
          $compiler=Join-Path $env:SYSTEMROOT 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $buildRoot=(Resolve-Path -LiteralPath guest-native-build).Path
          $helperSource=(Get-Item -LiteralPath (Join-Path $buildRoot 'windows_guest_bootstrap.cs')).FullName
          $helperOutput=Join-Path $buildRoot 'windows_guest_bootstrap.exe'
          $compileArguments=@('/nologo','/target:winexe','/platform:x64','/optimize+',
            '/r:System.Core.dll','/r:System.Web.Extensions.dll','/r:System.ServiceProcess.dll',
            ('/out:'+$helperOutput),$helperSource)
          & $compiler @compileArguments
          if ($LASTEXITCODE -ne 0) { throw 'Native Framework guest GUI bootstrap did not compile' }
          $controlsOutput=Join-Path $buildRoot 'windows_guest_bootstrap_controls.exe'
          $controlsArguments=@('/nologo','/target:exe','/platform:x64','/optimize+',
            '/r:System.Core.dll','/r:System.Web.Extensions.dll','/r:System.Windows.Forms.dll','/r:System.Drawing.dll',
            ('/out:'+$controlsOutput),(Join-Path $buildRoot 'windows_guest_bootstrap_controls.cs'))
          & $compiler @controlsArguments
          if ($LASTEXITCODE -ne 0) { throw 'Native Framework GUI controls regression did not compile' }
          & $controlsOutput $helperOutput
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI readiness or diagnostic privacy regression failed' }
          # Test only the QA helper's TOTP codec, using a public RFC seed and an
          # independent Python standard-library result before any guest download.
          @'
          import base64, hashlib, hmac, struct, time
          key=base64.b32decode('GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ')
          digest=hmac.new(key,struct.pack('>Q',int(time.time())//30),hashlib.sha1).digest()
          offset=digest[-1]&15
          print(f'{(struct.unpack(">I",digest[offset:offset+4])[0]&0x7fffffff)%1000000:06d}')
          '@ | Set-Content -LiteralPath guest-native-build/totp-reference.py -Encoding ascii
          @'
          param([string]$Assembly)
          $ErrorActionPreference='Stop'
          $loaded=[Reflection.Assembly]::LoadFile($Assembly)
          $type=$loaded.GetType('WindowsGuestBootstrap',$true)
          $method=$type.GetMethod('Totp',[Reflection.BindingFlags]'Static,NonPublic')
          $method.Invoke($null,@('GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ'))
          '@ | Set-Content -LiteralPath guest-native-build/totp-native.ps1 -Encoding ascii
          $before=(& python guest-native-build/totp-reference.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Public TOTP reference unavailable' }
          $actual=(& (Join-Path $env:SYSTEMROOT 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File guest-native-build/totp-native.ps1 -Assembly (Resolve-Path guest-native-build/windows_guest_bootstrap.exe).Path).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Compiled QA TOTP codec did not run' }
          $after=(& python guest-native-build/totp-reference.py).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -notin @($before,$after)) { throw 'Compiled QA TOTP codec disagreed with independent reference' }
          # Compile the exact literal native witness class and exercise its ABI,
          # refusal controls and actual same-boot x64/build26100 read before a VM.
          # The paired host reads never claim an actual guest reboot.
          $counterOutput=& (Join-Path $env:SYSTEMROOT 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $buildRoot 'windows_guest_boot_sequence_controls.ps1') -Source (Join-Path $buildRoot 'windows_guest_witness.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Native boot sequence ABI or read controls failed' }
          $counter=$counterOutput | ConvertFrom-Json
          if ($counter.schema_version -ne 1 -or $counter.diagnostic_only -ne $true -or $counter.product_qualification -ne $false -or
              $counter.native_same_boot_read_observed -ne $true -or $counter.actual_guest_reboot_observed -ne $false -or
              $counter.contract_controls_passed -ne 34 -or $counter.source_sha256 -ne $sourceHashes['windows_guest_witness.ps1'] -or
              $counter.vendor_wdk_header_sha256 -ne '2d82908d3c5cfda7214a1d299dc730fd4863c090df7d146a62b0f7fb080320f7' -or
              $counter.vendor_sdk_mapping_header_sha256 -ne '832f26c59686cf6864da83681f97fc6fee3a7006399c48efa777d4330a499efb') { throw 'Native boot read controls receipt differs' }
          $counterOutput
          # Exercise actual helpers and the host census validator in native PS5
          # with fixed fake events before downloading or starting any VM.
          $logonOutput=& (Join-Path $env:SYSTEMROOT 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $buildRoot 'windows_guest_logon_identity_controls.ps1') -Source (Join-Path $buildRoot 'windows_guest_witness.ps1') -ExpectedSourceSha256 $sourceHashes['windows_guest_witness.ps1'] -ControllerSource (Join-Path $buildRoot 'probe_windows_guest_recording.ps1') -ExpectedControllerSha256 $sourceHashes['probe_windows_guest_recording.ps1']
          if ($LASTEXITCODE -ne 0) { throw 'Native logon identity controls failed' }
          $logon=$logonOutput | ConvertFrom-Json
          if ($logon.schema_version -ne 1 -or $logon.diagnostic_only -ne $true -or $logon.product_qualification -ne $false -or
              $logon.windows_powershell_major -ne 5 -or $logon.edition -cne 'Desktop' -or $logon.source_sha256 -cne $sourceHashes['windows_guest_witness.ps1'] -or
              $logon.contract_controls_passed -ne 165 -or $logon.namespace_cases -ne 6 -or $logon.invalid_sid_cases -ne 8 -or
              $logon.reserved_os_classification_cases -ne 92 -or $logon.host_census_cases -ne 46 -or
              $logon.controller_source_sha256 -cne $sourceHashes['probe_windows_guest_recording.ps1'] -or
              $logon.actual_boot_actor_observed -ne $false -or $logon.human_or_unclassified_interactive_refusals_preserved -ne $true -or
              $logon.planned_reserved_os_type2_classification_controls_passed -ne $true -or $logon.hard_reset_exemption_enabled -ne $false) { throw 'Native logon identity controls receipt differs' }
          $logonOutput
          $sourceHashes['windows_guest_bootstrap.exe']=(Get-FileHash -LiteralPath guest-native-build/windows_guest_bootstrap.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{schema_version=1; diagnostic_only=$true; product_qualification=$false; harness_head=$env:GITHUB_SHA;
            product_head=$env:K5_GUEST_PRODUCT_HEAD; installer_sha256=$env:K5_GUEST_SETUP_SHA256;
            image_sha256='2d175924c8e647969a82e36f931b22397108bd94a030e0e947b7e66e47e0be9a';
            source_hashes=$sourceHashes; native_boot_sequence_read=$counter; native_logon_identity_controls=$logon; reboot_operation=$env:K5_GUEST_REBOOT_OPERATION; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT} |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath windows-guest-recording-provenance.json -Encoding utf8
      - name: Admit the exact 5247fd96 GUI producer and its unqualified candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          $meta=Invoke-RestMethod -Uri "$api/artifacts/14951267643" -Headers $headers
          $attempt=Invoke-RestMethod -Uri "$api/runs/45456600775/attempts/1" -Headers $headers
          $jobs=Invoke-RestMethod -Uri "$api/runs/45456600775/attempts/1/jobs?per_page=100" -Headers $headers
          $producer=@($jobs.jobs | Where-Object { $_.id -eq 138667612998 })
          if ($meta.id -ne 14951267643 -or $meta.expired -ne $false -or
              $meta.digest -ne 'sha256:2d3b03d21a179450ea0722c055ca755d463c995637a8140c0f5560d190b7c60e' -or
              $meta.size_in_bytes -ne 285152694 -or $meta.workflow_run.id -ne 45456600775 -or
              $meta.workflow_run.head_sha -ne $env:K5_GUEST_PRODUCT_HEAD -or
              $attempt.run_attempt -ne 1 -or $attempt.head_sha -ne $env:K5_GUEST_PRODUCT_HEAD -or
              $producer.Count -ne 1 -or $producer[0].conclusion -ne 'success') {
            throw 'Original guest candidate producer identity differs'
          }
      - name: Download the fixed original installer artifact without rebuilding it
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 14951267643
          github-token: ${{ github.token }}
          run-id: 45456600775
          path: guest-product-input
          merge-multiple: true
      - name: Bind original installer, package and manifest bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Get-Content -LiteralPath guest-product-input/desktop-package.json -Raw | ConvertFrom-Json
          $manifest=Get-Content -LiteralPath guest-product-input/payload-manifest.json -Raw | ConvertFrom-Json
          $setup=Get-Item -LiteralPath guest-product-input/K5VisionSetup.exe
          $sha=(Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:K5_GUEST_SETUP_SHA256 -or $setup.Length -ne 286590924 -or
              $package.setup_sha256 -ne $sha -or $package.setup_bytes -ne $setup.Length -or
              $package.qualification_status -ne 'unqualified' -or $package.run_id -ne 45456600775 -or
              $package.run_attempt -ne 1 -or $package.head_sha -ne $env:K5_GUEST_PRODUCT_HEAD -or
              $manifest.head_sha -ne $env:K5_GUEST_PRODUCT_HEAD -or
              (Get-FileHash -LiteralPath guest-product-input/desktop-package.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne '53f68b0376ec12e6da0f8a7be5eabd7cc24a4ea016fc6c945ed8756a1ed38399' -or
              (Get-FileHash -LiteralPath guest-product-input/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd40ab7e9c4dba36a85004914ffbd5012176d38479baa3a2022a0ef5249e1b9eb' -or
              $package.payload_manifest_sha256 -ne (Get-FileHash -LiteralPath guest-product-input/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $manifest.files.path -notcontains 'K5VisionRecorder.exe' -or
              $manifest.files.path -notcontains 'K5VisionRecorder.xml') { throw 'Original guest candidate bytes differ' }
      - name: Provision original pinned generated-video development tools
        uses: ./.github/actions/provision-operator-tools
      - name: ${{ (github.event_name == 'push' || inputs.scope == 'bootstrap-observation') && 'DIAGNOSTIC ONLY - observe initialization for four minutes without qualification' || 'Observe actual guest recording across reboot and logoff' }}
        timeout-minutes: 33
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $controller=(Resolve-Path guest-native-build/probe_windows_guest_recording.ps1).Path
          $setup=(Resolve-Path guest-product-input/K5VisionSetup.exe).Path
          $helper=(Resolve-Path guest-native-build/windows_guest_bootstrap.exe).Path
          $observationArguments=@()
          if ($env:K5_GUEST_BOOTSTRAP_OBSERVATION -eq 'true') { $observationArguments=@('-BootstrapObservation') }
          & (Join-Path $env:SYSTEMROOT 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $controller -SetupPath $setup -ProductHead $env:K5_GUEST_PRODUCT_HEAD -SetupSha256 $env:K5_GUEST_SETUP_SHA256 -BootstrapExe $helper -MediaMTX $env:K5_MEDIAMTX_DONOR_EXE -FFmpeg $env:K5_DONOR_FFMPEG -FFprobe $env:K5_DONOR_FFPROBE -RebootOperation $env:K5_GUEST_REBOOT_OPERATION @observationArguments |
            Tee-Object -FilePath windows-guest-recording.json
          if ($LASTEXITCODE -ne 0) { throw 'Guest recording diagnostic could not retire its exact resources' }
          $evidence=Get-Content -LiteralPath windows-guest-recording.json -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 1 -or $evidence.diagnostic_only -ne $true -or
              $evidence.product_qualification -ne $false -or $evidence.cleanup_complete -ne $true -or
              $evidence.github_credentials_entered_guest -ne $false -or
              $evidence.product_head -ne $env:K5_GUEST_PRODUCT_HEAD -or
              $evidence.installer_sha256 -ne $env:K5_GUEST_SETUP_SHA256 -or
              $evidence.reboot_operation -cne $env:K5_GUEST_REBOOT_OPERATION) { throw 'Guest recording diagnostic scope differs' }
          if ($env:K5_GUEST_BOOTSTRAP_OBSERVATION -ne 'true') {
            $tokens=$null; $errors=$null
            $controllerAst=[Management.Automation.Language.Parser]::ParseFile($controller,[ref]$tokens,[ref]$errors)
            $censusHelper=@($controllerAst.FindAll({param($node)$node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'Assert-GuestLogonCensus'},$true))
            if (@($errors).Count -ne 0 -or $censusHelper.Count -ne 1) { throw 'Host logon census validator unavailable' }
            . ([scriptblock]::Create($censusHelper[0].Extent.Text))
            Assert-GuestLogonCensus $evidence.reboot_witness ($env:K5_GUEST_REBOOT_OPERATION -ceq 'planned-shutdown-start')
            if ($evidence.reboot_operation_executed -ne $true) { throw 'Requested owned reboot operation was not observed' }
            if ($env:K5_GUEST_REBOOT_OPERATION -ceq 'planned-shutdown-start') {
              if ($evidence.proof_scope -cne 'planned-shutdown-start-recording' -or
                  $evidence.planned_shutdown_off_observed -ne $true -or $evidence.planned_start_running_observed -ne $true -or
                  $evidence.planned_shutdown_elapsed_ms -lt 0 -or $evidence.planned_shutdown_elapsed_ms -ge 40000 -or
                  $evidence.planned_start_elapsed_ms -lt 0 -or $evidence.planned_start_elapsed_ms -ge 40000 -or
                  $evidence.planned_native_config_custody_controls_passed -ne $true -or $evidence.planned_native_config_custody_control_count -ne 10 -or
                  $evidence.planned_final_off_boundary_verified -ne $true -or $evidence.planned_boundary_dismounted_before_start -ne $true -or
                  $evidence.planned_boundary_elapsed_ms -lt 0 -or $evidence.planned_boundary_elapsed_ms -ge 40000 -or
                  $evidence.planned_final_off_checkpoint_sha256 -cnotmatch '^[a-f0-9]{64}$' -or
                  $evidence.reboot_witness.planned_final_off_checkpoint_sha256 -cne $evidence.planned_final_off_checkpoint_sha256 -or
                  $evidence.reboot_witness.security_final_off_checkpoint_retained -ne $true -or
                  $evidence.reboot_witness.security_original_checkpoint_retained -ne $true -or
                  $evidence.reboot_witness.security_all_post_off_shutdown_loss_policy_and_human_or_unclassified_interactive_events_refused -ne $true) { throw 'Planned shutdown/start identity or operation bounds differ' }
            } elseif ($evidence.proof_scope -cne 'hard-reset-recording') { throw 'Hard-reset proof scope differs' }
          }
          if ($env:K5_GUEST_BOOTSTRAP_OBSERVATION -eq 'true') {
            if ($evidence.bootstrap_observation_only -ne $true -or
                $evidence.outcome -ne 'guest_initialization_diagnostic_observed' -or
                $evidence.stage -ne 'bootstrap_observation' -or $evidence.bootstrap_observation_limit_seconds -ne 240 -or
                $evidence.actual_guest_boot -ne $false -or $evidence.recording_after_reboot_before_login -ne $false -or
                $evidence.recording_after_actual_signout -ne $false -or $evidence.retained_media_decoded -ne $false -or
                $evidence.postboot_prelogin_media_decoded -ne $false -or
                $null -eq $evidence.original_image_setup_state -or $null -eq $evidence.bootstrap_observation_live -or
                $evidence.bootstrap_observation_offline.read_only_mount -ne $true -or
                $evidence.bootstrap_observation_offline.setup_state.hives_unloaded -ne $true) {
              throw 'Initialization diagnostic is incomplete or attempted qualification'
            }
          } elseif ($evidence.bootstrap_observation_only -ne $false -or
              $evidence.outcome -ne 'installer_guest_recording_observed' -or
              $evidence.actual_guest_boot -ne $true -or
              $evidence.recording_after_reboot_before_login -ne $true -or
              $evidence.recording_after_actual_signout -ne $true -or
              $evidence.retained_media_decoded -ne $true -or $evidence.postboot_prelogin_media_decoded -ne $true -or
              $evidence.reboot_witness.startup_audit_4608_verified -ne $true -or
              $evidence.reboot_witness.security_audit_checkpoint_retained -ne $true -or
              $evidence.reboot_witness.security_no_clear_reset_wrap -ne $true -or
              $evidence.reboot_witness.security_policy_coverage_verified -ne $true -or
              $evidence.reboot_witness.security_tail_stable -ne $true -or
              $evidence.reboot_witness.postboot_clip_created_after_system_inventory -ne $true) { throw 'Actual guest recording criteria remain unobserved' }
      - name: Retain diagnostic guest witnesses and exact byte provenance only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-windows-guest-recording-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows-guest-recording.json
